<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | MEI One</title>

  <meta
    name="description"
    content="Sign in to your MEI One customer account."
  >

  <style>
    :root {
      --navy: #06111f;
      --navy-2: #0a1a2b;
      --navy-3: #10263d;
      --green: #b7ff00;
      --green-hover: #c8ff3d;
      --white: #ffffff;
      --text: #e8f0f7;
      --muted: #91a4b8;
      --border: rgba(255, 255, 255, 0.10);
      --danger: #ff6474;
      --success: #5de3a0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      padding: 24px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--white);

      background:
        radial-gradient(
          circle at 85% 10%,
          rgba(183, 255, 0, 0.11),
          transparent 28%
        ),
        radial-gradient(
          circle at 10% 90%,
          rgba(0, 120, 255, 0.08),
          transparent 32%
        ),
        var(--navy);
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .page {
      width: 100%;
      max-width: 440px;
    }

    /* -------------------------------------------------------
       BRAND
       ------------------------------------------------------- */

    .brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-mark {
      width: 68px;
      height: 68px;
      margin: 0 auto 14px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 20px;

      background: var(--green);
      color: var(--navy);

      font-size: 23px;
      font-weight: 950;
      letter-spacing: -1px;

      box-shadow:
        0 0 0 1px rgba(183, 255, 0, 0.25),
        0 18px 45px rgba(183, 255, 0, 0.16);
    }

    .brand h1 {
      font-size: 32px;
      line-height: 1;
      font-weight: 950;
      letter-spacing: -1.5px;
    }

    .brand p {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    /* -------------------------------------------------------
       CARD
       ------------------------------------------------------- */

    .card {
      padding: 30px;

      border: 1px solid var(--border);
      border-radius: 24px;

      background:
        linear-gradient(
          180deg,
          rgba(16, 38, 61, 0.96),
          rgba(7, 19, 33, 0.98)
        );

      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.40);

      backdrop-filter: blur(18px);
    }

    .card-header {
      margin-bottom: 24px;
    }

    .card-header h2 {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -0.8px;
    }

    .card-header p {
      margin-top: 7px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    /* -------------------------------------------------------
       MESSAGE
       ------------------------------------------------------- */

    .message {
      display: none;

      margin-bottom: 18px;
      padding: 13px 14px;

      border-radius: 12px;

      font-size: 13px;
      line-height: 1.5;
    }

    .message.show {
      display: block;
    }

    .message.error {
      color: #ffdce0;
      background: rgba(255, 100, 116, 0.10);
      border: 1px solid rgba(255, 100, 116, 0.28);
    }

    .message.success {
      color: #d9ffeb;
      background: rgba(93, 227, 160, 0.10);
      border: 1px solid rgba(93, 227, 160, 0.28);
    }

    /* -------------------------------------------------------
       FORM
       ------------------------------------------------------- */

    .field {
      margin-bottom: 17px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;

      color: var(--text);
      font-size: 13px;
      font-weight: 800;
    }

    .field input {
      width: 100%;
      height: 52px;

      padding: 0 15px;

      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 13px;

      outline: none;

      background: rgba(0, 0, 0, 0.20);
      color: var(--white);

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .field input::placeholder {
      color: #62778b;
    }

    .field input:focus {
      border-color: var(--green);

      box-shadow:
        0 0 0 3px rgba(183, 255, 0, 0.10);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 80px;
    }

    .toggle-password {
      position: absolute;
      right: 9px;
      top: 50%;

      transform: translateY(-50%);

      padding: 8px;

      border: 0;
      background: transparent;

      color: var(--green);

      font-size: 11px;
      font-weight: 900;
    }

    .forgot-row {
      display: flex;
      justify-content: flex-end;

      margin-top: -4px;
      margin-bottom: 18px;
    }

    .forgot-button {
      padding: 3px;

      border: 0;
      background: transparent;

      color: var(--green);

      font-size: 13px;
      font-weight: 800;
    }

    /* -------------------------------------------------------
       BUTTONS
       ------------------------------------------------------- */

    .primary-button {
      width: 100%;
      min-height: 54px;

      border: 0;
      border-radius: 14px;

      background: var(--green);
      color: #07101b;

      font-size: 15px;
      font-weight: 950;

      transition:
        transform 0.2s ease,
        background 0.2s ease,
        opacity 0.2s ease;
    }

    .primary-button:hover:not(:disabled) {
      background: var(--green-hover);
      transform: translateY(-1px);
    }

    .primary-button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    .secondary-button {
      width: 100%;
      min-height: 50px;

      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 13px;

      background: rgba(255, 255, 255, 0.03);
      color: var(--white);

      font-size: 14px;
      font-weight: 850;

      transition:
        border-color 0.2s ease,
        background 0.2s ease;
    }

    .secondary-button:hover:not(:disabled) {
      border-color: rgba(183, 255, 0, 0.35);
      background: rgba(183, 255, 0, 0.05);
    }

    .secondary-button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    /* -------------------------------------------------------
       DIVIDER
       ------------------------------------------------------- */

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;

      margin: 23px 0;

      color: #60758a;

      font-size: 11px;
      font-weight: 800;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: var(--border);
    }

    /* -------------------------------------------------------
       FOOTER
       ------------------------------------------------------- */

    .footer {
      margin-top: 22px;

      text-align: center;

      color: var(--muted);
      font-size: 13px;
    }

    .footer a {
      color: var(--green);
      font-weight: 850;
    }

    /* -------------------------------------------------------
       SPINNER
       ------------------------------------------------------- */

    .spinner {
      width: 17px;
      height: 17px;

      display: inline-block;
      vertical-align: middle;

      margin-right: 8px;

      border: 2px solid rgba(0, 0, 0, 0.22);
      border-top-color: #07101b;

      border-radius: 50%;

      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* -------------------------------------------------------
       MOBILE
       ------------------------------------------------------- */

    @media (max-width: 520px) {
      body {
        padding: 15px;
      }

      .card {
        padding: 22px;
        border-radius: 20px;
      }

      .brand h1 {
        font-size: 29px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <!-- =====================================================
         BRAND
         ===================================================== -->

    <header class="brand">

      <div class="brand-mark">
        MEI
      </div>

      <h1>MEI One</h1>

      <p>
        One platform. Connected services.
      </p>

    </header>

    <!-- =====================================================
         LOGIN CARD
         ===================================================== -->

    <section class="card">

      <div class="card-header">

        <h2>
          Welcome back
        </h2>

        <p>
          Sign in to access your MEI One customer dashboard.
        </p>

      </div>

      <div
        id="message"
        class="message"
        role="alert"
        aria-live="polite"
      ></div>

      <form
        id="loginForm"
        novalidate
      >

        <!-- EMAIL -->

        <div class="field">

          <label for="email">
            Email address
          </label>

          <input
            id="email"
            name="email"
            type="email"
            autocomplete="username"
            placeholder="you@example.com"
            required
          >

        </div>

        <!-- PASSWORD -->

        <div class="field">

          <label for="password">
            Password
          </label>

          <div class="password-wrap">

            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Enter your password"
              required
            >

            <button
              type="button"
              class="toggle-password"
              id="togglePassword"
            >
              SHOW
            </button>

          </div>

        </div>

        <!-- FORGOT PASSWORD -->

        <div class="forgot-row">

          <button
            type="button"
            class="forgot-button"
            id="forgotPassword"
          >
            Forgot password?
          </button>

        </div>

        <!-- SIGN IN -->

        <button
          type="submit"
          class="primary-button"
          id="loginButton"
        >
          Sign In
        </button>

      </form>

      <!-- DIVIDER -->

      <div class="divider">
        OR
      </div>

      <!-- SIGN UP -->

      <button
        type="button"
        class="secondary-button"
        id="signupButton"
      >
        Create a MEI One account
      </button>

    </section>

    <!-- FOOTER -->

    <footer class="footer">

      © <span id="year"></span> MEI One.
      All rights reserved.

    </footer>

  </main>

  <!-- =========================================================
       MEI ONE CONFIGURATION
       ========================================================= -->

  <script src="js/config.js"></script>

  <!-- =========================================================
       SUPABASE SDK
       ========================================================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

  <!-- =========================================================
       MEI ONE SUPABASE CLIENT
       ========================================================= -->

  <script src="js/supabase.js"></script>

  <!-- =========================================================
       LOGIN LOGIC
       ========================================================= -->

  <script>
    (function () {

      "use strict";

      /* -------------------------------------------------------
         ELEMENTS
         ------------------------------------------------------- */

      const form =
        document.getElementById("loginForm");

      const emailInput =
        document.getElementById("email");

      const passwordInput =
        document.getElementById("password");

      const loginButton =
        document.getElementById("loginButton");

      const togglePassword =
        document.getElementById("togglePassword");

      const forgotPassword =
        document.getElementById("forgotPassword");

      const signupButton =
        document.getElementById("signupButton");

      const message =
        document.getElementById("message");

      const year =
        document.getElementById("year");

      year.textContent =
        new Date().getFullYear();

      /* -------------------------------------------------------
         SUPABASE CLIENT
         ------------------------------------------------------- */

      const supabase =
        window.supabaseClient ||
        window.MEISupabase;

      /* -------------------------------------------------------
         MESSAGE
         ------------------------------------------------------- */

      function showMessage(
        text,
        type = "error"
      ) {

        message.textContent =
          text;

        message.className =
          "message show " + type;

      }

      function clearMessage() {

        message.textContent =
          "";

        message.className =
          "message";

      }

      /* -------------------------------------------------------
         TIMEOUT
         ------------------------------------------------------- */

      function withTimeout(
        promise,
        timeout,
        label
      ) {

        return Promise.race([

          promise,

          new Promise(
            function (_, reject) {

              setTimeout(
                function () {

                  reject(
                    new Error(
                      label +
                      " timed out. Please check your connection and try again."
                    )
                  );

                },
                timeout
              );

            }
          )

        ]);

      }

      /* -------------------------------------------------------
         CHECK SUPABASE
         ------------------------------------------------------- */

      function ensureSupabase() {

        if (!supabase) {

          throw new Error(
            "MEI One could not connect to Supabase. Check js/config.js and js/supabase.js."
          );

        }

      }

      /* -------------------------------------------------------
         PASSWORD VISIBILITY
         ------------------------------------------------------- */

      togglePassword.addEventListener(
        "click",
        function () {

          const isPassword =
            passwordInput.type === "password";

          passwordInput.type =
            isPassword
              ? "text"
              : "password";

          togglePassword.textContent =
            isPassword
              ? "HIDE"
              : "SHOW";

        }
      );

      /* -------------------------------------------------------
         LOADING STATE
         ------------------------------------------------------- */

      function setLoading(
        loading
      ) {

        loginButton.disabled =
          loading;

        forgotPassword.disabled =
          loading;

        signupButton.disabled =
          loading;

        if (loading) {

          loginButton.innerHTML =
            '<span class="spinner"></span>Signing in...';

        } else {

          loginButton.textContent =
            "Sign In";

        }

      }

      /* -------------------------------------------------------
         LOGIN
         ------------------------------------------------------- */

      form.addEventListener(
        "submit",
        async function (event) {

          event.preventDefault();

          clearMessage();

          const email =
            emailInput.value
              .trim()
              .toLowerCase();

          const password =
            passwordInput.value;

          /* VALIDATION */

          if (!email) {

            showMessage(
              "Please enter your email address."
            );

            emailInput.focus();

            return;

          }

          if (!password) {

            showMessage(
              "Please enter your password."
            );

            passwordInput.focus();

            return;

          }

          setLoading(true);

          try {

            ensureSupabase();

            console.log(
              "MEI One: Starting customer login..."
            );

            /* -----------------------------------------------
               AUTHENTICATE
               ----------------------------------------------- */

            const result =
              await withTimeout(
                supabase.auth.signInWithPassword({
                  email: email,
                  password: password
                }),
                15000,
                "Supabase login request"
              );

            console.log(
              "MEI One: Login response:",
              result
            );

            if (result.error) {

              throw result.error;

            }

            if (!result.data?.session) {

              throw new Error(
                "Login completed but no active session was returned."
              );

            }

            console.log(
              "MEI One: Customer authentication successful."
            );

            showMessage(
              "Login successful. Opening your dashboard...",
              "success"
            );

            /* -----------------------------------------------
               SHORT DELAY TO ALLOW SESSION PERSISTENCE
               ----------------------------------------------- */

            await new Promise(
              function (resolve) {

                setTimeout(
                  resolve,
                  300
                );

              }
            );

            /* -----------------------------------------------
               CUSTOMER DASHBOARD
               ----------------------------------------------- */

            console.log(
              "MEI One: Redirecting to dashboard.html"
            );

            window.location.replace(
              "dashboard.html"
            );

          } catch (error) {

            console.error(
              "MEI One login error:",
              error
            );

            let errorMessage =
              error?.message ||
              "Login failed. Please try again.";

            /* FRIENDLIER SUPABASE MESSAGES */

            if (
              errorMessage
                .toLowerCase()
                .includes(
                  "invalid login credentials"
                )
            ) {

              errorMessage =
                "Incorrect email or password.";

            }

            if (
              errorMessage
                .toLowerCase()
                .includes(
                  "email not confirmed"
                )
            ) {

              errorMessage =
                "Please confirm your email address before signing in.";

            }

            showMessage(
              errorMessage
            );

          } finally {

            setLoading(false);

          }

        }
      );

      /* -------------------------------------------------------
         FORGOT PASSWORD
         ------------------------------------------------------- */

      forgotPassword.addEventListener(
        "click",
        async function () {

          clearMessage();

          const email =
            emailInput.value
              .trim()
              .toLowerCase();

          if (!email) {

            showMessage(
              "Enter your email address first."
            );

            emailInput.focus();

            return;

          }

          try {

            ensureSupabase();

            forgotPassword.disabled =
              true;

            const redirectUrl =
              window.location.origin +
              "/login.html";

            const result =
              await withTimeout(
                supabase.auth.resetPasswordForEmail(
                  email,
                  {
                    redirectTo:
                      redirectUrl
                  }
                ),
                15000,
                "Password reset request"
              );

            if (result.error) {

              throw result.error;

            }

            showMessage(
              "If the email exists, a password reset link has been sent.",
              "success"
            );

          } catch (error) {

            console.error(
              "MEI One password reset error:",
              error
            );

            showMessage(
              error?.message ||
              "Password reset failed."
            );

          } finally {

            forgotPassword.disabled =
              false;

          }

        }
      );

      /* -------------------------------------------------------
         SIGN UP
         ------------------------------------------------------- */

      signupButton.addEventListener(
        "click",
        function () {

          window.location.href =
            "signup.html";

        }
      );

      /* -------------------------------------------------------
         INITIALISE
         ------------------------------------------------------- */

      try {

        ensureSupabase();

        console.log(
          "MEI One: Customer login ready."
        );

      } catch (error) {

        console.error(
          "MEI One initialization error:",
          error
        );

        showMessage(
          error.message
        );

      }

    })();
  </script>

</body>
</html>
