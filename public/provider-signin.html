

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071a2f">
  <meta name="description" content="Sign in to your MEI One provider account.">

  <title>Provider Sign In | MEI One</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: grid;
      place-items: center;
      background: #071a2f;
      color: #fff;
      font-family: Inter, Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 35px;
      background: #102640;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
    }

    .logo {
      color: #00ff88;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    h1 {
      margin: 25px 0 8px;
      font-size: 25px;
    }

    p {
      color: #aebdce;
      font-size: 14px;
      line-height: 1.6;
    }

    input {
      display: block;
      width: 100%;
      margin: 12px 0;
      padding: 14px;
      border: 1px solid #38516c;
      border-radius: 9px;
      outline: none;
      background: #071a2f;
      color: #fff;
      font-family: inherit;
      font-size: 15px;
    }

    input:focus {
      border-color: #00ff88;
      box-shadow: 0 0 0 3px rgba(0,255,136,.1);
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #00ff88;
      color: #071a2f;
      font-family: inherit;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .forgot {
      margin-top: 8px;
      text-align: right;
      font-size: 13px;
    }

    .switch {
      margin-top: 20px;
      color: #aebdce;
      font-size: 14px;
      text-align: center;
    }

    a {
      color: #00ff88;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    #message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      overflow-wrap: anywhere;
      font-size: 13px;
      line-height: 1.5;
    }

    #message.error {
      display: block;
      background: rgba(255,75,75,.12);
      color: #ffaaaa;
    }

    #message.success {
      display: block;
      background: rgba(0,255,136,.1);
      color: #00ff88;
    }

    #message.info {
      display: block;
      background: rgba(255,255,255,.07);
      color: #d5e2ef;
    }

    @media (max-width: 480px) {
      .card {
        padding: 25px;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo">MEI ONE</div>

    <p>MEI One Provider Portal</p>

    <h1>Provider Sign In</h1>

    <p>
      Sign in to manage your driver and service provider account.
    </p>

    <form id="loginForm">

      <input
        id="email"
        type="email"
        placeholder="Email address"
        autocomplete="username"
        required
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <div class="forgot">
        <a href="#" id="forgotPassword">Forgot password?</a>
      </div>

      <button type="submit" id="loginButton">
        Sign In
      </button>

    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <div class="switch">
      New provider?
      <a href="/provider/register.html">Apply to become a provider</a>
    </div>

    <div class="switch">
      <a href="/customer-signin.html">Customer sign in</a>
    </div>

    <div class="switch">
      <a href="/index.html">← Back to MEI One</a>
    </div>

  </main>

  <!-- Supabase and shared MEI configuration -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>

  <script>
    "use strict";

    const sb = window.MEI_SUPABASE;

    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const forgotPassword = document.getElementById("forgotPassword");

    let redirecting = false;

    const PROVIDER_DASHBOARD = "/provider/dashboard.html";

    function showMessage(text, type = "info") {
      message.textContent = text;
      message.className = type;
    }

    function setLoading(loading) {
      button.disabled = loading;
      button.textContent = loading ? "Please wait..." : "Sign In";
    }

    function getDashboardUrl() {
      return new URL(
        PROVIDER_DASHBOARD,
        window.location.origin
      ).href;
    }

    // Confirm shared Supabase initialization.
    if (!sb) {
      showMessage(
        "Connection unavailable. Please check the MEI One Supabase configuration.",
        "error"
      );

      button.disabled = true;
      form.querySelectorAll("input").forEach(input => {
        input.disabled = true;
      });
    }

    // PROVIDER SIGN IN
    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      if (!sb || redirecting) return;

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showMessage("Enter your email and password.", "error");
        return;
      }

      setLoading(true);
      showMessage("Authenticating your account...", "info");

      let authenticated = false;

      try {
        // 1. Authenticate the user.
        const { data, error } = await sb.auth.signInWithPassword({
          email,
          password
        });

        if (error) throw error;

        if (!data.user) {
          throw new Error("Authentication failed. Please try again.");
        }

        authenticated = true;

        // 2. Verify the driver's database record.
        const {
          data: driver,
          error: driverError
        } = await sb
          .from("drivers")
          .select("id, name, active")
          .eq("id", data.user.id)
          .maybeSingle();

        if (driverError) {
          console.error("Driver verification error:", driverError);

          throw new Error(
            "We could not verify your provider account. " +
            driverError.message
          );
        }

        // 3. Ensure the account is registered as a driver.
        if (!driver) {
          throw new Error(
            "No provider account was found for this login. " +
            "Please apply to become a provider."
          );
        }

        // 4. Ensure the provider is active.
        if (driver.active !== true) {
          throw new Error(
            "Your provider account is not active. " +
            "Please contact MEI One support."
          );
        }

        // 5. Redirect to the provider dashboard.
        showMessage(
          "Login successful. Redirecting to your provider dashboard...",
          "success"
        );

        redirecting = true;

        window.location.replace(getDashboardUrl());

      } catch (error) {
        console.error("MEI One provider sign-in error:", error);

        // Clear the session when provider verification fails.
        if (authenticated) {
          const { error: signOutError } = await sb.auth.signOut();

          if (signOutError) {
            console.error("Sign-out error:", signOutError);
          }
        }

        showMessage(
          error.message || "Unable to sign in. Please try again.",
          "error"
        );

      } finally {
        if (!redirecting) {
          setLoading(false);
        }
      }
    });

    // PASSWORD RESET
    forgotPassword.addEventListener("click", async function(event) {
      event.preventDefault();

      if (!sb) {
        showMessage("Supabase connection is unavailable.", "error");
        return;
      }

      const email = emailInput.value.trim();

      if (!email) {
        showMessage(
          "Enter your email address first.",
          "error"
        );
        emailInput.focus();
        return;
      }

      try {
        forgotPassword.style.pointerEvents = "none";

        showMessage(
          "Sending password reset instructions...",
          "info"
        );

        const { error } = await sb.auth.resetPasswordForEmail(email, {
          redirectTo: new URL(
            "/provider-signin.html",
            window.location.origin
          ).href
        });

        if (error) throw error;

        showMessage(
          "If this email is registered, password reset instructions will be sent.",
          "success"
        );

      } catch (error) {
        console.error("Password reset error:", error);
        showMessage(error.message, "error");

      } finally {
        forgotPassword.style.pointerEvents = "";
      }
    });

  </script>

</body>
</html>
