<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071a2f">
  <meta name="description" content="Sign in to your MEI One provider account.">
  <title>Provider Sign In | MEI One</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #071a2f;
      --navy-800: #0b2138;
      --navy-700: #102640;
      --green: #00ff88;
      --green-dark: #00d68f;
      --green-dim: rgba(0, 255, 136, .1);
      --green-glow: rgba(0, 255, 136, .35);
      --white: #ffffff;
      --muted: #aebdce;
      --muted-dim: #7f95ab;
      --border: #38516c;
      --danger: #ff4b4b;
      --danger-text: #ffaaaa;
      --danger-bg: rgba(255, 75, 75, .12);
      --success-text: #00ff88;
      --success-bg: rgba(0, 255, 136, .1);
      --info-text: #d5e2ef;
      --info-bg: rgba(255, 255, 255, .07);
      --transition: .2s cubic-bezier(.4, 0, .2, 1);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      min-height: 100vh;
      padding: 24px;
      display: grid;
      place-items: center;
      background: var(--navy);
      background-image:
        radial-gradient(circle at 15% 10%, rgba(0, 255, 136, .12), transparent 40%),
        radial-gradient(circle at 85% 90%, rgba(0, 214, 143, .08), transparent 40%);
      background-attachment: fixed;
      color: var(--white);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- CARD ---------- */
    .card {
      width: 100%;
      max-width: 440px;
      padding: 36px;
      background: var(--navy-700);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 20px;
      box-shadow:
        0 24px 80px rgba(0, 0, 0, .4),
        0 0 0 1px rgba(0, 255, 136, .03);
      animation: slideUp .5s cubic-bezier(.16, 1, .3, 1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      display: inline-block;
      font-size: 26px;
      font-weight: 800;
      color: var(--green);
      letter-spacing: -1px;
      text-decoration: none;
      transition: opacity var(--transition);
    }

    .logo:hover {
      opacity: .85;
    }

    .logo span {
      color: var(--white);
      font-weight: 500;
    }

    .eyebrow {
      margin-top: 20px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--muted-dim);
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -.5px;
      margin: 6px 0 8px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14.5px;
      margin-bottom: 28px;
    }

    /* ---------- FORM ---------- */
    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      display: block;
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      outline: none;
      background: rgba(7, 26, 47, .6);
      color: var(--white);
      font-size: 15px;
      font-family: inherit;
      transition: all var(--transition);
    }

    input::placeholder {
      color: #5a738e;
    }

    input:hover:not(:disabled) {
      border-color: #4a6a8a;
    }

    input:focus {
      border-color: var(--green);
      background: rgba(7, 26, 47, .9);
      box-shadow: 0 0 0 4px var(--green-dim);
    }

    input:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    input.invalid {
      border-color: var(--danger);
      box-shadow: 0 0 0 4px rgba(255, 75, 75, .1);
    }

    .password-wrap input {
      padding-right: 74px;
    }

    .toggle-password {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: 0;
      color: var(--green);
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      padding: 8px 10px;
      border-radius: 8px;
      transition: background var(--transition);
    }

    .toggle-password:hover {
      background: var(--green-dim);
    }

    .field-hint {
      font-size: 12px;
      color: var(--muted-dim);
      margin-top: 6px;
    }

    .field-hint.error {
      color: var(--danger-text);
    }

    .forgot {
      text-align: right;
      margin: 4px 0 22px;
      font-size: 13.5px;
    }

    /* ---------- BUTTONS ---------- */
    .primary-btn {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: var(--radius);
      background: var(--green);
      color: var(--navy);
      font-weight: 800;
      font-size: 15.5px;
      font-family: inherit;
      cursor: pointer;
      transition: all var(--transition);
      box-shadow: 0 4px 15px rgba(0, 255, 136, .25);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .primary-btn:hover:not(:disabled) {
      background: #5cffb0;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0, 255, 136, .35);
    }

    .primary-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .primary-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
      box-shadow: none;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(7, 26, 47, .3);
      border-top-color: var(--navy);
      border-radius: 50%;
      animation: spin .6s linear infinite;
      display: none;
    }

    .primary-btn.loading .spinner {
      display: inline-block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ---------- MESSAGE ---------- */
    #message {
      display: none;
      padding: 13px 15px;
      border-radius: var(--radius);
      font-size: 13.5px;
      font-weight: 500;
      overflow-wrap: anywhere;
      line-height: 1.5;
      margin-top: 18px;
      animation: fadeIn .3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #message.error {
      display: block;
      background: var(--danger-bg);
      color: var(--danger-text);
      border: 1px solid rgba(255, 75, 75, .25);
    }

    #message.success {
      display: block;
      background: var(--success-bg);
      color: var(--success-text);
      border: 1px solid rgba(0, 255, 136, .25);
    }

    #message.info {
      display: block;
      background: var(--info-bg);
      color: var(--info-text);
      border: 1px solid rgba(255, 255, 255, .1);
    }

    /* ---------- DIVIDER ---------- */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 26px 0 20px;
      color: var(--muted-dim);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, .08);
    }

    /* ---------- LINKS ---------- */
    .switch {
      text-align: center;
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .switch:last-child {
      margin-bottom: 0;
    }

    a {
      color: var(--green);
      text-decoration: none;
      font-weight: 600;
      transition: color var(--transition);
    }

    a:hover {
      color: #5cffb0;
      text-decoration: underline;
    }

    .apply-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      color: var(--green);
    }

    .apply-link:hover {
      text-decoration: none;
    }

    .apply-link .arrow {
      transition: transform var(--transition);
      display: inline-block;
    }

    .apply-link:hover .arrow {
      transform: translateX(4px);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted-dim);
      font-weight: 500;
    }

    .back-link:hover {
      color: var(--white);
      text-decoration: none;
    }

    /* ---------- ACCESSIBILITY ---------- */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    :focus-visible {
      outline: 2px solid var(--green);
      outline-offset: 3px;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }
      .card {
        padding: 28px 22px;
      }
      h1 {
        font-size: 23px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

  <main class="card" role="main">

    <a class="logo" href="/index.html" aria-label="MEI One home">
      MEI <span>One</span>
    </a>

    <p class="eyebrow">Provider Portal</p>

    <h1>Provider Sign In</h1>

    <p class="subtitle">
      Access your driver and service provider dashboard.
    </p>

    <form id="loginForm" novalidate>

      <div class="field">
        <label for="email">Email address</label>
        <input
          id="email"
          type="email"
          placeholder="you@example.com"
          autocomplete="username"
          spellcheck="false"
          inputmode="email"
          required
        >
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap password-wrap">
          <input
            id="password"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
          <button
            type="button"
            class="toggle-password"
            id="togglePassword"
            aria-label="Show password"
          >
            Show
          </button>
        </div>
      </div>

      <div class="forgot">
        <a href="#" id="forgotPassword">Forgot password?</a>
      </div>

      <button type="submit" class="primary-btn" id="loginButton">
        <span class="spinner" aria-hidden="true"></span>
        <span id="loginButtonText">Sign In</span>
      </button>

    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <div class="divider">New to MEI One?</div>

    <div class="switch">
      <a href="/partner-apply.html" id="applyProviderLink" class="apply-link">
        Apply to become a provider
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </div>

    <div class="switch">
      <a href="/customer-signin.html">Customer sign in</a>
    </div>

    <div class="switch">
      <a href="/index.html" class="back-link">
        <span aria-hidden="true">←</span> Back to MEI One
      </a>
    </div>

  </main>

  <!-- Load Supabase before the MEI configuration -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>

  <script>
    "use strict";

    const sb = window.MEI_SUPABASE;

    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const buttonText = document.getElementById("loginButtonText");
    const message = document.getElementById("message");

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const toggleBtn = document.getElementById("togglePassword");

    // --- Show / Hide password ---
    toggleBtn.addEventListener("click", () => {
      const isPassword = passwordInput.type === "password";
      passwordInput.type = isPassword ? "text" : "password";
      toggleBtn.textContent = isPassword ? "Hide" : "Show";
      toggleBtn.setAttribute("aria-label", isPassword ? "Hide password" : "Show password");
    });

    // --- UI helpers ---
    function showMessage(text, type = "info") {
      message.textContent = text;
      message.className = type;
    }

    function clearMessage() {
      message.textContent = "";
      message.className = "";
    }

    function setLoading(loading) {
      button.disabled = loading;
      button.classList.toggle("loading", loading);
      buttonText.textContent = loading ? "Signing in..." : "Sign In";
    }

    function markInvalid(input, invalid) {
      input.classList.toggle("invalid", invalid);
    }

    // --- Friendly error messages ---
    function translateError(error) {
      const msg = String(error?.message || "").toLowerCase();
      if (msg.includes("invalid login credentials")) {
        return "Incorrect email or password. Please try again.";
      }
      if (msg.includes("email not confirmed")) {
        return "Please confirm your email address before signing in.";
      }
      if (msg.includes("rate limit") || msg.includes("too many")) {
        return "Too many attempts. Please wait a moment and try again.";
      }
      return error?.message || "Unable to sign in. Please try again.";
    }

    // --- Supabase availability ---
    if (!sb) {
      showMessage(
        "MEI One could not connect to Supabase. Check your configuration and script loading order.",
        "error"
      );
      button.disabled = true;
    }

    // --- Clear invalid state on input ---
    [emailInput, passwordInput].forEach((el) => {
      el.addEventListener("input", () => markInvalid(el, false));
    });

    // --- Provider sign in ---
    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      if (!sb) return;

      clearMessage();

      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value;

      let hasError = false;

      if (!email) {
        markInvalid(emailInput, true);
        hasError = true;
      } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        markInvalid(emailInput, true);
        showMessage("Please enter a valid email address.", "error");
        return;
      }

      if (!password) {
        markInvalid(passwordInput, true);
        hasError = true;
      }

      if (hasError) {
        showMessage("Please enter your email and password.", "error");
        (email ? passwordInput : emailInput).focus();
        return;
      }

      setLoading(true);
      showMessage("Authenticating your account...", "info");

      try {
        // 1. Authenticate with Supabase
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
        if (!data.user) throw new Error("Authentication failed. Please try again.");

        // 2. Verify the provider (driver) record
        const { data: driver, error: driverError } = await sb
          .from("drivers")
          .select("id, name, active")
          .eq("id", data.user.id)
          .maybeSingle();

        if (driverError) {
          throw new Error("Unable to verify your provider account: " + driverError.message);
        }

        // 3. Reject accounts without a provider record
        if (!driver) {
          await sb.auth.signOut();
          throw new Error("No provider account was found. Please apply to become a provider.");
        }

        // 4. Check activation
        if (driver.active !== true) {
          await sb.auth.signOut();
          throw new Error("Your provider account is inactive. Please contact MEI One support.");
        }

        // 5. Success — redirect
        showMessage("Sign in successful. Opening your dashboard...", "success");
        window.location.replace("/provider-dashboard.html");

      } catch (error) {
        console.error("MEI One provider sign-in error:", error);
        showMessage(translateError(error), "error");
        setLoading(false);
      }
    });

    // --- Password reset ---
    document.getElementById("forgotPassword").addEventListener("click", async function (event) {
      event.preventDefault();
      if (!sb) {
        showMessage("Supabase is unavailable.", "error");
        return;
      }

      const email = emailInput.value.trim().toLowerCase();

      if (!email) {
        markInvalid(emailInput, true);
        showMessage("Enter your email address first to reset your password.", "error");
        emailInput.focus();
        return;
      }

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        markInvalid(emailInput, true);
        showMessage("Please enter a valid email address.", "error");
        emailInput.focus();
        return;
      }

      try {
        showMessage("Sending password reset instructions...", "info");

        const { error } = await sb.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + "/provider-signin.html"
        });

        if (error) throw error;

        showMessage(
          "If this email is registered, password reset instructions will be sent.",
          "success"
        );

      } catch (error) {
        console.error("Password reset error:", error);
        showMessage(translateError(error), "error");
      }
    });

    // --- Apply to become a provider (explicit redirect) ---
    document.getElementById("applyProviderLink").addEventListener("click", function (event) {
      event.preventDefault();
      window.location.href = "/partner-apply.html";
    });
  </script>

</body>
</html>
