
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071a2f">
  <title>Provider Sign In | MEI One</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#071a2f;color:white;font-family:Inter,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}
    .card{width:100%;max-width:430px;background:#102640;padding:35px;border-radius:18px}
    .logo{font-size:27px;font-weight:800;color:#00ff88}
    h1{font-size:25px;margin-bottom:8px}
    p{color:#aebdce;line-height:1.5}
    input{width:100%;padding:14px;margin:9px 0;border:1px solid #38516c;border-radius:9px;background:#071a2f;color:white;font-size:15px}
    button{width:100%;padding:14px;border:0;border-radius:9px;background:#00ff88;color:#071a2f;font-weight:800;font-size:15px;cursor:pointer;margin-top:12px}
    .switch{text-align:center;margin-top:20px;font-size:14px}
    a{color:#00ff88;text-decoration:none}
    #message{font-size:14px;margin-top:15px;overflow-wrap:anywhere}
  </style>
</head>
<body>
<div class="card">
  <div class="logo">MEI ONE</div>
  <p>MEI One Provider Portal</p>
  <h1>Provider Sign In</h1>
  <p>Access your driver and service provider dashboard.</p>

  <form id="loginForm">
    <input id="email" type="email" placeholder="Email address" autocomplete="email" required>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <button type="submit">Sign In</button>
  </form>

  <p id="message" role="status"></p>
  <div class="switch">
    New provider? <a href="/provider/register.html">Apply to become a provider</a>
  </div>
  <div class="switch">
    <a href="/customer-signin.html">Customer sign in</a>
  </div>
</div>

<script>
const SUPABASE_URL = "https://tsvejnzxrxrrecgquxbq.supabase.co";
const SUPABASE_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

document.getElementById("loginForm").onsubmit = async e => {
  e.preventDefault();
  const message = document.getElementById("message");
  message.textContent = "Signing in...";

  try {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const {data, error} = await sb.auth.signInWithPassword({email, password});
    if (error) throw error;

    const {data: driver, error: driverError} = await sb
      .from("drivers")
      .select("id,active")
      .eq("id", data.user.id)
      .maybeSingle();

    if (driverError) throw driverError;

    if (!driver) {
      await sb.auth.signOut();
      throw new Error("No provider account was found. Please apply first.");
    }

    if (!driver.active) {
      await sb.auth.signOut();
      throw new Error("Your provider account is inactive. Contact MEI One support.");
    }

    location.href = "/provider/dashboard.html";
  } catch (error) {
    message.textContent = error.message;
  }
};
</script>
</body>
</html>
