
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071a2f">
  <meta name="description" content="Sign in to your MEI One provider account.">
  <title>Provider Sign In | MEI One</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #071a2f;
      --navy-700: #102640;
      --green: #00ff88;
      --green-dim: rgba(0,255,136,.1);
      --white: #fff;
      --muted: #aebdce;
      --muted-dim: #7f95ab;
      --border: #38516c;
      --danger-text: #ffaaaa;
      --danger-bg: rgba(255,75,75,.12);
      --success-bg: rgba(0,255,136,.1);
      --info-bg: rgba(255,255,255,.07);
      --radius: 12px;
      --transition: .2s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      padding: 24px;
      display: grid;
      place-items: center;
      background: var(--navy);
      background-image:
        radial-gradient(circle at 15% 10%, rgba(0,255,136,.12), transparent 40%),
        radial-gradient(circle at 85% 90%, rgba(0,214,143,.08), transparent 40%);
      background-attachment: fixed;
      color: var(--white);
      font-family: Inter, Arial, sans-serif;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 36px;
      background: var(--navy-700);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 20px;
      box-shadow: 0 24px 80px rgba(0,0,0,.4);
      animation: slideUp .4s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      display: inline-block;
      font-size: 26px;
      font-weight: 800;
      color: var(--green);
      letter-spacing: -1px;
      text-decoration: none;
    }

    .logo span {
      color: var(--white);
      font-weight: 500;
    }

    .eyebrow {
      margin-top: 20px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--muted-dim);
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      margin: 6px 0 8px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14.5px;
      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
    }

    input {
      display: block;
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      outline: none;
      background: rgba(7,26,47,.6);
      color: var(--white);
      font-size: 15px;
      font-family: inherit;
      transition: all var(--transition);
    }

    input::placeholder {
      color: #5a738e;
    }

    input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 4px var(--green-dim);
    }

    input:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    input.invalid {
      border-color: #ff4b4b;
      box-shadow: 0 0 0 4px rgba(255,75,75,.1);
    }

    .password-wrap input {
      padding-right: 74px;
    }

    .toggle-password {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: 0;
      color: var(--green);
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      padding: 8px 10px;
    }

    .forgot {
      text-align: right;
      margin: 4px 0 22px;
      font-size: 13.5px;
    }

    .primary-btn {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: var(--radius);
      background: var(--green);
      color: var(--navy);
      font-weight: 800;
      font-size: 15.5px;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all var(--transition);
    }

    .primary-btn:hover:not(:disabled) {
      background: #5cffb0;
      transform: translateY(-1px);
    }

    .primary-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(7,26,47,.3);
      border-top-color: var(--navy);
      border-radius: 50%;
      animation: spin .6s linear infinite;
      display: none;
    }

    .primary-btn.loading .spinner {
      display: inline-block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #message {
      display: none;
      padding: 13px 15px;
      border-radius: var(--radius);
      font-size: 13.5px;
      overflow-wrap: anywhere;
      line-height: 1.5;
      margin-top: 18px;
    }

    #message.error {
      display: block;
      background: var(--danger-bg);
      color: var(--danger-text);
      border: 1px solid rgba(255,75,75,.25);
    }

    #message.success {
      display: block;
      background: var(--success-bg);
      color: var(--green);
      border: 1px solid rgba(0,255,136,.25);
    }

    #message.info {
      display: block;
      background: var(--info-bg);
      color: #d5e2ef;
      border: 1px solid rgba(255,255,255,.1);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 26px 0 20px;
      color: var(--muted-dim);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,.08);
    }

    .switch {
      text-align: center;
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .switch:last-child {
      margin-bottom: 0;
    }

    a {
      color: var(--green);
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      color: #5cffb0;
      text-decoration: underline;
    }

    .apply-link {
      font-weight: 700;
    }

    .back-link {
      color: var(--muted-dim);
      font-weight: 500;
    }

    :focus-visible {
      outline: 2px solid var(--green);
      outline-offset: 3px;
    }

    @media (max-width: 480px) {
      body { padding: 16px; }
      .card { padding: 28px 22px; }
      h1 { font-size: 23px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <a class="logo" href="/index.html" aria-label="MEI One home">
      MEI <span>One</span>
    </a>

    <p class="eyebrow">Provider Portal</p>
    <h1>Provider Sign In</h1>

    <p class="subtitle">
      Access your driver and service provider dashboard.
    </p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email address</label>
        <input
          id="email"
          type="email"
          placeholder="you@example.com"
          autocomplete="username"
          spellcheck="false"
          inputmode="email"
          required
        >
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap password-wrap">
          <input
            id="password"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
          <button
            type="button"
            class="toggle-password"
            id="togglePassword"
            aria-label="Show password"
          >Show</button>
        </div>
      </div>

      <div class="forgot">
        <a href="#" id="forgotPassword">Forgot password?</a>
      </div>

      <button type="submit" class="primary-btn" id="loginButton">
        <span class="spinner" aria-hidden="true"></span>
        <span id="loginButtonText">Sign In</span>
      </button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <div class="divider">New to MEI One?</div>

    <div class="switch">
      <a href="/partner-apply.html" class="apply-link">
        Apply to become a provider →
      </a>
    </div>

    <div class="switch">
      <a href="/customer-signin.html">Customer sign in</a>
    </div>

    <div class="switch">
      <a href="/index.html" class="back-link">← Back to MEI One</a>
    </div>
  </main>

  <!-- Shared MEI One Supabase configuration -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>

  <script>
    "use strict";

    const sb = window.MEI_SUPABASE;

    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const buttonText = document.getElementById("loginButtonText");
    const message = document.getElementById("message");

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const toggleBtn = document.getElementById("togglePassword");

    function showMessage(text, type = "info") {
      message.textContent = text;
      message.className = type;
    }

    function clearMessage() {
      message.textContent = "";
      message.className = "";
    }

    function setLoading(loading) {
      button.disabled = loading;
      button.classList.toggle("loading", loading);
      buttonText.textContent = loading ? "Signing in..." : "Sign In";
    }

    function markInvalid(input, invalid) {
      input.classList.toggle("invalid", invalid);
    }

    function translateError(error) {
      const msg = String(error?.message || "").toLowerCase();

      if (msg.includes("invalid login credentials")) {
        return "Incorrect email or password. Please try again.";
      }

      if (msg.includes("email not confirmed")) {
        return "Please confirm your email address before signing in.";
      }

      if (msg.includes("rate limit") || msg.includes("too many")) {
        return "Too many attempts. Please wait a moment and try again.";
      }

      if (msg.includes("failed to fetch")) {
        return "Unable to connect to MEI One. Check your internet connection and try again.";
      }

      return error?.message || "Unable to sign in. Please try again.";
    }

    function validEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    // Verify the shared Supabase client.
    if (!sb || !sb.auth || typeof sb.from !== "function") {
      showMessage(
        "MEI One could not initialize Supabase. Check /js/config.js and ensure the Supabase script loads first.",
        "error"
      );
      button.disabled = true;
    }

    // Show / hide password.
    toggleBtn.addEventListener("click", () => {
      const show = passwordInput.type === "password";
      passwordInput.type = show ? "text" : "password";
      toggleBtn.textContent = show ? "Hide" : "Show";
      toggleBtn.setAttribute(
        "aria-label",
        show ? "Hide password" : "Show password"
      );
    });

    // Clear invalid field styling.
    [emailInput, passwordInput].forEach(input => {
      input.addEventListener("input", () => markInvalid(input, false));
    });

    // Provider sign in.
    form.addEventListener("submit", async event => {
      event.preventDefault();

      if (!sb || !sb.auth || typeof sb.from !== "function") {
        showMessage("Supabase is unavailable. Please contact MEI One support.", "error");
        return;
      }

      clearMessage();

      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value;

      if (!email || !validEmail(email)) {
        markInvalid(emailInput, true);
        showMessage("Please enter a valid email address.", "error");
        emailInput.focus();
        return;
      }

      if (!password) {
        markInvalid(passwordInput, true);
        showMessage("Please enter your password.", "error");
        passwordInput.focus();
        return;
      }

      setLoading(true);
      showMessage("Authenticating your account...", "info");

      let authenticated = false;

      try {
        // 1. Authenticate the user.
        const { data, error } = await sb.auth.signInWithPassword({
          email,
          password
        });

        if (error) throw error;

        if (!data?.user?.id) {
          throw new Error("Authentication failed. Please try again.");
        }

        authenticated = true;

        // 2. Find the provider record using the actual partners schema.
        const { data: partner, error: partnerError } = await sb
          .from("partners")
          .select("id, user_id, type, business_name, phone, status, is_online")
          .eq("user_id", data.user.id)
          .maybeSingle();

        if (partnerError) {
          throw new Error(
            "Unable to verify your provider account: " + partnerError.message
          );
        }

        // 3. Reject users without a provider record.
        if (!partner) {
          await sb.auth.signOut();
          authenticated = false;

          throw new Error(
            "No provider account was found for this login. Please apply to become a provider."
          );
        }

        // 4. Only approved providers can access the provider dashboard.
        if (String(partner.status || "").toLowerCase() !== "approved") {
          await sb.auth.signOut();
          authenticated = false;

          const status = String(partner.status || "pending").toLowerCase();

          if (status === "pending") {
            throw new Error(
              "Your provider application is awaiting approval. Please contact MEI One support if you need assistance."
            );
          }

          if (status === "suspended") {
            throw new Error(
              "Your provider account is suspended. Please contact MEI One support."
            );
          }

          if (status === "rejected") {
            throw new Error(
              "Your provider application was not approved. Please contact MEI One support."
            );
          }

          throw new Error(
            "Your provider account is not approved. Please contact MEI One support."
          );
        }

        // 5. Approved provider: open dashboard.
        showMessage(
          "Sign in successful. Opening your provider dashboard...",
          "success"
        );

        window.location.replace("/provider-dashboard.html");

      } catch (error) {
        console.error("MEI One provider sign-in error:", error);

        // Do not leave an authenticated customer/non-provider session active.
        if (authenticated) {
          try {
            await sb.auth.signOut();
          } catch (signOutError) {
            console.error("Sign-out cleanup error:", signOutError);
          }
        }

        showMessage(translateError(error), "error");
        setLoading(false);
      }
    });

    // Password reset.
    document.getElementById("forgotPassword").addEventListener(
      "click",
      async event => {
        event.preventDefault();

        if (!sb || !sb.auth) {
          showMessage("Supabase is unavailable.", "error");
          return;
        }

        const email = emailInput.value.trim().toLowerCase();

        if (!email || !validEmail(email)) {
          markInvalid(emailInput, true);
          showMessage(
            "Enter a valid email address first to reset your password.",
            "error"
          );
          emailInput.focus();
          return;
        }

        try {
          showMessage("Sending password reset instructions...", "info");

          const { error } = await sb.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin + "/provider-signin.html"
          });

          if (error) throw error;

          showMessage(
            "If this email is registered, password reset instructions will be sent.",
            "success"
          );

        } catch (error) {
          console.error("Password reset error:", error);
          showMessage(translateError(error), "error");
        }
      }
    );
  </script>
</body>
</html>
