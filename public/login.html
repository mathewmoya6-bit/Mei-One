<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071a2f">
  <title>Sign in | MEI One</title>
  <meta name="description" content="Sign in to your MEI One customer or provider account.">
  <link rel="icon" href="assets/favicon.png" type="image/png">

  <style>
    :root{--navy:#06111f;--green:#b7ff00;--green-hover:#c8ff3d;--white:#fff;--text:#e8f0f7;--muted:#91a4b8;--border:rgba(255,255,255,.10)}
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;padding:24px;display:flex;align-items:center;justify-content:center;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--white);
      background:radial-gradient(circle at 85% 10%,rgba(183,255,0,.11),transparent 28%),radial-gradient(circle at 10% 90%,rgba(0,120,255,.08),transparent 32%),var(--navy)}
    button,input{font:inherit}button{cursor:pointer}
    .page{width:100%;max-width:440px}
    .brand{text-align:center;margin-bottom:24px}
    .brand-mark{width:68px;height:68px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;border-radius:20px;background:var(--green);color:var(--navy);font-size:23px;font-weight:950;letter-spacing:-1px;box-shadow:0 0 0 1px rgba(183,255,0,.25),0 18px 45px rgba(183,255,0,.16)}
    .brand h1{font-size:32px;line-height:1;font-weight:950;letter-spacing:-1.5px}
    .brand p{margin-top:8px;color:var(--muted);font-size:14px}
    .card{padding:30px;border:1px solid var(--border);border-radius:24px;background:linear-gradient(180deg,rgba(16,38,61,.96),rgba(7,19,33,.98));box-shadow:0 25px 70px rgba(0,0,0,.4)}
    .card-header{margin-bottom:24px}
    .card-header h2{font-size:25px;font-weight:900;letter-spacing:-.8px}
    .card-header p{margin-top:7px;color:var(--muted);font-size:14px;line-height:1.5}
    .message{display:none;margin-bottom:18px;padding:13px 14px;border-radius:12px;font-size:13px;line-height:1.5}
    .message.show{display:block}
    .message.error{color:#ffdce0;background:rgba(255,100,116,.10);border:1px solid rgba(255,100,116,.28)}
    .message.success{color:#d9ffeb;background:rgba(93,227,160,.10);border:1px solid rgba(93,227,160,.28)}
    .field{margin-bottom:17px}
    .field label{display:block;margin-bottom:8px;color:var(--text);font-size:13px;font-weight:800}
    .field input{width:100%;height:52px;padding:0 15px;border:1px solid rgba(255,255,255,.12);border-radius:13px;outline:none;background:rgba(0,0,0,.2);color:var(--white);transition:border-color .2s,box-shadow .2s}
    .field input::placeholder{color:#62778b}
    .field input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(183,255,0,.10)}
    .password-wrap{position:relative}.password-wrap input{padding-right:80px}
    .toggle-password{position:absolute;right:9px;top:50%;transform:translateY(-50%);padding:8px;border:0;background:transparent;color:var(--green);font-size:11px;font-weight:900}
    .forgot-row{display:flex;justify-content:flex-end;margin-top:-4px;margin-bottom:18px}
    .forgot-button{padding:3px;border:0;background:transparent;color:var(--green);font-size:13px;font-weight:800}
    .primary-button{width:100%;min-height:54px;border:0;border-radius:14px;background:var(--green);color:#07101b;font-size:15px;font-weight:950;transition:transform .2s,background .2s,opacity .2s}
    .primary-button:hover:not(:disabled){background:var(--green-hover);transform:translateY(-1px)}
    .primary-button:disabled{opacity:.55;cursor:not-allowed;transform:none}
    .secondary-button{width:100%;min-height:50px;border:1px solid rgba(255,255,255,.12);border-radius:13px;background:rgba(255,255,255,.03);color:var(--white);font-size:14px;font-weight:850;transition:border-color .2s,background .2s}
    .secondary-button:hover{border-color:rgba(183,255,0,.35);background:rgba(183,255,0,.05)}
    .divider{display:flex;align-items:center;gap:12px;margin:23px 0;color:#60758a;font-size:11px;font-weight:800}
    .divider::before,.divider::after{content:"";height:1px;flex:1;background:var(--border)}
    .footer{margin-top:22px;text-align:center;color:var(--muted);font-size:13px}
    .spinner{width:17px;height:17px;display:inline-block;vertical-align:middle;margin-right:8px;border:2px solid rgba(0,0,0,.22);border-top-color:#07101b;border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.spinner{animation-duration:2s}}
    @media (max-width:520px){body{padding:15px}.card{padding:22px;border-radius:20px}.brand h1{font-size:29px}}
  </style>
</head>
<body>

<main class="page">
  <header class="brand">
    <div class="brand-mark">MEI</div>
    <h1>MEI One</h1>
    <p>One platform. Connected services.</p>
  </header>

  <section class="card">
    <div class="card-header">
      <h2>Sign in</h2>
      <p>Customers and service providers sign in here. We'll take you to the right dashboard.</p>
    </div>

    <div id="message" class="message" role="alert" aria-live="polite"></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" maxlength="120" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required>
          <button type="button" class="toggle-password" id="togglePassword">SHOW</button>
        </div>
      </div>

      <div class="forgot-row">
        <button type="button" class="forgot-button" id="forgotBtn">Forgot password?</button>
      </div>

      <button type="submit" class="primary-button" id="loginSubmit">Sign in</button>
    </form>

    <div class="divider">OR</div>
    <button type="button" class="secondary-button" id="signupLink">Create an account</button>
  </section>

  <footer class="footer">&copy; <span id="year"></span> MEI One. All rights reserved.</footer>
</main>

<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
<script src="js/supabase.js"></script>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var form = $("loginForm"), message = $("message"), btn = $("loginSubmit");
  var sb = window.supabaseClient || window.MEISupabase || null;
  var params = new URLSearchParams(window.location.search);
  var service = params.get("service");
  var next = params.get("next");
  var suffix = service ? "?service=" + encodeURIComponent(service) : "";

  $("year").textContent = new Date().getFullYear();

  function show(text, type) { message.textContent = text; message.className = text ? "message show " + (type || "error") : "message"; }

  // Only allow same-site relative pages as a redirect target
  function safeNext(n) { return n && /^[a-z0-9\-_]+\.html(\?[^\s]*)?$/i.test(n) ? n : null; }

  /* Where does this person belong?
     1. has a partners row (any status)  -> provider-dashboard.html (it shows pending/rejected gates)
     2. signed up as driver/partner but has not applied yet -> partner-apply.html
     3. everyone else -> customer dashboard */
  async function route(user) {
    var meta = user.user_metadata || {};
    var intent = meta.signup_intent || "customer";
    var target;

    var r = await sb.from("partners").select("status").eq("user_id", user.id).maybeSingle();
    if (r.error) console.error("MEI One: partner lookup failed.", r.error);

    if (r.data) target = "provider-dashboard.html";
    else if (intent === "driver") target = "partner-apply.html?type=driver";
    else if (intent === "partner") target = "partner-apply.html";
    else target = safeNext(next) || (service === "rides" || service === "ride" ? "dashboard.html?service=rides" : "dashboard.html");

    window.location.replace(target);
  }

  function friendly(err) {
    var t = String((err && err.message) || "").toLowerCase();
    if (t.indexOf("invalid login") > -1 || t.indexOf("invalid credentials") > -1) return "Wrong email or password.";
    if (t.indexOf("not confirmed") > -1) return "Confirm your email first. Check your inbox for the link.";
    if (t.indexOf("rate") > -1 || t.indexOf("too many") > -1) return "Too many attempts. Wait a minute and try again.";
    return "We couldn't sign you in. Please try again.";
  }

  $("togglePassword").addEventListener("click", function () {
    var p = $("password"), hidden = p.type === "password";
    p.type = hidden ? "text" : "password";
    this.textContent = hidden ? "HIDE" : "SHOW";
  });

  $("signupLink").addEventListener("click", function () { window.location.href = "signup.html" + suffix; });

  $("forgotBtn").addEventListener("click", async function () {
    var email = $("email").value.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return show("Enter your email above, then select Forgot password.");
    if (!sb) return show("MEI One could not connect right now. Please try again later.");
    try {
      var r = await sb.auth.resetPasswordForEmail(email, { redirectTo: new URL("login.html", window.location.href).href });
      if (r.error) throw r.error;
      show("If an account exists for that email, a reset link is on its way.", "success");
    } catch (e) {
      console.error(e);
      show("We couldn't send the reset email. Try again in a minute.");
    }
  });

  form.addEventListener("submit", async function (event) {
    event.preventDefault();
    show("");

    var email = $("email").value.trim().toLowerCase();
    var password = $("password").value;

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return show("Enter a valid email address.");
    if (!password) return show("Enter your password.");
    if (!sb) return show("MEI One could not connect right now. Please try again later.");

    btn.disabled = true;
    var label = btn.textContent;
    btn.innerHTML = '<span class="spinner"></span>Signing in...';

    try {
      var res = await sb.auth.signInWithPassword({ email: email, password: password });
      if (res.error) throw res.error;
      await route(res.data.user);
    } catch (err) {
      console.error("MEI One: sign-in failed.", err);
      show(friendly(err));
      btn.disabled = false;
      btn.textContent = label;
    }
  });

  // Already signed in? Skip the form.
  (async function () {
    if (!sb) return;
    try {
      var s = await sb.auth.getSession();
      if (s.data && s.data.session) await route(s.data.session.user);
    } catch (e) { /* show the form */ }
  })();
})();
</script>

</body>
</html>
