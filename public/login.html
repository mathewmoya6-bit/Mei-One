<body>

  <main class="page">

    <div class="brand">
      <div class="brand-mark">MEI</div>
      <h1>MEI One</h1>
      <p>One platform. Connected services.</p>
    </div>

    <section class="card">

      <div class="card-header">
        <h2>Welcome back</h2>
        <p>Sign in to continue to your MEI One account.</p>
      </div>

      <div
        id="message"
        class="message"
        role="alert"
        aria-live="polite"
      ></div>

      <form id="loginForm" novalidate>

        <div class="field">
          <label for="email">Email address</label>

          <input
            id="email"
            name="email"
            type="email"
            autocomplete="username"
            placeholder="you@example.com"
            required
          >
        </div>

        <div class="field">
          <label for="password">Password</label>

          <div class="password-wrap">
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Enter your password"
              required
            >

            <button
              type="button"
              class="password-toggle"
              id="togglePassword"
            >
              SHOW
            </button>
          </div>
        </div>

        <div class="forgot">
          <button
            type="button"
            id="forgotPassword"
          >
            Forgot password?
          </button>
        </div>

        <button
          type="submit"
          class="primary-btn"
          id="loginButton"
        >
          Sign In
        </button>

      </form>

      <div class="divider">
        OR
      </div>

      <button
        type="button"
        class="secondary"
        id="signupButton"
      >
        Create a MEI One account
      </button>

      <div
        id="debug"
        class="debug"
      ></div>

    </section>

    <div class="footer">
      <span>© </span><span id="year"></span>
      <span> MEI One. All rights reserved.</span>
    </div>

  </main>

  <!-- =========================================================
       MEI ONE CONFIG
       ========================================================= -->

  <script src="js/config.js"></script>

  <!-- =========================================================
       SUPABASE
       ========================================================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

  <!-- =========================================================
       MEI ONE SUPABASE CLIENT
       ========================================================= -->

  <script src="js/supabase.js"></script>

  <script>
    (function () {
      "use strict";

      const DEBUG = true;

      const messageEl =
        document.getElementById("message");

      const debugEl =
        document.getElementById("debug");

      const loginForm =
        document.getElementById("loginForm");

      const loginButton =
        document.getElementById("loginButton");

      const emailInput =
        document.getElementById("email");

      const passwordInput =
        document.getElementById("password");

      const togglePassword =
        document.getElementById("togglePassword");

      const forgotPassword =
        document.getElementById("forgotPassword");

      const signupButton =
        document.getElementById("signupButton");

      const yearEl =
        document.getElementById("year");

      yearEl.textContent =
        new Date().getFullYear();

      /* ---------------------------------------------------------
         CONFIG
         --------------------------------------------------------- */

      const config =
        window.MEI_CONFIG || {};

      const client =
        window.supabaseClient ||
        window.MEISupabase ||
        null;

      function log() {
        if (!DEBUG) return;

        console.log.apply(
          console,
          ["MEI One:"].concat(
            Array.from(arguments)
          )
        );
      }

      function showDebug(value) {
        if (!DEBUG) return;

        debugEl.textContent =
          typeof value === "string"
            ? value
            : JSON.stringify(
                value,
                null,
                2
              );

        debugEl.classList.add("show");
      }

      function clearDebug() {
        debugEl.textContent = "";
        debugEl.classList.remove("show");
      }

      function showMessage(
        text,
        type = "error"
      ) {
        messageEl.textContent = text;
        messageEl.className =
          "message show " + type;
      }

      function clearMessage() {
        messageEl.textContent = "";
        messageEl.className = "message";
      }

      /* ---------------------------------------------------------
         TIMEOUT HELPER
         --------------------------------------------------------- */

      function withTimeout(
        promise,
        milliseconds,
        label
      ) {
        return Promise.race([
          promise,

          new Promise((_, reject) => {
            setTimeout(() => {
              reject(
                new Error(
                  label +
                  " timed out after " +
                  milliseconds +
                  "ms."
                )
              );
            }, milliseconds);
          })
        ]);
      }

      /* ---------------------------------------------------------
         SUPABASE CHECK
         --------------------------------------------------------- */

      function verifySupabaseClient() {
        if (!client) {
          throw new Error(
            "Supabase client was not created. Check js/config.js and js/supabase.js."
          );
        }

        log(
          "Supabase client detected."
        );
      }

      /* ---------------------------------------------------------
         PASSWORD VISIBILITY
         --------------------------------------------------------- */

      togglePassword.addEventListener(
        "click",
        function () {
          const visible =
            passwordInput.type === "text";

          passwordInput.type =
            visible
              ? "password"
              : "text";

          togglePassword.textContent =
            visible
              ? "SHOW"
              : "HIDE";
        }
      );

      /* ---------------------------------------------------------
         BUTTON STATE
         --------------------------------------------------------- */

      function setLoading(isLoading) {
        loginButton.disabled =
          isLoading;

        signupButton.disabled =
          isLoading;

        forgotPassword.disabled =
          isLoading;

        if (isLoading) {
          loginButton.innerHTML =
            '<span class="spinner"></span>Signing in...';
        } else {
          loginButton.textContent =
            "Sign In";
        }
      }

      /* ---------------------------------------------------------
         GET AUTH USER
         --------------------------------------------------------- */

      async function getUser() {
        log(
          "STEP 2: Checking authenticated user..."
        );

        const result =
          await withTimeout(
            client.auth.getUser(),
            10000,
            "Supabase getUser"
          );

        log(
          "getUser result:",
          result
        );

        if (result.error) {
          throw result.error;
        }

        return result.data?.user || null;
      }

      /* ---------------------------------------------------------
         CHECK ADMIN ROLE
         --------------------------------------------------------- */

      async function getAdminAccess(userId) {
        log(
          "STEP 3: Checking MEI One administrator access..."
        );

        /*
         * IMPORTANT:
         * This is only performed AFTER successful
         * authentication.
         */

        const rpcResult =
          await withTimeout(
            client.rpc(
              "get_my_admin_access"
            ),
            10000,
            "Administrator access check"
          );

        log(
          "Admin RPC result:",
          rpcResult
        );

        if (
          !rpcResult.error &&
          rpcResult.data &&
          rpcResult.data.length > 0
        ) {
          const record =
            rpcResult.data[0];

          return {
            isAdmin:
              record.is_active === true,

            role:
              record.role || null,

            source:
              "rpc"
          };
        }

        /*
         * Fallback direct query.
         */

        log(
          "Admin RPC returned no active record. Trying direct query..."
        );

        const directResult =
          await withTimeout(
            client
              .from("admin_users")
              .select(
                "id,user_id,role,is_active"
              )
              .eq(
                "user_id",
                userId
              )
              .maybeSingle(),
            10000,
            "Administrator database query"
          );

        log(
          "Admin direct query result:",
          directResult
        );

        if (directResult.error) {
          throw directResult.error;
        }

        if (!directResult.data) {
          return {
            isAdmin: false,
            role: null,
            source: "none"
          };
        }

        return {
          isAdmin:
            directResult.data.is_active === true,

          role:
            directResult.data.role || null,

          source:
            "direct"
        };
      }

      /* ---------------------------------------------------------
         DESTINATION
         --------------------------------------------------------- */

      async function determineDestination(
        user
      ) {
        log(
          "STEP 3: Determining account destination..."
        );

        const admin =
          await getAdminAccess(
            user.id
          );

        log(
          "Administrator status:",
          admin
        );

        const allowedRoles = [
          "SUPER_ADMIN",
          "ADMIN",
          "OPERATIONS",
          "FINANCE",
          "SUPPORT",
          "AUDITOR"
        ];

        if (
          admin.isAdmin &&
          allowedRoles.includes(
            String(
              admin.role
            ).toUpperCase()
          )
        ) {
          log(
            "Administrator account detected."
          );

          return "admin.html";
        }

        log(
          "Customer account detected."
        );

        return (
          config.routes?.dashboard ||
          "dashboard.html"
        );
      }

      /* ---------------------------------------------------------
         LOGIN
         --------------------------------------------------------- */

      loginForm.addEventListener(
        "submit",
        async function (event) {
          event.preventDefault();

          clearMessage();
          clearDebug();

          const email =
            emailInput.value
              .trim()
              .toLowerCase();

          const password =
            passwordInput.value;

          if (!email) {
            showMessage(
              "Please enter your email address."
            );
            emailInput.focus();
            return;
          }

          if (!password) {
            showMessage(
              "Please enter your password."
            );
            passwordInput.focus();
            return;
          }

          setLoading(true);

          try {
            verifySupabaseClient();

            /*
             * ---------------------------------------------------
             * STEP 1
             * Authenticate against Supabase.
             * ---------------------------------------------------
             */

            log(
              "STEP 1: Authenticating with Supabase..."
            );

            const authResult =
              await withTimeout(
                client.auth.signInWithPassword({
                  email: email,
                  password: password
                }),
                15000,
                "Supabase login request"
              );

            log(
              "Authentication result:",
              authResult
            );

            if (authResult.error) {
              throw authResult.error;
            }

            const user =
              authResult.data?.user;

            if (!user) {
              throw new Error(
                "Supabase login succeeded but no user was returned."
              );
            }

            log(
              "AUTHENTICATION SUCCESS:",
              {
                id: user.id,
                email: user.email
              }
            );

            /*
             * ---------------------------------------------------
             * STEP 2
             * Verify the authenticated user.
             * ---------------------------------------------------
             */

            const verifiedUser =
              await getUser();

            if (!verifiedUser) {
              throw new Error(
                "Authentication completed, but Supabase could not verify the user session."
              );
            }

            /*
             * ---------------------------------------------------
             * STEP 3
             * Determine customer/admin destination.
             * ---------------------------------------------------
             */

            const destination =
              await determineDestination(
                verifiedUser
              );

            log(
              "FINAL DESTINATION:",
              destination
            );

            showMessage(
              "Login successful. Opening your account...",
              "success"
            );

            /*
             * Give the browser a moment to persist
             * the Supabase session before navigating.
             */

            await new Promise(
              resolve =>
                setTimeout(
                  resolve,
                  300
                )
            );

            window.location.replace(
              destination
            );

          } catch (error) {

            console.error(
              "MEI One login error:",
              error
            );

            const message =
              error?.message ||
              "Login failed. Please try again.";

            /*
             * Show the exact failing step.
             */

            showDebug({
              message:
                message,

              name:
                error?.name || null,

              code:
                error?.code || null,

              status:
                error?.status || null,

              hint:
                "If this says 'Supabase login request timed out', the problem is before admin authorization. If authentication succeeds but 'Administrator access check' times out, the problem is the admin RPC/database policy."
            });

            if (
              message.toLowerCase().includes(
                "supabase login request timed out"
              )
            ) {
              showMessage(
                "The Supabase authentication request is not responding. Please check the Supabase project/API connection."
              );
            } else if (
              message.toLowerCase().includes(
                "administrator access check timed out"
              )
            ) {
              showMessage(
                "Login succeeded, but the administrator database check is not responding."
              );
            } else if (
              message.toLowerCase().includes(
                "administrator database query timed out"
              )
            ) {
              showMessage(
                "Login succeeded, but the administrator database query is not responding."
              );
            } else {
              showMessage(
                message
              );
            }

          } finally {
            setLoading(false);
          }
        }
      );

      /* ---------------------------------------------------------
         FORGOT PASSWORD
         --------------------------------------------------------- */

      forgotPassword.addEventListener(
        "click",
        async function () {

          clearMessage();
          clearDebug();

          const email =
            emailInput.value
              .trim()
              .toLowerCase();

          if (!email) {
            showMessage(
              "Enter your email address first, then click Forgot password."
            );

            emailInput.focus();
            return;
          }

          try {
            verifySupabaseClient();

            forgotPassword.disabled =
              true;

            log(
              "Sending password reset..."
            );

            const result =
              await withTimeout(
                client.auth.resetPasswordForEmail(
                  email,
                  {
                    redirectTo:
                      window.location.origin +
                      "/login.html"
                  }
                ),
                15000,
                "Password reset request"
              );

            if (result.error) {
              throw result.error;
            }

            showMessage(
              "If that email exists, a password reset link has been sent.",
              "success"
            );

          } catch (error) {

            console.error(
              "MEI One password reset error:",
              error
            );

            showMessage(
              error?.message ||
              "Password reset failed."
            );

          } finally {
            forgotPassword.disabled =
              false;
          }
        }
      );

      /* ---------------------------------------------------------
         SIGN UP
         --------------------------------------------------------- */

      signupButton.addEventListener(
        "click",
        function () {

          const destination =
            config.routes?.signup ||
            "signup.html";

          window.location.href =
            destination;
        }
      );

      /* ---------------------------------------------------------
         INITIAL PAGE CHECK
         ---------------------------------------------------------
         IMPORTANT:
         We intentionally DO NOT automatically redirect an
         existing session here.

         This prevents login/dashboard/admin redirect loops.
         --------------------------------------------------------- */

      async function initialise() {

        log(
          "MEI One login page loaded."
        );

        try {
          verifySupabaseClient();

          log(
            "Supabase URL:",
            config.supabaseUrl ||
            config.SUPABASE_URL ||
            "not exposed"
          );

          log(
            "No automatic session redirect will be performed."
          );

        } catch (error) {

          console.error(
            "MEI One initialization error:",
            error
          );

          showMessage(
            "MEI One could not initialise its connection. Check js/config.js and js/supabase.js."
          );

          showDebug(
            error.message
          );
        }
      }

      initialise();

    })();
  </script>

</body>
