
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071a2f">
  <meta name="description" content="MEI One service provider dashboard">
  <title>Provider Dashboard | MEI One</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #071a2f;
      --navy-light: #102b47;
      --green: #00ff88;
      --green-dark: #00c96b;
      --white: #ffffff;
      --muted: #64748b;
      --border: #e5eaf0;
      --background: #f4f7fb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, sans-serif;
      background: var(--background);
      color: #172337;
    }

    button { font: inherit; cursor: pointer; }

    .topbar {
      background: var(--navy);
      color: white;
      padding: 17px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .brand {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -.5px;
    }

    .brand span { color: var(--green); }

    .account {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 13px;
      color: #d5deea;
    }

    .logout {
      background: transparent;
      color: white;
      border: 1px solid #52647a;
      border-radius: 8px;
      padding: 9px 14px;
    }

    .logout:hover { border-color: var(--green); }

    .container {
      width: min(1200px, 92%);
      margin: 30px auto;
    }

    .welcome {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 25px;
      margin: 0 0 7px;
      color: var(--navy);
    }

    .subtitle {
      color: var(--muted);
      font-size: 13px;
      margin: 0;
    }

    .online-control {
      display: flex;
      align-items: center;
      gap: 12px;
      background: white;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .online-label {
      font-size: 13px;
      font-weight: 700;
    }

    .switch {
      width: 46px;
      height: 25px;
      border: 0;
      border-radius: 20px;
      background: #cbd5e1;
      padding: 3px;
      transition: .2s;
    }

    .switch::after {
      content: "";
      display: block;
      height: 19px;
      width: 19px;
      background: white;
      border-radius: 50%;
      transition: .2s;
    }

    .switch.active { background: var(--green-dark); }

    .switch.active::after { transform: translateX(21px); }

    .switch:disabled { opacity: .5; cursor: wait; }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 25px;
    }

    .stat {
      background: white;
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 20px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .stat-number {
      display: block;
      margin-top: 10px;
      font-size: 29px;
      font-weight: 800;
      color: var(--navy);
    }

    .panel {
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }

    .panel-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .panel-header h2 {
      font-size: 17px;
      color: var(--navy);
      margin: 0;
    }

    .tabs {
      display: flex;
      gap: 8px;
      padding: 15px 20px 0;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
    }

    .tab {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 11px 14px;
      font-size: 12px;
      font-weight: 700;
      border-bottom: 3px solid transparent;
      white-space: nowrap;
    }

    .tab.active {
      color: var(--navy);
      border-bottom-color: var(--green-dark);
    }

    .jobs {
      padding: 20px;
      display: grid;
      gap: 15px;
    }

    .job {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      display: grid;
      gap: 13px;
    }

    .job-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .job h3 {
      font-size: 15px;
      color: var(--navy);
      margin: 0 0 6px;
    }

    .job-id {
      color: #94a3b8;
      font-size: 11px;
      overflow-wrap: anywhere;
    }

    .job-details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .detail {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .detail strong {
      display: block;
      color: #26364a;
      font-size: 12px;
    }

    .status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 30px;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      background: #e8eef5;
      color: #475569;
      height: fit-content;
    }

    .status.pending,
    .status.requested,
    .status.proposed {
      background: #fff5d9;
      color: #946200;
    }

    .status.accepted,
    .status.in_progress,
    .status.ongoing {
      background: #e0f2fe;
      color: #075985;
    }

    .status.completed {
      background: #dcfce7;
      color: #166534;
    }

    .status.cancelled {
      background: #fee2e2;
      color: #991b1b;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .btn {
      border: 0;
      border-radius: 8px;
      padding: 10px 15px;
      font-size: 12px;
      font-weight: 700;
    }

    .btn-primary {
      background: var(--navy);
      color: white;
    }

    .btn-primary:hover { background: var(--navy-light); }

    .btn-green {
      background: var(--green);
      color: var(--navy);
    }

    .btn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .message {
      padding: 15px 20px;
      font-size: 13px;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .message.error {
      color: #b91c1c;
      background: #fef2f2;
    }

    .message.success {
      color: #166534;
      background: #f0fdf4;
    }

    .empty {
      padding: 45px 20px;
      text-align: center;
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.6;
    }

    .refresh {
      background: #edf2f7;
      color: var(--navy);
      border: 0;
      border-radius: 8px;
      padding: 9px 13px;
      font-size: 12px;
      font-weight: 700;
    }

    .refresh:disabled { opacity: .5; cursor: wait; }

    @media(max-width: 750px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .job-details { grid-template-columns: 1fr; }
      .container { margin-top: 22px; }
    }

    @media(max-width: 420px) {
      .stats { gap: 9px; }
      .stat { padding: 14px; }
      .stat-number { font-size: 24px; }
      .account { width: 100%; justify-content: space-between; }
    }
  </style>
</head>

<body>

<header class="topbar">
  <div class="brand">MEI <span>ONE</span></div>
  <div class="account">
    <span id="providerEmail">Checking account...</span>
    <button class="logout" id="logoutBtn" type="button">Sign out</button>
  </div>
</header>

<main class="container">

  <section class="welcome">
    <div>
      <h1 id="welcomeTitle">Provider Dashboard</h1>
      <p class="subtitle" id="providerSubtitle">
        Manage your services and customer requests.
      </p>
    </div>

    <div class="online-control">
      <span class="online-label" id="onlineLabel">Offline</span>
      <button
        class="switch"
        id="onlineSwitch"
        type="button"
        aria-label="Toggle availability"
        aria-pressed="false"
      ></button>
    </div>
  </section>

  <section class="stats">
    <div class="stat">
      <span class="stat-label">Available Requests</span>
      <strong class="stat-number" id="availableCount">0</strong>
    </div>

    <div class="stat">
      <span class="stat-label">Assigned Jobs</span>
      <strong class="stat-number" id="assignedCount">0</strong>
    </div>

    <div class="stat">
      <span class="stat-label">In Progress</span>
      <strong class="stat-number" id="progressCount">0</strong>
    </div>

    <div class="stat">
      <span class="stat-label">Completed</span>
      <strong class="stat-number" id="completedCount">0</strong>
    </div>
  </section>

  <section class="panel">
    <div class="panel-header">
      <h2>Service Requests</h2>
      <button class="refresh" id="refreshBtn" type="button">↻ Refresh</button>
    </div>

    <div class="tabs" id="serviceTabs">
      <button class="tab active" data-service="all" type="button">
        All Services
      </button>
    </div>

    <div id="notice" aria-live="polite"></div>

    <div class="jobs" id="jobsList">
      <div class="empty">Loading your dashboard...</div>
    </div>
  </section>

</main>

<!-- Load Supabase first, then the shared MEI configuration. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>

<script>
(function () {
  "use strict";

  const sb = window.MEI_SUPABASE;

  const OPEN_STATUSES = ["pending", "requested", "proposed"];
  const ACTIVE_STATUSES = ["accepted", "in_progress", "ongoing"];

  let session = null;
  let partner = null;
  let approvedServices = [];
  let allRequests = [];
  let activeService = "all";
  let busy = false;
  let initialized = false;

  const $ = id => document.getElementById(id);

  function escapeHTML(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, c => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    })[c]);
  }

  function normalizeStatus(value) {
    return String(value || "").toLowerCase().trim();
  }

  function showNotice(message, type = "success") {
    $("notice").innerHTML =
      '<div class="message ' + type + '">' +
      escapeHTML(message) +
      "</div>";
  }

  function clearNotice() {
    $("notice").innerHTML = "";
  }

  function showFatalError(message) {
    $("jobsList").innerHTML =
      '<div class="empty">' + escapeHTML(message) + "</div>";
    showNotice(message, "error");
  }

  function formatDate(value) {
    if (!value) return "Not available";

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
      return "Not available";
    }

    return date.toLocaleString();
  }

  function requestTitle(request) {
    return request.title ||
      request.service ||
      request.request_type ||
      "Service request";
  }

  function requestTime(request) {
    return request.requested_at || request.created_at;
  }

  function findService(serviceId) {
    return approvedServices.find(service => service.id === serviceId) || null;
  }

  function setButtonLoading(button, loading, originalText) {
    button.disabled = loading;
    button.textContent = loading ? "Please wait..." : originalText;
  }

  /* -------------------------------------------------------
     1. SESSION
  ------------------------------------------------------- */

  async function checkSession() {
    const { data, error } = await sb.auth.getSession();

    if (error) throw error;

    session = data.session;

    if (!session || !session.user) {
      window.location.replace("/provider-signin.html");
      return false;
    }

    $("providerEmail").textContent =
      session.user.email || "Provider account";

    return true;
  }

  /* -------------------------------------------------------
     2. PROVIDER PROFILE
     Actual table: partners
  ------------------------------------------------------- */

  async function loadProvider() {
    const { data, error } = await sb
      .from("partners")
      .select("id,user_id,type,business_name,phone,status,is_online")
      .eq("user_id", session.user.id)
      .maybeSingle();

    if (error) {
      throw new Error("Unable to load provider profile: " + error.message);
    }

    if (!data) {
      await sb.auth.signOut({ scope: "local" });
      window.location.replace("/provider-signin.html");
      return false;
    }

    partner = data;

    if (normalizeStatus(partner.status) !== "approved") {
      await sb.auth.signOut({ scope: "local" });
      window.location.replace("/provider-signin.html");
      return false;
    }

    $("welcomeTitle").textContent =
      partner.business_name || "Provider Dashboard";

    $("providerSubtitle").textContent = partner.phone
      ? "Provider account • " + partner.phone
      : "Manage your services and customer requests.";

    updateOnlineDisplay();

    return true;
  }

  /* -------------------------------------------------------
     3. PROVIDER SERVICES
     Assumes partner_services exists with:
     partner_id, service_id, status
  ------------------------------------------------------- */

  async function loadServices() {
    const { data, error } = await sb
      .from("partner_services")
      .select("service_id,status")
      .eq("partner_id", partner.id)
      .eq("status", "approved");

    if (error) {
      throw new Error(
        "Unable to load your approved services. Check the partner_services table and its permissions: " +
        error.message
      );
    }

    const serviceIds = [
      ...new Set((data || [])
        .map(row => row.service_id)
        .filter(Boolean))
    ];

    if (!serviceIds.length) {
      approvedServices = [];
      activeService = "all";
      renderServiceTabs();
      return;
    }

    const { data: services, error: serviceError } = await sb
      .from("services")
      .select("id,service_code,service_name,description,icon,route,is_active,display_order")
      .in("id", serviceIds)
      .eq("is_active", true)
      .order("display_order", { ascending: true });

    if (serviceError) {
      throw new Error("Unable to load MEI One services: " + serviceError.message);
    }

    approvedServices = services || [];

    if (
      activeService !== "all" &&
      !approvedServices.some(service => service.id === activeService)
    ) {
      activeService = "all";
    }

    renderServiceTabs();
  }

  function renderServiceTabs() {
    const tabs = [
      { id: "all", name: "All Services" },
      ...approvedServices.map(service => ({
        id: service.id,
        name: service.service_name
      }))
    ];

    $("serviceTabs").innerHTML = tabs.map(tab => {
      const active = activeService === tab.id ? "active" : "";

      return (
        '<button class="tab ' + active + '"' +
        ' data-service="' + escapeHTML(tab.id) + '"' +
        ' type="button">' +
        escapeHTML(tab.name) +
        "</button>"
      );
    }).join("");

    $("serviceTabs").querySelectorAll("[data-service]").forEach(button => {
      button.addEventListener("click", () => {
        activeService = button.dataset.service;
        renderServiceTabs();
        renderRequests();
      });
    });
  }

  /* -------------------------------------------------------
     4. SERVICE REQUESTS
     Actual fields include:
     id, user_id, service_id, request_type, status,
     pickup_address, destination_address, notes,
     requested_at, accepted_at, started_at,
     completed_at, cancelled_at, created_at,
     service, provider_id, title, details, pickup,
     dropoff, price, customer_name, requested_provider_id
  ------------------------------------------------------- */

  async function loadRequests() {
    const serviceIds = approvedServices.map(service => service.id);

    if (!serviceIds.length) {
      allRequests = [];
      updateStats();
      renderRequests();
      return;
    }

    const { data, error } = await sb
      .from("service_requests")
      .select("*")
      .in("service_id", serviceIds)
      .or("provider_id.is.null,provider_id.eq." + partner.id)
      .order("created_at", { ascending: false })
      .limit(200);

    if (error) {
      throw new Error("Unable to load service requests: " + error.message);
    }

    allRequests = (data || []).filter(request => {
      if (
        request.requested_provider_id &&
        request.requested_provider_id !== partner.id
      ) {
        return false;
      }

      return true;
    });

    updateStats();
    renderRequests();
  }

  /* -------------------------------------------------------
     5. DASHBOARD STATISTICS
  ------------------------------------------------------- */

  function updateStats() {
    let available = 0;
    let assigned = 0;
    let progress = 0;
    let completed = 0;

    allRequests.forEach(request => {
      const status = normalizeStatus(request.status);
      const mine = request.provider_id === partner.id;

      if (
        !request.provider_id &&
        OPEN_STATUSES.includes(status)
      ) {
        available++;
      }

      if (mine && ACTIVE_STATUSES.includes(status)) {
        assigned++;
      }

      if (
        mine &&
        ["in_progress", "ongoing"].includes(status)
      ) {
        progress++;
      }

      if (mine && status === "completed") {
        completed++;
      }
    });

    $("availableCount").textContent = available;
    $("assignedCount").textContent = assigned;
    $("progressCount").textContent = progress;
    $("completedCount").textContent = completed;
  }

  /* -------------------------------------------------------
     6. DISPLAY REQUESTS
  ------------------------------------------------------- */

  function renderRequests() {
    let requests = allRequests.slice();

    if (activeService !== "all") {
      requests = requests.filter(
        request => request.service_id === activeService
      );
    }

    if (!requests.length) {
      const message = approvedServices.length
        ? "No service requests found for your approved services."
        : "You do not currently have any approved services. Contact MEI One support.";

      $("jobsList").innerHTML =
        '<div class="empty">' + escapeHTML(message) + "</div>";

      return;
    }

    $("jobsList").innerHTML = requests.map(request => {
      const status = normalizeStatus(request.status);
      const assignedToMe = request.provider_id === partner.id;

      const available =
        !request.provider_id &&
        OPEN_STATUSES.includes(status);

      let actionButton = "";

      if (available) {
        actionButton =
          '<button class="btn btn-green" data-action="accept"' +
          ' data-id="' + escapeHTML(request.id) + '"' +
          ' type="button">Accept Request</button>';
      } else if (assignedToMe && status === "accepted") {
        actionButton =
          '<button class="btn btn-primary" data-action="start"' +
          ' data-id="' + escapeHTML(request.id) + '"' +
          ' type="button">Start Job</button>';
      } else if (
        assignedToMe &&
        ["in_progress", "ongoing"].includes(status)
      ) {
        actionButton =
          '<button class="btn btn-green" data-action="complete"' +
          ' data-id="' + escapeHTML(request.id) + '"' +
          ' type="button">Mark Completed</button>';
      }

      const service = findService(request.service_id);

      const pickup =
        request.pickup_address || request.pickup || "Not specified";

      const destination =
        request.destination_address || request.dropoff || "Not specified";

      const details =
        request.details || request.notes || "No additional details";

      const customer =
        request.customer_name || "Customer";

      const price = request.price == null
        ? "Not specified"
        : "KES " + Number(request.price).toLocaleString();

      const statusClass = [
        "pending",
        "requested",
        "proposed",
        "accepted",
        "in_progress",
        "ongoing",
        "completed",
        "cancelled"
      ].includes(status) ? status : "";

      return (
        '<article class="job">' +

          '<div class="job-top">' +
            "<div>" +
              "<h3>" +
                escapeHTML(service?.icon || "📋") + " " +
                escapeHTML(requestTitle(request)) +
              "</h3>" +
              '<div class="job-id">Request: ' +
                escapeHTML(request.id) +
              "</div>" +
            "</div>" +

            '<span class="status ' + statusClass + '">' +
              escapeHTML(status.replace(/_/g, " ") || "Unknown") +
            "</span>" +
          "</div>" +

          '<div class="job-details">' +

            '<div class="detail">' +
              "<strong>Customer</strong>" +
              escapeHTML(customer) +
            "</div>" +

            '<div class="detail">' +
              "<strong>Service</strong>" +
              escapeHTML(service?.service_name || request.service || "Service") +
            "</div>" +

            '<div class="detail">' +
              "<strong>Pickup / Location</strong>" +
              escapeHTML(pickup) +
            "</div>" +

            '<div class="detail">' +
              "<strong>Destination</strong>" +
              escapeHTML(destination) +
            "</div>" +

            '<div class="detail">' +
              "<strong>Price</strong>" +
              escapeHTML(price) +
            "</div>" +

            '<div class="detail">' +
              "<strong>Requested</strong>" +
              escapeHTML(formatDate(requestTime(request))) +
            "</div>" +

          "</div>" +

          '<div class="detail">' +
            "<strong>Additional Information</strong>" +
            escapeHTML(details) +
          "</div>" +

          (actionButton
            ? '<div class="actions">' + actionButton + "</div>"
            : "") +

        "</article>"
      );
    }).join("");

    $("jobsList").querySelectorAll("[data-action]").forEach(button => {
      button.addEventListener("click", () => {
        updateRequest(
          button.dataset.id,
          button.dataset.action,
          button
        );
      });
    });
  }

  /* -------------------------------------------------------
     7. ACCEPT / START / COMPLETE REQUEST
  ------------------------------------------------------- */

  async function updateRequest(requestId, action, button) {
    if (busy) return;

    const request = allRequests.find(item => item.id === requestId);

    if (!request) {
      showNotice("Request not found. Refresh and try again.", "error");
      return;
    }

    const currentStatus = normalizeStatus(request.status);
    const timestamp = new Date().toISOString();

    let update = {};
    let originalText = button.textContent;

    if (action === "accept") {
      if (
        request.provider_id ||
        !OPEN_STATUSES.includes(currentStatus)
      ) {
        showNotice("This request is no longer available.", "error");
        await refreshDashboard();
        return;
      }

      if (
        request.requested_provider_id &&
        request.requested_provider_id !== partner.id
      ) {
        showNotice("This request is assigned to another provider.", "error");
        return;
      }

      update = {
        provider_id: partner.id,
        status: "accepted",
        accepted_at: timestamp
      };

    } else if (action === "start") {
      if (
        request.provider_id !== partner.id ||
        currentStatus !== "accepted"
      ) {
        showNotice("This job cannot be started in its current state.", "error");
        return;
      }

      update = {
        status: "in_progress",
        started_at: timestamp
      };

    } else if (action === "complete") {
      if (
        request.provider_id !== partner.id ||
        !["in_progress", "ongoing"].includes(currentStatus)
      ) {
        showNotice("This job cannot be completed in its current state.", "error");
        return;
      }

      update = {
        status: "completed",
        completed_at: timestamp
      };

    } else {
      return;
    }

    busy = true;
    setButtonLoading(button, true, originalText);

    try {
      let query = sb
        .from("service_requests")
        .update(update)
        .eq("id", requestId);

      if (action === "accept") {
        query = query
          .is("provider_id", null)
          .in("status", OPEN_STATUSES);

        if (request.requested_provider_id) {
          query = query.eq("requested_provider_id", partner.id);
        } else {
          query = query.is("requested_provider_id", null);
        }

      } else {
        query = query.eq("provider_id", partner.id);

        if (action === "start") {
          query = query.eq("status", "accepted");
        } else {
          query = query.in("status", ["in_progress", "ongoing"]);
        }
      }

      const { data, error } = await query.select("id");

      if (error) throw error;

      if (!data || data.length === 0) {
        throw new Error(
          "The request was not updated. It may have already been changed or your account does not have permission."
        );
      }

      showNotice(
        action === "accept"
          ? "Request accepted successfully."
          : action === "start"
            ? "Job started successfully."
            : "Job marked as completed."
      );

      await refreshDashboard();

    } catch (error) {
      console.error("Request update error:", error);

      showNotice(
        error.message || "Unable to update this request.",
        "error"
      );

    } finally {
      busy = false;
      button.disabled = false;
      button.textContent = originalText;
    }
  }

  /* -------------------------------------------------------
     8. PROVIDER ONLINE / OFFLINE
     Actual column: partners.is_online
  ------------------------------------------------------- */

  function updateOnlineDisplay() {
    const online = Boolean(partner && partner.is_online);

    $("onlineSwitch").classList.toggle("active", online);
    $("onlineSwitch").setAttribute("aria-pressed", String(online));
    $("onlineLabel").textContent = online ? "Online" : "Offline";
  }

  async function toggleOnline() {
    if (!partner || busy) return;

    busy = true;
    $("onlineSwitch").disabled = true;

    const newValue = !partner.is_online;

    try {
      const { data, error } = await sb
        .from("partners")
        .update({ is_online: newValue })
        .eq("id", partner.id)
        .eq("user_id", session.user.id)
        .select("id,is_online")
        .maybeSingle();

      if (error) throw error;

      if (!data) {
        throw new Error(
          "Availability was not updated. Check your provider permissions."
        );
      }

      partner.is_online = data.is_online;
      updateOnlineDisplay();

      showNotice(
        partner.is_online
          ? "You are now online."
          : "You are now offline."
      );

    } catch (error) {
      console.error("Availability update error:", error);
      showNotice(
        error.message || "Unable to update availability.",
        "error"
      );

    } finally {
      busy = false;
      $("onlineSwitch").disabled = false;
    }
  }

  /* -------------------------------------------------------
     9. REFRESH
  ------------------------------------------------------- */

  async function refreshDashboard() {
    if (busy) return;

    $("refreshBtn").disabled = true;
    $("jobsList").innerHTML =
      '<div class="empty">Refreshing your requests...</div>';

    try {
      await loadServices();
      await loadRequests();
      clearNotice();

    } catch (error) {
      console.error("Dashboard refresh error:", error);
      showNotice(error.message || "Unable to refresh dashboard.", "error");

    } finally {
      $("refreshBtn").disabled = false;
    }
  }

  /* -------------------------------------------------------
     10. SIGN OUT
  ------------------------------------------------------- */

  async function logout() {
    $("logoutBtn").disabled = true;

    try {
      const { error } = await sb.auth.signOut({ scope: "local" });

      if (error) throw error;

      window.location.replace("/provider-signin.html");

    } catch (error) {
      console.error("Logout error:", error);

      showNotice(
        error.message || "Unable to sign out. Please try again.",
        "error"
      );

      $("logoutBtn").disabled = false;
    }
  }

  /* -------------------------------------------------------
     11. INITIALIZE
  ------------------------------------------------------- */

  async function initialize() {
    if (initialized) return;
    initialized = true;

    if (!sb || !sb.auth || typeof sb.from !== "function") {
      showFatalError(
        "MEI One could not initialize Supabase. Check /js/config.js and the Supabase script loading order."
      );
      return;
    }

    try {
      const authenticated = await checkSession();

      if (!authenticated) return;

      const providerLoaded = await loadProvider();

      if (!providerLoaded) return;

      await loadServices();
      await loadRequests();

    } catch (error) {
      console.error("Dashboard initialization error:", error);

      showFatalError(
        error.message || "Unable to load your provider dashboard."
      );
    }
  }

  $("onlineSwitch").addEventListener("click", toggleOnline);
  $("refreshBtn").addEventListener("click", refreshDashboard);
  $("logoutBtn").addEventListener("click", logout);

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initialize);
  } else {
    initialize();
  }

})();
</script>

</body>
</html>
