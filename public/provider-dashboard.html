<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071a2f">
  <meta name="description" content="MEI One service provider dashboard">
  <title>Provider Dashboard | MEI One</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>
    :root {
      --navy: #071a2f;
      --navy-light: #102b49;
      --green: #00ff88;
      --background: #f4f7fa;
      --white: #ffffff;
      --text: #172b43;
      --muted: #718096;
      --border: #e5eaf0;
      --red: #c53030;
      --orange: #b7791f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Inter, Arial, sans-serif;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .topbar {
      min-height: 70px;
      background: var(--navy);
      color: white;
      padding: 0 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      font-size: 20px;
      font-weight: 800;
    }

    .brand span {
      color: var(--green);
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .email {
      color: #cbd5e0;
      font-size: 12px;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .welcome {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    h2 {
      font-size: 18px;
      margin: 0;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
    }

    .panel {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 28px;
    }

    .stat small {
      color: var(--muted);
      font-size: 12px;
    }

    .stat strong {
      display: block;
      font-size: 27px;
      margin-top: 9px;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 28px 0 15px;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .tab {
      border: 1px solid var(--border);
      background: white;
      color: var(--text);
      padding: 11px 15px;
      border-radius: 9px;
      font-weight: 700;
    }

    .tab.active {
      background: var(--navy);
      border-color: var(--navy);
      color: white;
    }

    .job-list {
      display: grid;
      gap: 13px;
    }

    .job {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
    }

    .job h3 {
      margin: 0 0 9px;
      font-size: 15px;
    }

    .job p {
      margin: 5px 0;
      font-size: 12px;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .job-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      border: 0;
      border-radius: 9px;
      padding: 11px 15px;
      font-weight: 700;
    }

    .btn-primary {
      background: var(--green);
      color: var(--navy);
    }

    .btn-dark {
      background: var(--navy);
      color: white;
    }

    .btn-light {
      background: #edf2f7;
      color: var(--navy);
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .online-status {
      display: inline-flex;
      padding: 8px 12px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 700;
      background: #edf2f7;
      color: #526174;
    }

    .online-status.online {
      background: #e6fff3;
      color: #087443;
    }

    .notice {
      padding: 14px 16px;
      border-radius: 10px;
      margin-bottom: 18px;
      font-size: 13px;
      line-height: 1.6;
      background: #fff8e6;
      border: 1px solid #f4d58d;
      color: #795b12;
    }

    .notice.error {
      background: #fff0f0;
      border-color: #ffcaca;
      color: #9b2c2c;
    }

    .empty {
      text-align: center;
      padding: 35px 20px;
      border: 1px dashed #cbd5e0;
      border-radius: 12px;
      background: white;
      color: var(--muted);
      font-size: 13px;
    }

    .hidden {
      display: none !important;
    }

    .loading {
      padding: 50px 15px;
      text-align: center;
      color: var(--muted);
    }

    .footer {
      padding: 30px 15px;
      text-align: center;
      color: #91a0b2;
      font-size: 11px;
    }

    @media (max-width: 800px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .welcome {
        align-items: flex-start;
        flex-direction: column;
      }

      .job {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (max-width: 480px) {
      .container {
        padding: 0 13px;
      }

      .topbar {
        padding: 0 14px;
      }

      .email {
        display: none;
      }

      h1 {
        font-size: 22px;
      }

      .stat {
        padding: 14px;
      }
    }
  </style>
</head>

<body>

<header class="topbar">
  <div class="brand">MEI <span>ONE</span> <span style="color:#cbd5e0;font-size:13px;font-weight:500">PROVIDER</span></div>

  <div class="top-right">
    <span id="userEmail" class="email"></span>
    <button id="logoutBtn" class="btn btn-light" type="button">Sign out</button>
  </div>
</header>

<main class="container">

  <div id="loading" class="loading">
    Loading your provider dashboard…
  </div>

  <div id="dashboard" class="hidden">

    <section class="welcome">
      <div>
        <h1 id="businessName">Provider Dashboard</h1>
        <div id="accountInfo" class="muted">Manage your MEI One service offerings.</div>
      </div>

      <div>
        <span id="onlineStatus" class="online-status">● Offline</span>
        <button id="onlineBtn" class="btn btn-primary" type="button">Go online</button>
      </div>
    </section>

    <div id="notice" class="notice hidden"></div>

    <section class="stats">
      <div class="panel stat">
        <small>Available requests</small>
        <strong id="availableCount">0</strong>
      </div>

      <div class="panel stat">
        <small>My assigned jobs</small>
        <strong id="assignedCount">0</strong>
      </div>

      <div class="panel stat">
        <small>In progress</small>
        <strong id="progressCount">0</strong>
      </div>

      <div class="panel stat">
        <small>Completed</small>
        <strong id="completedCount">0</strong>
      </div>
    </section>

    <div class="section-heading">
      <h2>My service workspaces</h2>
      <span id="approvedCount" class="muted"></span>
    </div>

    <nav id="serviceTabs" class="tabs"></nav>

    <div class="section-heading">
      <h2 id="workspaceTitle">Service requests</h2>
      <button id="refreshBtn" class="btn btn-light" type="button">Refresh</button>
    </div>

    <div id="jobs" class="job-list"></div>

  </div>
</main>

<footer class="footer">
  MEI One · Mei Press Group
</footer>

<script>
(() => {
  "use strict";

  // ----------------------------------------------------------
  // SUPABASE CONFIGURATION
  //
  // Expected supabase-config.js:
  // window.MEI_SUPABASE = {
  //   url: "https://YOUR_PROJECT.supabase.co",
  //   anonKey: "YOUR_SUPABASE_ANON_KEY"
  // };
  // ----------------------------------------------------------

  const CONFIG = window.MEI_SUPABASE || {};

  const SUPABASE_URL =
    CONFIG.url ||
    CONFIG.SUPABASE_URL;

  const SUPABASE_KEY =
    CONFIG.anonKey ||
    CONFIG.anon_key ||
    CONFIG.SUPABASE_ANON_KEY;

  const $ = id => document.getElementById(id);

  let supabaseClient = null;
  let currentUser = null;
  let provider = null;
  let offerings = [];
  let activeOffering = null;
  let requests = [];

  const TERMINAL_STATUSES = [
    "completed",
    "cancelled"
  ];

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[char]);
  }

  function showNotice(message, error = false) {
    const element = $("notice");

    element.textContent = message;
    element.classList.remove("hidden", "error");

    if (error) {
      element.classList.add("error");
    }
  }

  function hideNotice() {
    $("notice").classList.add("hidden");
  }

  function statusText(status) {
    return String(status || "requested")
      .replaceAll("_", " ")
      .replace(/\b\w/g, letter => letter.toUpperCase());
  }

  // ----------------------------------------------------------
  // AUTHENTICATION
  // ----------------------------------------------------------

  async function checkSession() {
    const { data, error } =
      await supabaseClient.auth.getSession();

    if (error) {
      throw error;
    }

    if (!data.session) {
      window.location.replace("provider-login.html");
      return false;
    }

    currentUser = data.session.user;

    $("userEmail").textContent =
      currentUser.email || "";

    return true;
  }

  // ----------------------------------------------------------
  // LOAD PROVIDER
  // ----------------------------------------------------------

  async function loadProvider() {
    const { data, error } = await supabaseClient
      .from("partners")
      .select(`
        id,
        user_id,
        type,
        business_name,
        phone,
        status,
        is_online
      `)
      .eq("user_id", currentUser.id)
      .maybeSingle();

    if (error) {
      throw error;
    }

    if (!data) {
      showNotice(
        "Your provider profile could not be found. Please contact MEI One support.",
        true
      );
      return false;
    }

    provider = data;

    $("businessName").textContent =
      provider.business_name || "Provider Dashboard";

    $("accountInfo").textContent =
      "Provider account status: " +
      statusText(provider.status);

    renderAvailability();

    if (
      provider.status &&
      provider.status.toLowerCase() !== "approved" &&
      provider.status.toLowerCase() !== "active"
    ) {
      showNotice(
        "Your provider account is awaiting approval. Contact MEI One administration if you believe this is incorrect."
      );
    }

    return true;
  }

  // ----------------------------------------------------------
  // LOAD APPROVED SERVICE OFFERINGS
  // ----------------------------------------------------------

  async function loadOfferings() {
    const { data, error } = await supabaseClient
      .from("partner_services")
      .select(`
        id,
        partner_id,
        service_id,
        status,
        applied_at,
        services (
          id,
          service_code,
          service_name,
          description,
          icon,
          route,
          is_active
        )
      `)
      .eq("partner_id", provider.id)
      .eq("status", "approved")
      .order("applied_at", { ascending: false });

    if (error) {
      throw error;
    }

    offerings = (data || []).filter(item =>
      item.services &&
      item.services.is_active === true
    );

    $("approvedCount").textContent =
      offerings.length + " approved service(s)";

    if (!offerings.length) {
      $("serviceTabs").innerHTML = "";

      $("jobs").innerHTML = `
        <div class="empty">
          No approved service offerings are available yet.
          Your service applications must be approved by MEI One
          administration before you can receive requests.
        </div>
      `;

      showNotice(
        "Your provider account is active, but you currently have no approved service offerings."
      );

      return false;
    }

    activeOffering = offerings[0];

    renderServiceTabs();

    return true;
  }

  // ----------------------------------------------------------
  // ONLINE / OFFLINE
  // ----------------------------------------------------------

  function renderAvailability() {
    const online = provider.is_online === true;

    $("onlineStatus").textContent =
      online ? "● Online" : "● Offline";

    $("onlineStatus").classList.toggle(
      "online",
      online
    );

    $("onlineBtn").textContent =
      online ? "Go offline" : "Go online";
  }

  async function toggleAvailability() {
    const nextStatus = !provider.is_online;

    const { data, error } = await supabaseClient
      .from("partners")
      .update({
        is_online: nextStatus
      })
      .eq("id", provider.id)
      .eq("user_id", currentUser.id)
      .select("id,is_online")
      .maybeSingle();

    if (error) {
      throw error;
    }

    if (!data) {
      throw new Error(
        "Availability could not be updated. Check the partners UPDATE policy."
      );
    }

    provider.is_online = data.is_online;

    renderAvailability();
  }

  // ----------------------------------------------------------
  // SERVICE WORKSPACE SWITCHER
  // ----------------------------------------------------------

  function renderServiceTabs() {
    $("serviceTabs").innerHTML =
      offerings.map(item => {
        const service = item.services;

        return `
          <button
            type="button"
            class="tab ${item.id === activeOffering.id ? "active" : ""}"
            data-offering="${escapeHTML(item.id)}"
          >
            ${escapeHTML(service.icon || "▣")}
            ${escapeHTML(service.service_name)}
          </button>
        `;
      }).join("");

    $("serviceTabs")
      .querySelectorAll("[data-offering]")
      .forEach(button => {
        button.addEventListener("click", async () => {
          const selected = offerings.find(
            item => item.id === button.dataset.offering
          );

          if (!selected) return;

          activeOffering = selected;

          renderServiceTabs();

          try {
            await loadRequests();
          } catch (error) {
            showNotice(error.message, true);
          }
        });
      });
  }

  // ----------------------------------------------------------
  // LOAD REQUESTS
  //
  // Uses confirmed fields:
  // service_id, provider_id, requested_provider_id,
  // status, requested_at, created_at, title, details,
  // pickup, dropoff, pickup_address, destination_address,
  // price, notes.
  // ----------------------------------------------------------

  async function loadRequests() {
    if (!activeOffering) {
      return;
    }

    hideNotice();

    $("workspaceTitle").textContent =
      activeOffering.services.service_name +
      " · Service requests";

    $("jobs").innerHTML =
      '<div class="loading">Loading requests…</div>';

    const { data, error } = await supabaseClient
      .from("service_requests")
      .select(`
        id,
        user_id,
        service_id,
        request_type,
        status,
        pickup_address,
        destination_address,
        latitude,
        longitude,
        notes,
        requested_at,
        accepted_at,
        started_at,
        completed_at,
        cancelled_at,
        created_at,
        service,
        provider_id,
        title,
        details,
        pickup,
        dropoff,
        price,
        customer_name,
        requested_provider_id
      `)
      .eq("service_id", activeOffering.service_id)
      .or(
        `provider_id.is.null,provider_id.eq.${provider.id}`
      )
      .order("requested_at", { ascending: false })
      .limit(100);

    if (error) {
      throw error;
    }

    requests = data || [];

    renderRequests();
    updateStatistics();
  }

  // ----------------------------------------------------------
  // STATISTICS
  // ----------------------------------------------------------

  function updateStatistics() {
    const available = requests.filter(request =>
      !request.provider_id &&
      !TERMINAL_STATUSES.includes(request.status) &&
      request.status !== "proposed" &&
      (
        !request.requested_provider_id ||
        request.requested_provider_id === provider.id
      )
    );

    const assigned = requests.filter(request =>
      request.provider_id === provider.id
    );

    const progress = assigned.filter(request =>
      ["in_progress", "ongoing"].includes(request.status)
    );

    const completed = assigned.filter(request =>
      request.status === "completed"
    );

    $("availableCount").textContent = available.length;
    $("assignedCount").textContent = assigned.length;
    $("progressCount").textContent = progress.length;
    $("completedCount").textContent = completed.length;
  }

  // ----------------------------------------------------------
  // REQUEST DISPLAY
  // ----------------------------------------------------------

  function renderRequests() {
    const visible = requests.filter(request => {
      if (request.provider_id === provider.id) {
        return true;
      }

      if (request.provider_id !== null) {
        return false;
      }

      if (
        TERMINAL_STATUSES.includes(request.status) ||
        request.status === "proposed"
      ) {
        return false;
      }

      if (
        request.requested_provider_id &&
        request.requested_provider_id !== provider.id
      ) {
        return false;
      }

      return true;
    });

    if (!visible.length) {
      $("jobs").innerHTML = `
        <div class="empty">
          No available or assigned requests for this service.
        </div>
      `;
      return;
    }

    $("jobs").innerHTML = visible.map(request => {
      const assignedToMe =
        request.provider_id === provider.id;

      const title =
        request.title ||
        request.request_type ||
        request.service ||
        "Service request";

      const pickup =
        request.pickup_address ||
        request.pickup ||
        "";

      const destination =
        request.destination_address ||
        request.dropoff ||
        "";

      const description =
        request.details ||
        request.notes ||
        "";

      const date =
        request.requested_at ||
        request.created_at;

      let actions = "";

      if (!assignedToMe) {
        actions = `
          <button
            class="btn btn-primary"
            type="button"
            data-action="accept"
            data-id="${escapeHTML(request.id)}"
          >
            Accept request
          </button>
        `;
      } else if (
        ["accepted", "requested", "pending"].includes(request.status)
      ) {
        actions = `
          <button
            class="btn btn-primary"
            type="button"
            data-action="start"
            data-id="${escapeHTML(request.id)}"
          >
            Start job
          </button>
        `;
      } else if (
        ["in_progress", "ongoing"].includes(request.status)
      ) {
        actions = `
          <button
            class="btn btn-primary"
            type="button"
            data-action="complete"
            data-id="${escapeHTML(request.id)}"
          >
            Mark completed
          </button>
        `;
      }

      return `
        <article class="job">
          <div>
            <h3>${escapeHTML(title)}</h3>

            <p>
              Request:
              #${escapeHTML(request.id.slice(0, 8).toUpperCase())}
            </p>

            <p>
              Status:
              <strong>${escapeHTML(statusText(request.status))}</strong>
            </p>

            ${request.customer_name
              ? `<p>Customer: ${escapeHTML(request.customer_name)}</p>`
              : ""
            }

            ${pickup
              ? `<p>Pickup: ${escapeHTML(pickup)}</p>`
              : ""
            }

            ${destination
              ? `<p>Destination: ${escapeHTML(destination)}</p>`
              : ""
            }

            ${description
              ? `<p>Details: ${escapeHTML(description)}</p>`
              : ""
            }

            ${request.price !== null && request.price !== undefined
              ? `<p>Price: ${escapeHTML(request.price)}</p>`
              : ""
            }

            <p>Requested: ${
              date
                ? escapeHTML(new Date(date).toLocaleString())
                : "Not specified"
            }</p>

            <p>
              ${assignedToMe
                ? "Assigned to your provider account"
                : "Available to eligible providers"
              }
            </p>
          </div>

          <div class="job-actions">
            ${actions}
          </div>
        </article>
      `;
    }).join("");

    $("jobs")
      .querySelectorAll("[data-action]")
      .forEach(button => {
        button.addEventListener("click", () => {
          handleRequestAction(
            button.dataset.action,
            button.dataset.id,
            button
          );
        });
      });
  }

  // ----------------------------------------------------------
  // REQUEST ACTIONS
  // ----------------------------------------------------------

  async function handleRequestAction(action, requestId, button) {
    button.disabled = true;

    try {
      let updateData = {};
      let query = supabaseClient
        .from("service_requests")
        .update({});

      if (action === "accept") {
        updateData = {
          provider_id: provider.id,
          status: "accepted",
          accepted_at: new Date().toISOString()
        };

        query = supabaseClient
          .from("service_requests")
          .update(updateData)
          .eq("id", requestId)
          .is("provider_id", null)
          .eq("service_id", activeOffering.service_id);
      }

      if (action === "start") {
        updateData = {
          status: "in_progress",
          started_at: new Date().toISOString()
        };

        query = supabaseClient
          .from("service_requests")
          .update(updateData)
          .eq("id", requestId)
          .eq("provider_id", provider.id)
          .in("status", ["accepted", "requested", "pending"]);
      }

      if (action === "complete") {
        updateData = {
          status: "completed",
          completed_at: new Date().toISOString()
        };

        query = supabaseClient
          .from("service_requests")
          .update(updateData)
          .eq("id", requestId)
          .eq("provider_id", provider.id)
          .in("status", ["in_progress", "ongoing"]);
      }

      const { data, error } = await query
        .select("id,provider_id,status")
        .maybeSingle();

      if (error) {
        throw error;
      }

      if (!data) {
        throw new Error(
          "The request was not updated. It may have been claimed by another provider, or the database policy rejected this action."
        );
      }

      await loadRequests();

    } catch (error) {
      showNotice(error.message, true);
      button.disabled = false;
    }
  }

  // ----------------------------------------------------------
  // SIGN OUT
  // ----------------------------------------------------------

  async function signOut() {
    const { error } = await supabaseClient.auth.signOut({
      scope: "local"
    });

    if (error) {
      showNotice(error.message, true);
      return;
    }

    window.location.replace("provider-login.html");
  }

  // ----------------------------------------------------------
  // INITIALIZE
  // ----------------------------------------------------------

  async function initialize() {
    try {
      if (
        !SUPABASE_URL ||
        !SUPABASE_KEY ||
        !window.supabase ||
        !window.supabase.createClient
      ) {
        throw new Error(
          "Supabase configuration is missing. Check supabase-config.js. It must expose window.MEI_SUPABASE with url and anonKey."
        );
      }

      supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

      if (!await checkSession()) {
        return;
      }

      if (!await loadProvider()) {
        $("loading").classList.add("hidden");
        $("dashboard").classList.remove("hidden");
        return;
      }

      $("loading").classList.add("hidden");
      $("dashboard").classList.remove("hidden");

      const hasServices = await loadOfferings();

      if (hasServices) {
        await loadRequests();
      }

    } catch (error) {
      console.error("MEI One provider dashboard:", error);

      $("loading").textContent =
        "Dashboard error: " + error.message;
    }
  }

  $("logoutBtn").addEventListener("click", signOut);

  $("onlineBtn").addEventListener("click", async () => {
    try {
      await toggleAvailability();
    } catch (error) {
      showNotice(error.message, true);
    }
  });

  $("refreshBtn").addEventListener("click", async () => {
    try {
      await loadRequests();
    } catch (error) {
      showNotice(error.message, true);
    }
  });

  initialize();

})();
</script>

</body>
</html>
