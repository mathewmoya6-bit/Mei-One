<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071a2f">
  <meta name="description" content="MEI One service provider dashboard">
  <title>Provider Dashboard | MEI One</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Supabase library (CDN). Config is inlined below — no external config file needed. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --navy: #071a2f;
      --navy-light: #102b47;
      --green: #00ff88;
      --green-dark: #00c96b;
      --white: #ffffff;
      --muted: #94a3b8;
      --border: #e5eaf0;
      --background: #f4f7fb;
    }

    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, sans-serif; background: var(--background); color: #172337; }
    button { font: inherit; cursor: pointer; }

    .topbar {
      background: var(--navy); color: white; padding: 17px 5%;
      display: flex; justify-content: space-between; align-items: center;
      gap: 15px; flex-wrap: wrap;
    }
    .brand { font-size: 21px; font-weight: 800; letter-spacing: -.5px; }
    .brand span { color: var(--green); }
    .account { display: flex; align-items: center; gap: 14px; font-size: 13px; color: #d5deea; }
    .logout {
      background: transparent; color: white; border: 1px solid #52647a;
      border-radius: 8px; padding: 9px 14px;
    }
    .logout:hover { border-color: var(--green); }

    .container { width: min(1200px, 92%); margin: 30px auto; }

    .welcome {
      display: flex; justify-content: space-between; align-items: center;
      gap: 15px; flex-wrap: wrap; margin-bottom: 24px;
    }
    h1 { font-size: 25px; margin: 0 0 7px; color: var(--navy); }
    .subtitle { color: #64748b; font-size: 13px; margin: 0; }

    .online-control {
      display: flex; align-items: center; gap: 12px;
      background: white; padding: 12px 16px;
      border-radius: 12px; border: 1px solid var(--border);
    }
    .online-label { font-size: 13px; font-weight: 700; }
    .switch {
      width: 46px; height: 25px; border: 0; border-radius: 20px;
      background: #cbd5e1; padding: 3px; transition: .2s;
    }
    .switch::after {
      content: ""; display: block; height: 19px; width: 19px;
      background: white; border-radius: 50%; transition: .2s;
    }
    .switch.active { background: var(--green-dark); }
    .switch.active::after { transform: translateX(21px); }

    .stats {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 16px; margin-bottom: 25px;
    }
    .stat { background: white; border: 1px solid var(--border); border-radius: 13px; padding: 20px; }
    .stat-label { color: #64748b; font-size: 12px; font-weight: 600; }
    .stat-number { display: block; margin-top: 10px; font-size: 29px; font-weight: 800; color: var(--navy); }

    .panel { background: white; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
    .panel-header {
      padding: 20px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 12px;
    }
    .panel-header h2 { font-size: 17px; color: var(--navy); margin: 0; }

    .tabs {
      display: flex; gap: 8px; padding: 15px 20px 0;
      overflow-x: auto; border-bottom: 1px solid var(--border);
    }
    .tab {
      border: 0; background: transparent; color: #64748b;
      padding: 11px 14px; font-size: 12px; font-weight: 700;
      border-bottom: 3px solid transparent; white-space: nowrap;
    }
    .tab.active { color: var(--navy); border-bottom-color: var(--green-dark); }

    .jobs { padding: 20px; display: grid; gap: 15px; }
    .job {
      border: 1px solid var(--border); border-radius: 12px;
      padding: 18px; display: grid; gap: 13px;
    }
    .job-top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .job h3 { font-size: 15px; color: var(--navy); margin: 0 0 6px; }
    .job-id { color: #94a3b8; font-size: 11px; }

    .job-details { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .detail { font-size: 12px; color: #64748b; line-height: 1.6; overflow-wrap: anywhere; }
    .detail strong { display: block; color: #26364a; font-size: 12px; }

    .status {
      display: inline-block; padding: 6px 10px; border-radius: 30px;
      font-size: 10px; font-weight: 800; text-transform: uppercase;
      background: #e8eef5; color: #475569; height: fit-content;
    }
    .status.pending, .status.requested, .status.proposed { background: #fff5d9; color: #946200; }
    .status.accepted, .status.in_progress, .status.ongoing { background: #e0f2fe; color: #075985; }
    .status.completed { background: #dcfce7; color: #166534; }
    .status.cancelled { background: #fee2e2; color: #991b1b; }

    .actions { display: flex; flex-wrap: wrap; gap: 9px; }
    .btn { border: 0; border-radius: 8px; padding: 10px 15px; font-size: 12px; font-weight: 700; }
    .btn-primary { background: var(--navy); color: white; }
    .btn-primary:hover { background: var(--navy-light); }
    .btn-green { background: var(--green); color: var(--navy); }
    .btn:disabled { opacity: .55; cursor: not-allowed; }

    .message { padding: 15px 20px; font-size: 13px; color: #64748b; }
    .message.error { color: #b91c1c; background: #fef2f2; }
    .message.success { color: #166534; background: #f0fdf4; }

    .empty {
      padding: 45px 20px; text-align: center;
      color: #94a3b8; font-size: 13px; line-height: 1.6;
    }
    .refresh {
      background: #edf2f7; color: var(--navy); border: 0;
      border-radius: 8px; padding: 9px 13px; font-size: 12px; font-weight: 700;
    }

    @media(max-width: 750px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .job-details { grid-template-columns: 1fr; }
      .container { margin-top: 22px; }
    }
    @media(max-width: 420px) {
      .stats { gap: 9px; }
      .stat { padding: 14px; }
      .stat-number { font-size: 24px; }
      .account { width: 100%; justify-content: space-between; }
    }
  </style>
</head>

<body>

<header class="topbar">
  <div class="brand">MEI <span>ONE</span></div>
  <div class="account">
    <span id="providerEmail">Checking account...</span>
    <button class="logout" id="logoutBtn" type="button">Sign out</button>
  </div>
</header>

<main class="container">

  <section class="welcome">
    <div>
      <h1 id="welcomeTitle">Provider Dashboard</h1>
      <p class="subtitle" id="providerSubtitle">Manage your services and customer requests.</p>
    </div>
    <div class="online-control">
      <span class="online-label" id="onlineLabel">Offline</span>
      <button class="switch" id="onlineSwitch" type="button" aria-label="Toggle availability"></button>
    </div>
  </section>

  <section class="stats">
    <div class="stat"><span class="stat-label">Available Requests</span><strong class="stat-number" id="availableCount">0</strong></div>
    <div class="stat"><span class="stat-label">Assigned Jobs</span><strong class="stat-number" id="assignedCount">0</strong></div>
    <div class="stat"><span class="stat-label">In Progress</span><strong class="stat-number" id="progressCount">0</strong></div>
    <div class="stat"><span class="stat-label">Completed</span><strong class="stat-number" id="completedCount">0</strong></div>
  </section>

  <section class="panel">
    <div class="panel-header">
      <h2>Service Requests</h2>
      <button class="refresh" id="refreshBtn" type="button">↻ Refresh</button>
    </div>
    <div class="tabs" id="serviceTabs">
      <button class="tab active" data-service="all" type="button">All Services</button>
    </div>
    <div id="notice"></div>
    <div class="jobs" id="jobsList">
      <div class="empty">Loading your dashboard...</div>
    </div>
  </section>

</main>

<script>
(function () {
  "use strict";

  /* =========================================================
     1. INLINE SUPABASE CONFIG — no external file required
     ========================================================= */
  var SUPABASE_URL = "https://tsvejnzxrxrrecgquxbq.supabase.co";
  var SUPABASE_KEY = "sb_publishable_P8ga4Gcyb3W3t6Dw_we4UODZ_";

  function makeClient() {
    // Reuse any client already created on this page.
    if (window.MEI_SUPABASE && typeof window.MEI_SUPABASE.from === "function") {
      return window.MEI_SUPABASE;
    }
    if (window.supabaseClient && typeof window.supabaseClient.from === "function") {
      return window.supabaseClient;
    }
    if (!window.supabase || typeof window.supabase.createClient !== "function") {
      return null;
    }
    var client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    });
    window.MEI_SUPABASE = client;
    window.supabaseClient = client;
    return client;
  }

  var sb = makeClient();

  /* =========================================================
     2. HARD STOP IF SUPABASE LIBRARY ITSELF FAILED
     ========================================================= */
  if (!sb) {
    var jobsListEl = document.getElementById("jobsList");
    if (jobsListEl) {
      jobsListEl.innerHTML =
        '<div class="empty">' +
        '<strong>Could not connect to MEI One.</strong><br>' +
        'The Supabase library failed to load. Check your internet connection, ' +
        'disable any ad-blocker for this site, and refresh.' +
        '</div>';
    }
    console.error(
      "MEI One: Supabase CDN failed to load. " +
      "Check https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    );
    return;
  }

  /* =========================================================
     3. DASHBOARD
     ========================================================= */
  var REQUEST_OPEN_STATUSES = ["pending", "requested", "proposed"];

  var session = null;
  var partner = null;
  var approvedServices = [];
  var allRequests = [];
  var activeService = "all";
  var busy = false;

  function $(id) { return document.getElementById(id); }

  function escapeHTML(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[c];
    });
  }

  function notify(message, type) {
    type = type || "success";
    $("notice").innerHTML =
      '<div class="message ' + type + '">' + escapeHTML(message) + "</div>";
    if (type === "success") {
      setTimeout(function () { $("notice").innerHTML = ""; }, 4000);
    }
  }

  function formatDate(value) {
    if (!value) return "Not available";
    var d = new Date(value);
    if (isNaN(d.getTime())) return "Not available";
    return d.toLocaleString();
  }

  function normalizeStatus(s) {
    return String(s || "").toLowerCase().trim();
  }

  function getRequestTitle(r) {
    return r.title || r.service || r.request_type || "Service request";
  }

  function getRequestTime(r) {
    return r.requested_at || r.created_at || null;
  }

  /* ---------- session + provider ---------- */

  function checkSession() {
    return sb.auth.getSession().then(function (res) {
      if (res.error) throw res.error;
      session = res.data.session;
      if (!session) {
        window.location.replace("provider-login.html");
        return false;
      }
      $("providerEmail").textContent = session.user.email || "Provider account";
      return true;
    });
  }

  function loadProvider() {
    return sb
      .from("partners")
      .select("id,user_id,type,business_name,phone,status,is_online")
      .eq("user_id", session.user.id)
      .maybeSingle()
      .then(function (res) {
        if (res.error) throw res.error;
        if (!res.data) {
          throw new Error(
            "No provider profile was found for this account. Contact MEI One support."
          );
        }
        partner = res.data;
        if (String(partner.status || "").toLowerCase() !== "approved") {
          throw new Error(
            "Your provider account is not approved yet. Please contact MEI One support."
          );
        }
        $("welcomeTitle").textContent = partner.business_name || "Provider Dashboard";
        $("providerSubtitle").textContent = partner.phone
          ? "Provider account • " + partner.phone
          : "Manage your services and customer requests.";
        updateOnlineDisplay();
      });
  }

  /* ---------- services ---------- */

  function loadServices() {
    return sb
      .from("partner_services")
      .select("service_id,status")
      .eq("partner_id", partner.id)
      .eq("status", "approved")
      .then(function (res) {
        if (res.error) throw res.error;
        var ids = [];
        (res.data || []).forEach(function (row) {
          if (row.service_id && ids.indexOf(row.service_id) === -1) {
            ids.push(row.service_id);
          }
        });
        if (!ids.length) {
          approvedServices = [];
          renderServiceTabs();
          return;
        }
        return sb
          .from("services")
          .select("id,service_code,service_name,description,icon,route,is_active,display_order")
          .in("id", ids)
          .eq("is_active", true)
          .order("display_order", { ascending: true })
          .then(function (sres) {
            if (sres.error) throw sres.error;
            approvedServices = sres.data || [];
            renderServiceTabs();
          });
      });
  }

  function renderServiceTabs() {
    var tabs = [{ id: "all", name: "All Services" }];
    approvedServices.forEach(function (s) {
      tabs.push({ id: s.id, name: s.service_name });
    });

    $("serviceTabs").innerHTML = tabs
      .map(function (t) {
        return (
          '<button class="tab ' +
          (activeService === t.id ? "active" : "") +
          '" data-service="' +
          escapeHTML(t.id) +
          '" type="button">' +
          escapeHTML(t.name) +
          "</button>"
        );
      })
      .join("");

    Array.prototype.forEach.call(
      $("serviceTabs").querySelectorAll(".tab"),
      function (btn) {
        btn.addEventListener("click", function () {
          activeService = btn.dataset.service;
          renderServiceTabs();
          renderRequests();
        });
      }
    );
  }

  /* ---------- requests ---------- */

  function loadRequests() {
    var ids = approvedServices.map(function (s) { return s.id; });
    if (!ids.length) {
      allRequests = [];
      updateStats();
      renderRequests();
      return Promise.resolve();
    }

    var query = sb
      .from("service_requests")
      .select("*")
      .in("service_id", ids)
      .order("created_at", { ascending: false })
      .limit(200);

    query = query.or("provider_id.is.null,provider_id.eq." + partner.id);

    return query.then(function (res) {
      if (res.error) throw res.error;
      allRequests = (res.data || []).filter(function (r) {
        if (r.requested_provider_id && r.requested_provider_id !== partner.id) {
          return false;
        }
        return true;
      });
      updateStats();
      renderRequests();
    });
  }

  function updateStats() {
    var available = 0, assigned = 0, inProgress = 0, completed = 0;
    allRequests.forEach(function (r) {
      var s = normalizeStatus(r.status);
      var mine = r.provider_id === partner.id;
      if (!r.provider_id && REQUEST_OPEN_STATUSES.indexOf(s) !== -1) available++;
      if (mine && ["accepted", "in_progress", "ongoing"].indexOf(s) !== -1) assigned++;
      if (mine && ["in_progress", "ongoing"].indexOf(s) !== -1) inProgress++;
      if (mine && s === "completed") completed++;
    });
    $("availableCount").textContent = available;
    $("assignedCount").textContent = assigned;
    $("progressCount").textContent = inProgress;
    $("completedCount").textContent = completed;
  }

  function renderRequests() {
    var requests = allRequests.slice();
    if (activeService !== "all") {
      requests = requests.filter(function (r) { return r.service_id === activeService; });
    }

    if (!requests.length) {
      $("jobsList").innerHTML =
        '<div class="empty">No service requests found for this service.</div>';
      return;
    }

    $("jobsList").innerHTML = requests
      .map(function (r) {
        var status = normalizeStatus(r.status);
        var isAssigned = r.provider_id === partner.id;
        var isAvailable =
          !r.provider_id && REQUEST_OPEN_STATUSES.indexOf(status) !== -1;

        var buttons = "";
        if (isAvailable) {
          buttons =
            '<button class="btn btn-green" data-action="accept" data-id="' +
            escapeHTML(r.id) + '" type="button">Accept Request</button>';
        } else if (isAssigned && status === "accepted") {
          buttons =
            '<button class="btn btn-primary" data-action="start" data-id="' +
            escapeHTML(r.id) + '" type="button">Start Job</button>';
        } else if (isAssigned && ["in_progress", "ongoing"].indexOf(status) !== -1) {
          buttons =
            '<button class="btn btn-green" data-action="complete" data-id="' +
            escapeHTML(r.id) + '" type="button">Mark Completed</button>';
        }

        var svc = null;
        for (var i = 0; i < approvedServices.length; i++) {
          if (approvedServices[i].id === r.service_id) { svc = approvedServices[i]; break; }
        }

        var pickup = r.pickup_address || r.pickup || "Not specified";
        var destination = r.destination_address || r.dropoff || "Not specified";
        var description = r.details || r.notes || "No additional details";
        var customer = r.customer_name || "Customer";

        return (
          '<article class="job">' +
            '<div class="job-top">' +
              "<div>" +
                "<h3>" + escapeHTML((svc && svc.icon) || "📋") + " " +
                  escapeHTML(getRequestTitle(r)) + "</h3>" +
                '<div class="job-id">Request: ' + escapeHTML(r.id) + "</div>" +
              "</div>" +
              '<span class="status ' + escapeHTML(status) + '">' +
                escapeHTML(status.replace(/_/g, " ")) + "</span>" +
            "</div>" +
            '<div class="job-details">' +
              '<div class="detail"><strong>Customer</strong>' + escapeHTML(customer) + "</div>" +
              '<div class="detail"><strong>Service</strong>' +
                escapeHTML((svc && svc.service_name) || r.service || "Service") + "</div>" +
              '<div class="detail"><strong>Pickup / Location</strong>' + escapeHTML(pickup) + "</div>" +
              '<div class="detail"><strong>Destination</strong>' + escapeHTML(destination) + "</div>" +
              '<div class="detail"><strong>Price</strong>' +
                (r.price == null ? "Not specified" : "KES " + Number(r.price).toLocaleString()) +
              "</div>" +
              '<div class="detail"><strong>Requested</strong>' +
                escapeHTML(formatDate(getRequestTime(r))) + "</div>" +
            "</div>" +
            '<div class="detail"><strong>Additional Information</strong>' +
              escapeHTML(description) + "</div>" +
            (buttons ? '<div class="actions">' + buttons + "</div>" : "") +
          "</article>"
        );
      })
      .join("");

    Array.prototype.forEach.call(
      $("jobsList").querySelectorAll("[data-action]"),
      function (btn) {
        btn.addEventListener("click", function () {
          updateRequest(btn.dataset.id, btn.dataset.action, btn);
        });
      }
    );
  }

  /* ---------- mutations ---------- */

  function updateRequest(requestId, action, button) {
    if (busy) return;

    var request = null;
    for (var i = 0; i < allRequests.length; i++) {
      if (allRequests[i].id === requestId) { request = allRequests[i]; break; }
    }
    if (!request) {
      notify("Request could not be found. Refresh and try again.", "error");
      return;
    }

    var currentStatus = normalizeStatus(request.status);
    var update = {};

    if (action === "accept") {
      if (request.provider_id || REQUEST_OPEN_STATUSES.indexOf(currentStatus) === -1) {
        notify("This request is no longer available.", "error");
        refreshDashboard();
        return;
      }
      if (request.requested_provider_id && request.requested_provider_id !== partner.id) {
        notify("This request is assigned to another provider.", "error");
        return;
      }
      update.provider_id = partner.id;
      update.status = "accepted";
      update.accepted_at = new Date().toISOString();
    } else if (action === "start") {
      if (request.provider_id !== partner.id || currentStatus !== "accepted") {
        notify("This job cannot be started in its current state.", "error");
        return;
      }
      update.status = "in_progress";
      update.started_at = new Date().toISOString();
    } else if (action === "complete") {
      if (request.provider_id !== partner.id ||
          ["in_progress", "ongoing"].indexOf(currentStatus) === -1) {
        notify("This job cannot be completed in its current state.", "error");
        return;
      }
      update.status = "completed";
      update.completed_at = new Date().toISOString();
    } else {
      return;
    }

    busy = true;
    button.disabled = true;
    button.textContent = "Please wait...";

    var query = sb.from("service_requests").update(update).eq("id", requestId);

    if (action === "accept") {
      query = query.is("provider_id", null).in("status", REQUEST_OPEN_STATUSES);
      if (request.requested_provider_id) {
        query = query.eq("requested_provider_id", partner.id);
      }
    } else {
      query = query.eq("provider_id", partner.id);
      query = action === "start"
        ? query.eq("status", "accepted")
        : query.in("status", ["in_progress", "ongoing"]);
    }

    query
      .select("id")
      .then(function (res) {
        if (res.error) throw res.error;
        if (!res.data || !res.data.length) {
          throw new Error(
            "The request was not updated. It may have changed or your account may not have permission."
          );
        }
        notify(
          action === "accept"
            ? "Request accepted successfully."
            : action === "start"
              ? "Job started successfully."
              : "Job marked as completed."
        );
        return refreshDashboard();
      })
      .catch(function (err) {
        console.error("Request update error:", err);
        notify(err.message || "Unable to update this request.", "error");
      })
      .then(function () {
        busy = false;
        button.disabled = false;
      });
  }

  /* ---------- online toggle ---------- */

  function updateOnlineDisplay() {
    var online = Boolean(partner && partner.is_online);
    $("onlineSwitch").classList.toggle("active", online);
    $("onlineLabel").textContent = online ? "Online" : "Offline";
  }

  function toggleOnline() {
    if (!partner || busy) return;

    busy = true;
    $("onlineSwitch").disabled = true;
    var newValue = !partner.is_online;

    sb.from("partners")
      .update({ is_online: newValue })
      .eq("id", partner.id)
      .eq("user_id", session.user.id)
      .select("id,is_online")
      .maybeSingle()
      .then(function (res) {
        if (res.error) throw res.error;
        if (!res.data) {
          throw new Error(
            "Availability was not updated. Check your provider permissions."
          );
        }
        partner.is_online = res.data.is_online;
        updateOnlineDisplay();
        notify(partner.is_online ? "You are now online." : "You are now offline.");
      })
      .catch(function (err) {
        console.error("Availability update error:", err);
        notify(err.message || "Unable to update availability.", "error");
      })
      .then(function () {
        busy = false;
        $("onlineSwitch").disabled = false;
      });
  }

  /* ---------- refresh + logout ---------- */

  function refreshDashboard() {
    $("jobsList").innerHTML = '<div class="empty">Refreshing requests...</div>';
    return loadServices()
      .then(loadRequests)
      .catch(function (err) {
        console.error("Dashboard refresh error:", err);
        notify(err.message || "Unable to refresh dashboard.", "error");
      });
  }

  function logout() {
    $("logoutBtn").disabled = true;
    sb.auth.signOut({ scope: "local" })
      .then(function (res) {
        if (res.error) throw res.error;
        window.location.replace("provider-login.html");
      })
      .catch(function (err) {
        console.error("Logout error:", err);
        notify("Unable to sign out. Please try again.", "error");
        $("logoutBtn").disabled = false;
      });
  }

  /* ---------- initialize ---------- */

  function initialize() {
    checkSession()
      .then(function (ok) {
        if (!ok) return;
        return loadProvider()
          .then(loadServices)
          .then(loadRequests);
      })
      .catch(function (err) {
        console.error("Dashboard initialization error:", err);
        $("jobsList").innerHTML =
          '<div class="empty">' +
          escapeHTML(err.message || "Unable to load provider dashboard.") +
          "</div>";
        notify(err.message || "Dashboard initialization failed.", "error");
      });
  }

  $("onlineSwitch").addEventListener("click", toggleOnline);
  $("refreshBtn").addEventListener("click", refreshDashboard);
  $("logoutBtn").addEventListener("click", logout);

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initialize);
  } else {
    initialize();
  }
})();
</script>

</body>
</html>
