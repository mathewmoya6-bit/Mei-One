<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEI One · Provider Dashboard</title>
<style>
  :root{--ink:#14213d;--muted:#5b6475;--line:#d9dee8;--bg:#f3f5f9;--card:#fff;--brand:#0b5cff;--ok:#12805c;--warn:#b45309;--danger:#b42318}
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
  header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--ink);color:#fff}
  header h1{font-size:18px;margin:0}
  header .tools{display:flex;gap:12px;align-items:center}
  select,input,textarea,button{font:inherit}
  select,input,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  header select{width:auto}
  button{padding:9px 14px;border:0;border-radius:8px;background:var(--brand);color:#fff;cursor:pointer}
  button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #8fb3ff;outline-offset:2px}
  main{max-width:900px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
  h2{font-size:20px;margin:0 0 4px}h3{font-size:16px;margin:20px 0 8px}
  .muted{color:var(--muted);font-size:14px}
  .row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .pill{display:inline-block;padding:2px 10px;border-radius:99px;background:#e8efff;color:var(--brand);font-size:13px}
  .steps{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
  .steps span{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--bg);color:var(--muted)}
  .steps span.done{background:#dff3ea;color:var(--ok)}.steps span.now{background:var(--ink);color:#fff}
  .notice{border-left:4px solid var(--danger);background:#fdecea;padding:10px 12px;border-radius:6px;font-size:14px}
  label{display:block;font-size:14px;margin:10px 0 4px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:600px){.grid{grid-template-columns:1fr}}
  #toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;display:none}
</style>
</head>
<body>
<header>
  <h1 id="title">MEI One · Provider Dashboard</h1>
  <div class="tools" id="tools" hidden>
    <select id="switcher" aria-label="Switch workspace" hidden></select>
    <label style="margin:0;display:flex;gap:6px;align-items:center;font-size:14px">
      <input type="checkbox" id="avail" style="width:auto"> Available
    </label>
    <button class="ghost" id="signout">Sign out</button>
  </div>
</header>
<main id="app"><p class="muted">Loading your workspace…</p></main>
<div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script>
"use strict";
const sb = window.MEI_SUPABASE;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pretty = s => s.replace(/_/g, " ");

/* Workspace registry: one shell, each workspace supplies title + status flow + extras */
const WS = {
  rides:       {title:"Driver workspace",   statuses:["requested","accepted","arriving","on_trip","completed"]},
  delivery:    {title:"Delivery workspace", statuses:["requested","accepted","picked_up","delivered"]},
  dispatch:    {title:"Dispatch workspace", statuses:["requested","accepted","en_route","on_site","completed"]},
  home:        {title:"Home services",      statuses:["requested","quoted","booked","completed"]},
  marketplace: {title:"Marketplace",        statuses:["listed","ordered","shipped","completed"]},
  incident:    {title:"Incident workspace", statuses:["reported","dispatched","on_scene","secured","documented","handed_over"], report:true},
  generic:     {title:"Service workspace",  statuses:["requested","accepted","completed"]}
};

const S = {partner:null, offerings:[], active:null};

function toast(msg){const t=$("toast");t.textContent=msg;t.style.display="block";setTimeout(()=>t.style.display="none",2800);}
function message(h, p){$("app").innerHTML=`<div class="card"><h2>${h}</h2><p class="muted">${p}</p></div>`;}

async function init(){
  if(!sb) return message("Can't connect","The Supabase library did not load. Check that supabase-config.js is in the same folder.");
  const {data:{session}} = await sb.auth.getSession();
  if(!session){location.href="provider-login.html";return;}

  const {data:partner,error:e1} = await sb.from("partners")
    .select("id,business_name,is_available").eq("user_id",session.user.id).maybeSingle();
  if(e1) return message("Something went wrong","We couldn't load your provider account. Refresh and try again.");
  if(!partner) return message("No provider account","This login isn't linked to a provider account. Register as a provider to continue.");
  S.partner = partner;

  const {data:offers,error:e2} = await sb.from("partner_services")
    .select("status, services(id,name,slug,workspace_type)").eq("partner_id",partner.id);
  if(e2) return message("Something went wrong","We couldn't load your services. Refresh and try again.");

  const approved = (offers||[]).filter(o=>o.status==="approved" && o.services);
  if(!approved.length){
    const pending = (offers||[]).some(o=>o.status==="pending");
    return message(pending?"Application under review":"No approved services",
      pending?"We're checking your details. You'll see your workspace here once you're approved."
             :"Apply for a service to start receiving jobs.");
  }
  S.offerings = approved.map(o=>o.services);
  setupHeader();
  openWorkspace(S.offerings[0]);
}

function setupHeader(){
  $("tools").hidden = false;
  $("avail").checked = !!S.partner.is_available;
  $("avail").onchange = async e => {
    const {error} = await sb.from("partners").update({is_available:e.target.checked}).eq("id",S.partner.id);
    if(error){e.target.checked=!e.target.checked;toast("Couldn't update availability");}
    else toast(e.target.checked?"You're available":"You're offline");
  };
  $("signout").onclick = async()=>{await sb.auth.signOut();location.href="provider-login.html";};
  const sw = $("switcher");
  if(S.offerings.length>1){
    sw.hidden=false;
    sw.innerHTML=S.offerings.map((s,i)=>`<option value="${i}">${esc(s.name)}</option>`).join("");
    sw.onchange=()=>openWorkspace(S.offerings[+sw.value]);
  }
}

function wsOf(svc){return WS[svc.workspace_type] || WS.generic;}

async function openWorkspace(svc){
  S.active = svc;
  const ws = wsOf(svc);
  $("title").textContent = `${svc.name} · ${ws.title}`;
  const first = ws.statuses[0], last = ws.statuses[ws.statuses.length-1];

  const [open, mine] = await Promise.all([
    sb.from("service_requests").select("*").eq("service_id",svc.id).is("partner_id",null).eq("status",first).order("created_at",{ascending:false}),
    sb.from("service_requests").select("*").eq("service_id",svc.id).eq("partner_id",S.partner.id).neq("status",last).order("created_at",{ascending:false})
  ]);
  if(open.error||mine.error) return message("Couldn't load jobs","Refresh the page to try again.");

  const emergency = ws.report ? `<div class="notice" role="note"><strong>Injuries, fire or danger?</strong> Call 999 or 112 before anything else. MEI One does not replace emergency services.</div>` : "";
  $("app").innerHTML = `${emergency}
    <h3>New requests (${open.data.length})</h3><div id="open"></div>
    <h3>Your active jobs (${mine.data.length})</h3><div id="mine"></div>`;

  $("open").innerHTML = open.data.length ? open.data.map(r=>jobCard(r,ws,false)).join("") : `<p class="muted">No new requests right now. Stay available and they'll appear here.</p>`;
  $("mine").innerHTML = mine.data.length ? mine.data.map(r=>jobCard(r,ws,true)).join("") : `<p class="muted">You have no active jobs.</p>`;

  $("app").onclick = e => {
    const b = e.target.closest("button[data-act]"); if(!b) return;
    const id = b.dataset.id;
    if(b.dataset.act==="accept") accept(id,ws);
    if(b.dataset.act==="next") advance(id,b.dataset.to);
    if(b.dataset.act==="report") openReport(id);
  };
}

function jobCard(r, ws, isMine){
  const i = Math.max(0, ws.statuses.indexOf(r.status));
  const steps = ws.statuses.map((s,k)=>`<span class="${k<i?"done":k===i?"now":""}">${pretty(s)}</span>`).join("");
  const desc = r.description || r.details || r.notes || r.location_text || "No details provided";
  const next = ws.statuses[i+1];
  const btns = !isMine
    ? `<button data-act="accept" data-id="${esc(r.id)}">Accept job</button>`
    : `${ws.report?`<button class="ghost" data-act="report" data-id="${esc(r.id)}">Open scene report</button>`:""}
       ${next?`<button data-act="next" data-id="${esc(r.id)}" data-to="${esc(next)}">Mark ${pretty(next)}</button>`:""}`;
  return `<div class="card"><div class="row"><strong>Request ${esc(String(r.id).slice(0,8))}</strong><span class="pill">${pretty(r.status)}</span></div>
    <p class="muted">${esc(desc)}</p><div class="steps">${steps}</div><div class="row" style="justify-content:flex-start">${btns}</div></div>`;
}

async function accept(id, ws){
  // Claim only if still unassigned; RLS also enforces approval for this service.
  const {data,error} = await sb.from("service_requests")
    .update({partner_id:S.partner.id,status:ws.statuses[1]}).eq("id",id).is("partner_id",null).select("id");
  if(error||!data||!data.length) toast("Someone else already took this job");
  else toast("Job accepted");
  openWorkspace(S.active);
}

async function advance(id, to){
  const {error} = await sb.from("service_requests").update({status:to}).eq("id",id).eq("partner_id",S.partner.id);
  toast(error?"Couldn't update status":`Marked ${pretty(to)}`);
  openWorkspace(S.active);
}

/* ---- Incident workspace: scene report ---- */
async function openReport(id){
  const {data:req} = await sb.from("service_requests").select("id,customer_id").eq("id",id).maybeSingle();
  const {data:rep} = await sb.from("incident_reports").select("*").eq("request_id",id).maybeSingle();
  const r = rep || {};
  const loc = r.location ? `${r.location.lat}, ${r.location.lng}` : "";
  $("app").innerHTML = `<div class="card"><div class="row"><h2>Scene report</h2><button class="ghost" id="back">Back to jobs</button></div>
    <label>GPS pin</label><div class="row"><input id="loc" value="${esc(loc)}" readonly placeholder="Not captured"><button class="ghost" id="gps">Capture location</button></div>
    <div class="grid"><div><label>Police abstract number</label><input id="abs" value="${esc(r.police_abstract_no)}"></div>
    <div><label>Insurers involved</label><input id="ins" value="${esc((r.parties&&r.parties.insurers)||"")}"></div></div>
    <label>Vehicles and drivers</label><textarea id="veh" rows="3" placeholder="Plate numbers, driver names, contacts">${esc((r.parties&&r.parties.vehicles)||"")}</textarea>
    <label>Witnesses</label><textarea id="wit" rows="2" placeholder="Name and phone for each witness">${esc(r.witnesses&&r.witnesses.text||"")}</textarea>
    <label>Notes</label><textarea id="notes" rows="3">${esc(r.notes)}</textarea>
    <label>Photos (${(r.photo_paths||[]).length} saved)</label><input id="photos" type="file" accept="image/*" multiple>
    <div class="row" style="justify-content:flex-start;margin-top:14px"><button id="save">Save report</button><button class="ghost" id="tow">Propose tow to customer</button></div>
    <p class="muted">A proposed tow only becomes a job after the customer confirms it.</p></div>`;

  let pin = r.location || null;
  $("back").onclick = ()=>openWorkspace(S.active);
  $("gps").onclick = ()=>navigator.geolocation
    ? navigator.geolocation.getCurrentPosition(p=>{pin={lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6)};$("loc").value=`${pin.lat}, ${pin.lng}`;},
        ()=>toast("Couldn't get location. Check permissions."))
    : toast("Location isn't available on this device");

  $("save").onclick = async ()=>{
    const btn=$("save");btn.disabled=true;
    const paths=[...(r.photo_paths||[])];
    for(const f of $("photos").files){
      const p=`${id}/${Date.now()}-${f.name.replace(/[^\w.-]/g,"_")}`;
      const {error}=await sb.storage.from("incident-photos").upload(p,f);
      if(error){toast(`Couldn't upload ${f.name}`);btn.disabled=false;return;}
      paths.push(p);
    }
    const {error} = await sb.from("incident_reports").upsert({
      request_id:id, location:pin, police_abstract_no:$("abs").value.trim()||null,
      parties:{vehicles:$("veh").value,insurers:$("ins").value}, witnesses:{text:$("wit").value},
      notes:$("notes").value, photo_paths:paths, updated_at:new Date().toISOString()
    });
    btn.disabled=false;
    if(error) return toast("Couldn't save the report");
    toast("Report saved"); openReport(id);
  };

  $("tow").onclick = async ()=>{
    const {data:tow} = await sb.from("services").select("id").eq("slug","towing").maybeSingle();
    if(!tow||!req) return toast("Towing isn't available yet");
    const {error} = await sb.from("service_requests").insert({
      service_id:tow.id, customer_id:req.customer_id, parent_request_id:id, status:"proposed"});
    toast(error?"Couldn't send the tow proposal. You may need towing approval.":"Tow proposed. Waiting for the customer.");
  };
}

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
