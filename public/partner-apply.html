<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071a2f">
  <meta name="robots" content="noindex">
  <title>Provider application | MEI One</title>
  <link rel="icon" href="assets/favicon.png" type="image/png">

  <style>
    :root{--navy:#06111f;--green:#b7ff00;--green-hover:#c8ff3d;--white:#fff;--text:#e8f0f7;--muted:#91a4b8;--border:rgba(255,255,255,.10)}
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;padding:24px;display:flex;align-items:center;justify-content:center;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--white);
      background:radial-gradient(circle at 85% 10%,rgba(183,255,0,.11),transparent 28%),radial-gradient(circle at 10% 90%,rgba(0,120,255,.08),transparent 32%),var(--navy)}
    button,input,select{font:inherit}button{cursor:pointer}
    .page{width:100%;max-width:480px}
    .brand{text-align:center;margin-bottom:24px}
    .brand-mark{width:68px;height:68px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;border-radius:20px;background:var(--green);color:var(--navy);font-size:23px;font-weight:950;letter-spacing:-1px}
    .brand h1{font-size:32px;line-height:1;font-weight:950;letter-spacing:-1.5px}
    .card{padding:30px;border:1px solid var(--border);border-radius:24px;background:linear-gradient(180deg,rgba(16,38,61,.96),rgba(7,19,33,.98));box-shadow:0 25px 70px rgba(0,0,0,.4)}
    .card-header{margin-bottom:24px}
    .card-header h2{font-size:25px;font-weight:900;letter-spacing:-.8px}
    .card-header p{margin-top:7px;color:var(--muted);font-size:14px;line-height:1.5}
    .message{display:none;margin-bottom:18px;padding:13px 14px;border-radius:12px;font-size:13px;line-height:1.5}
    .message.show{display:block}
    .message.error{color:#ffdce0;background:rgba(255,100,116,.10);border:1px solid rgba(255,100,116,.28)}
    .message.success{color:#d9ffeb;background:rgba(93,227,160,.10);border:1px solid rgba(93,227,160,.28)}
    .field{margin-bottom:17px}
    .field label{display:block;margin-bottom:8px;color:var(--text);font-size:13px;font-weight:800}
    .field input,.field select{width:100%;height:52px;padding:0 15px;border:1px solid rgba(255,255,255,.12);border-radius:13px;outline:none;background:rgba(0,0,0,.2);color:var(--white);transition:border-color .2s,box-shadow .2s}
    .field select option{background:#0a1a2b;color:#fff}
    .field input::placeholder{color:#62778b}
    .field input:focus,.field select:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(183,255,0,.10)}
    .field small{display:block;margin-top:6px;color:var(--muted);font-size:12px}
    .primary-button{width:100%;min-height:54px;border:0;border-radius:14px;background:var(--green);color:#07101b;font-size:15px;font-weight:950;transition:transform .2s,background .2s,opacity .2s}
    .primary-button:hover:not(:disabled){background:var(--green-hover);transform:translateY(-1px)}
    .primary-button:disabled{opacity:.55;cursor:not-allowed;transform:none}
    .link-row{margin-top:18px;text-align:center;font-size:13px;color:var(--muted)}
    .link-row button{border:0;background:transparent;color:var(--green);font-weight:800;font-size:13px}
    .spinner{width:17px;height:17px;display:inline-block;vertical-align:middle;margin-right:8px;border:2px solid rgba(0,0,0,.22);border-top-color:#07101b;border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    [hidden]{display:none !important}
    @media (max-width:520px){body{padding:15px}.card{padding:22px;border-radius:20px}.brand h1{font-size:29px}}
  </style>
</head>
<body>

<main class="page">
  <header class="brand">
    <div class="brand-mark">MEI</div>
    <h1>MEI One</h1>
  </header>

  <section class="card">
    <div class="card-header">
      <h2>Provider application</h2>
      <p>Tell us about your service. We review every application and email you when it's approved.</p>
    </div>

    <div id="message" class="message" role="alert" aria-live="polite"></div>

    <form id="applyForm" novalidate>
      <div class="field" id="typeField">
        <label for="type">Service you offer</label>
        <select id="type" name="type" required>
          <option value="">Choose one</option>
          <option value="driver">Driver (rides and deliveries)</option>
          <option value="towing">Towing</option>
          <option value="roadside">Roadside assistance</option>
          <option value="garage">Garage / auto services</option>
          <option value="marketplace">Marketplace seller</option>
          <option value="home">Home services</option>
        </select>
      </div>

      <div class="field">
        <label for="business">Business or trading name</label>
        <input id="business" name="business" type="text" placeholder="e.g. Kamau Recovery Services" maxlength="120" required>
        <small id="bizHint">Drivers can use their own name.</small>
      </div>

      <div class="field">
        <label for="phone">Business phone</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="07XX XXX XXX" maxlength="20" required>
      </div>

      <button type="submit" class="primary-button" id="applySubmit">Submit application</button>
    </form>

    <div class="link-row"><button type="button" id="signOut">Sign out</button></div>
  </section>
</main>

<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
<script src="js/supabase.js"></script>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var form = $("applyForm"), message = $("message"), btn = $("applySubmit");
  var sb = window.supabaseClient || window.MEISupabase || null;
  var params = new URLSearchParams(window.location.search);
  var VALID = ["driver", "towing", "roadside", "garage", "marketplace", "home"];
  var lockedType = VALID.indexOf(params.get("type")) > -1 ? params.get("type") : "";
  var user = null;

  function show(text, type) { message.textContent = text; message.className = text ? "message show " + (type || "error") : "message"; }

  function normalisePhone(raw) {
    var d = String(raw).replace(/[\s\-()]/g, "");
    var m = d.match(/^(?:\+?254|0)([17]\d{8})$/);
    return m ? "0" + m[1] : null;
  }

  $("signOut").addEventListener("click", async function () {
    try { if (sb) await sb.auth.signOut(); } catch (e) {}
    window.location.replace("login.html");
  });

  form.addEventListener("submit", async function (event) {
    event.preventDefault();
    show("");

    var type = lockedType || $("type").value;
    var business = $("business").value.trim();
    var phone = normalisePhone($("phone").value);

    if (VALID.indexOf(type) === -1) return show("Choose the service you offer.");
    if (business.length < 2) return show("Enter your business or trading name.");
    if (!phone) return show("Enter a valid Kenyan mobile number, e.g. 0712345678.");

    btn.disabled = true;
    var label = btn.textContent;
    btn.innerHTML = '<span class="spinner"></span>Submitting...';

    // Status and is_online are forced by the database rules: new rows are always pending and offline.
    var r = await sb.from("partners").insert({
      user_id: user.id, type: type, business_name: business, phone: phone,
      status: "pending", is_online: false
    });

    if (r.error) {
      console.error("MEI One: application failed.", r.error);
      // 23505 = already applied
      if (r.error.code === "23505") return window.location.replace("provider-dashboard.html");
      show("We couldn't submit your application. Please try again.");
      btn.disabled = false; btn.textContent = label;
      return;
    }

    show("Application submitted. Taking you to your status page...", "success");
    setTimeout(function () { window.location.replace("provider-dashboard.html"); }, 800);
  });

  async function boot() {
    if (!sb) return show("MEI One could not connect right now. Please try again later.");

    var s = await sb.auth.getSession();
    if (!s.data || !s.data.session) {
      window.location.replace("login.html?next=partner-apply.html");
      return;
    }
    user = s.data.session.user;

    // Already applied? Go straight to the dashboard (it shows pending / approved / rejected).
    var r = await sb.from("partners").select("id").eq("user_id", user.id).maybeSingle();
    if (r.data) return window.location.replace("provider-dashboard.html");

    var meta = user.user_metadata || {};
    if (meta.phone) $("phone").value = meta.phone;
    if (lockedType) {
      $("type").value = lockedType;
      $("typeField").hidden = true;
    }
  }

  boot().catch(function (e) { console.error(e); show("Something went wrong. Please refresh."); });
})();
</script>

</body>
</html>
