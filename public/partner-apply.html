<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071a2f">
  <meta name="description" content="Sign in to your MEI One provider account.">
  <title>Provider Sign In | MEI One</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: grid;
      place-items: center;
      background: #071a2f;
      color: #fff;
      font-family: Inter, Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 35px;
      background: #102640;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
    }

    .logo {
      font-size: 27px;
      font-weight: 800;
      color: #00ff88;
      letter-spacing: -1px;
    }

    h1 {
      font-size: 25px;
      margin: 25px 0 8px;
    }

    p {
      color: #aebdce;
      line-height: 1.6;
      font-size: 14px;
    }

    input {
      display: block;
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border: 1px solid #38516c;
      border-radius: 9px;
      outline: none;
      background: #071a2f;
      color: white;
      font-size: 15px;
      font-family: inherit;
    }

    input:focus {
      border-color: #00ff88;
      box-shadow: 0 0 0 3px rgba(0,255,136,.1);
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 9px;
      background: #00ff88;
      color: #071a2f;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      font-family: inherit;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .switch {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #aebdce;
    }

    a {
      color: #00ff88;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    #message {
      display: none;
      padding: 12px;
      margin-top: 16px;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }

    #message.error {
      display: block;
      background: rgba(255,75,75,.12);
      color: #ffaaaa;
    }

    #message.success {
      display: block;
      background: rgba(0,255,136,.1);
      color: #00ff88;
    }

    #message.info {
      display: block;
      background: rgba(255,255,255,.07);
      color: #d5e2ef;
    }

    .forgot {
      text-align: right;
      margin-top: 8px;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      .card {
        padding: 25px;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo">MEI ONE</div>

    <p>MEI One Provider Portal</p>

    <h1>Provider Sign In</h1>

    <p>
      Access your driver and service provider dashboard.
    </p>

    <form id="loginForm">

      <input
        id="email"
        type="email"
        placeholder="Email address"
        autocomplete="username"
        required
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <div class="forgot">
        <a href="#" id="forgotPassword">Forgot password?</a>
      </div>

      <button type="submit" id="loginButton">
        Sign In
      </button>

    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <div class="switch">
      New provider?
      <!-- CHANGED: Now redirects to /partner-apply.html -->
      <a href="/partner-apply.html" id="applyProviderLink">Apply to become a provider</a>
    </div>

    <div class="switch">
      <a href="/customer-signin.html">Customer sign in</a>
    </div>

    <div class="switch">
      <a href="/index.html">← Back to MEI One</a>
    </div>

  </main>

  <!-- Load Supabase before the MEI configuration -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>

  <script>
    "use strict";

    // Use the shared MEI One Supabase client.
    const sb = window.MEI_SUPABASE;

    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    function showMessage(text, type = "info") {
      message.textContent = text;
      message.className = type;
    }

    function setLoading(loading) {
      button.disabled = loading;
      button.textContent = loading ? "Signing in..." : "Sign In";
    }

    // Check Supabase initialization.
    if (!sb) {
      showMessage(
        "MEI One could not connect to Supabase. Check your configuration and script loading order.",
        "error"
      );

      button.disabled = true;
    }

    // PROVIDER SIGN IN
    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      if (!sb) return;

      const email = document
        .getElementById("email")
        .value.trim();

      const password = document
        .getElementById("password")
        .value;

      if (!email || !password) {
        showMessage("Enter your email and password.", "error");
        return;
      }

      setLoading(true);
      showMessage("Authenticating your account...", "info");

      try {

        // Step 1: Authenticate with Supabase.
        const { data, error } = await sb.auth.signInWithPassword({
          email,
          password
        });

        if (error) throw error;

        if (!data.user) {
          throw new Error("Authentication failed. Please try again.");
        }

        // Step 2: Check the authenticated user's driver record.
        // The current drivers table uses id = auth.users.id.
        const {
          data: driver,
          error: driverError
        } = await sb
          .from("drivers")
          .select("id, name, active")
          .eq("id", data.user.id)
          .maybeSingle();

        if (driverError) {
          throw new Error(
            "Unable to verify your provider account: " +
            driverError.message
          );
        }

        // Step 3: Reject accounts without a provider record.
        if (!driver) {
          await sb.auth.signOut();

          throw new Error(
            "No provider account was found. Please apply to become a provider."
          );
        }

        // Step 4: Check provider activation.
        if (driver.active !== true) {
          await sb.auth.signOut();

          throw new Error(
            "Your provider account is inactive. Please contact MEI One support."
          );
        }

        // Step 5: Allow access to provider dashboard.
        showMessage("Sign in successful. Opening your dashboard...", "success");

        window.location.replace("/provider-dashboard.html");

      } catch (error) {

        console.error("MEI One provider sign-in error:", error);

        showMessage(
          error.message || "Unable to sign in. Please try again.",
          "error"
        );

      } finally {
        setLoading(false);
      }
    });

    // PASSWORD RESET
    document
      .getElementById("forgotPassword")
      .addEventListener("click", async function (event) {

        event.preventDefault();

        if (!sb) {
          showMessage("Supabase is unavailable.", "error");
          return;
        }

        const email = document
          .getElementById("email")
          .value.trim();

        if (!email) {
          showMessage(
            "Enter your email address first to reset your password.",
            "error"
          );
          return;
        }

        try {
          showMessage("Sending password reset instructions...", "info");

          const { error } = await sb.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin + "/provider-signin.html"
          });

          if (error) throw error;

          showMessage(
            "If this email is registered, password reset instructions will be sent.",
            "success"
          );

        } catch (error) {
          console.error("Password reset error:", error);
          showMessage(error.message, "error");
        }
      });

    // APPLY TO BECOME A PROVIDER — explicit redirect to /partner-apply.html
    document
      .getElementById("applyProviderLink")
      .addEventListener("click", function (event) {
        event.preventDefault();
        window.location.href = "/partner-apply.html";
      });

  </script>

</body>
</html>
