<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071a2f">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin | MEI One</title>
  <link rel="icon" href="assets/favicon.png" type="image/png">

  <style>
    :root{
      --navy:#071a2f;
      --green:#00b85c;
      --green-dark:#067a43;
      --muted:#5b6b7b;
      --border:#d8e1e8;
      --bg:#f3f6f9;
      --danger:#b91c1c;
      --radius:14px;
    }
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{
      margin:0;background:var(--bg);color:var(--navy);
      font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;
    }
    [hidden]{display:none !important}
    button,input,select,textarea{font:inherit}
    a{color:var(--green-dark)}
    :focus-visible{outline:3px solid var(--green);outline-offset:2px}

    .topbar{
      background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;
      gap:12px;padding:12px 18px;position:sticky;top:0;z-index:10;
    }
    .brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}
    .brand-mark{background:var(--green);color:#04210f;font-weight:800;font-size:.8rem;padding:6px 9px;border-radius:8px;letter-spacing:.04em}
    .brand strong{display:block;line-height:1.1}
    .brand small{display:block;opacity:.7;font-size:.75rem}
    .who{display:flex;align-items:center;gap:12px;font-size:.85rem}
    .who span{opacity:.85;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .btn-ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.85rem;cursor:pointer}
    .btn-ghost:hover{border-color:#fff}

    main{max-width:960px;margin:0 auto;padding:20px 16px 60px}

    .panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:22px}
    .panel h1,.panel h2{margin:0 0 6px}
    .panel p{margin:0 0 16px;color:var(--muted)}
    .auth{max-width:420px;margin:40px auto 0}
    .field{display:grid;gap:6px;margin-bottom:14px;font-weight:700;font-size:.9rem}
    .field small{font-weight:400;color:var(--muted)}
    .field input,.field select,.field textarea{
      width:100%;padding:11px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--navy);font-weight:400;
    }
    .field textarea{resize:vertical;min-height:70px}
    .btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer;background:var(--green);color:#04210f}
    .btn:hover:not(:disabled){filter:brightness(.95)}
    .btn:disabled{opacity:.55;cursor:default}
    .btn-block{width:100%}
    .btn-outline{background:#fff;color:var(--navy);border:1px solid var(--border)}
    .btn-outline:hover:not(:disabled){border-color:var(--navy);filter:none}
    .btn-danger{background:#fff;color:var(--danger);border:1px solid #f3b8b8}
    .btn-danger:hover:not(:disabled){background:#fff5f5;filter:none}
    .btn-small{padding:7px 14px;font-size:.85rem}
    .form-message{min-height:1.4em;margin:0 0 12px;font-size:.9rem}
    .form-message[data-type="error"]{color:var(--danger)}
    .form-message[data-type="success"]{color:var(--green-dark)}

    .tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}
    .tab{flex:1 0 auto;background:#fff;border:1px solid var(--border);color:var(--navy);padding:10px 16px;border-radius:999px;font-weight:700;font-size:.9rem;cursor:pointer;white-space:nowrap}
    .tab[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
    .count{display:inline-block;min-width:1.5em;margin-left:6px;padding:0 6px;border-radius:999px;background:rgba(128,150,170,.2);font-size:.78rem}
    .tab[aria-selected="true"] .count{background:var(--green);color:#04210f}

    .toolbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin:0 0 14px}
    .filters{display:flex;flex-wrap:wrap;gap:6px}
    .filter{background:transparent;border:1px solid var(--border);color:var(--navy);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.85rem;cursor:pointer}
    .filter[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#04210f}
    .toolbar small{color:var(--muted)}

    .list{display:grid;gap:12px}
    .item{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px}
    .item-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    .title{font-weight:800;overflow-wrap:anywhere}
    .title span{color:var(--muted);font-weight:400;margin:0 4px}
    .meta{font-size:.88rem;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
    .notes{margin-top:10px;padding:10px 12px;background:var(--bg);border-radius:10px;font-size:.9rem;overflow-wrap:anywhere;white-space:pre-wrap}
    .links{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-weight:700;font-size:.9rem}
    .actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}
    .actions select,.actions input{padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--navy);min-width:0}
    .actions select{flex:1 1 220px}
    .driver-line{margin-top:10px;font-weight:700}
    .chip{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:3px 10px;border-radius:999px;white-space:nowrap}
    .chip[data-status="requested"],.chip[data-status="new"]{background:#fff6e0;color:#92600a}
    .chip[data-status="accepted"],.chip[data-status="approved"],.chip[data-status="on"]{background:#eafff4;color:var(--green-dark)}
    .chip[data-status="arrived"],.chip[data-status="reviewing"]{background:#e8f1ff;color:#1d4ed8}
    .chip[data-status="completed"]{background:#eef0f3;color:#475467}
    .chip[data-status="cancelled"],.chip[data-status="rejected"],.chip[data-status="off"]{background:#fff0f0;color:var(--danger)}
    .empty{text-align:center;padding:36px 16px;color:var(--muted)}
    .empty h3{margin:0 0 4px;color:var(--navy)}

    .add-driver{margin-bottom:16px}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
    @media(max-width:560px){.grid-2{grid-template-columns:1fr}}

    .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:999px;font-size:.9rem;max-width:90vw;z-index:50;box-shadow:0 8px 24px rgba(7,26,47,.3)}
    .toast[data-type="error"]{background:var(--danger)}
  </style>
</head>

<body>

  <header class="topbar">
    <a href="index.html" class="brand" aria-label="MEI One home">
      <span class="brand-mark" aria-hidden="true">MEI</span>
      <span><strong>MEI One</strong><small>Admin</small></span>
    </a>
    <div class="who" id="who" hidden>
      <span id="whoName"></span>
      <button type="button" class="btn-ghost" id="signOut">Sign out</button>
    </div>
  </header>

  <main>

    <div class="panel auth" id="viewLoading"><p style="margin:0">Loading…</p></div>

    <section class="panel auth" id="viewSignIn" hidden>
      <h1>Admin sign in</h1>
      <p>Sign in with your MEI One admin account.</p>
      <form id="signInForm" novalidate>
        <label class="field">Email
          <input name="email" type="email" required autocomplete="email">
        </label>
        <label class="field">Password
          <input name="password" type="password" required autocomplete="current-password">
        </label>
        <div class="form-message" id="signInMessage" aria-live="polite"></div>
        <button type="submit" class="btn btn-block" id="signInBtn">Sign in</button>
      </form>
    </section>

    <section class="panel auth" id="viewDenied" hidden>
      <h1>No admin access</h1>
      <p id="deniedText">This account isn't an MEI One admin.</p>
      <button type="button" class="btn btn-outline btn-block" id="deniedSignOut">Sign out</button>
    </section>

    <section id="viewApp" hidden>

      <div class="tabs" role="tablist" aria-label="Admin sections">
        <button type="button" class="tab" role="tab" id="tab-rides" data-tab="rides" aria-selected="true">Rides<span class="count" id="count-rides">0</span></button>
        <button type="button" class="tab" role="tab" id="tab-drivers" data-tab="drivers" aria-selected="false">Drivers<span class="count" id="count-drivers">0</span></button>
        <button type="button" class="tab" role="tab" id="tab-apps" data-tab="apps" aria-selected="false">Partner applications<span class="count" id="count-apps">0</span></button>
      </div>

      <div class="toolbar">
        <div class="filters" id="filters" role="group" aria-label="Filter"></div>
        <div>
          <small id="updated" aria-live="polite"></small>
          <button type="button" class="btn btn-outline btn-small" id="refresh">Refresh</button>
        </div>
      </div>

      <!-- Add driver (Drivers tab only) -->
      <section class="panel add-driver" id="addDriver" hidden>
        <h2>Add a driver</h2>
        <p>The driver must already have a MEI One account. Use the email they signed up with.</p>
        <form id="addDriverForm" novalidate>
          <div class="grid-2">
            <label class="field">Account email
              <input name="email" type="email" required autocomplete="off">
            </label>
            <label class="field">Name
              <input name="name" type="text" required maxlength="100" autocomplete="off">
            </label>
            <label class="field">Vehicle <small>(e.g. White Toyota Axio)</small>
              <input name="vehicle" type="text" required maxlength="100" autocomplete="off">
            </label>
            <label class="field">Number plate
              <input name="plate" type="text" required maxlength="20" autocomplete="off">
            </label>
          </div>
          <div class="form-message" id="addDriverMessage" aria-live="polite"></div>
          <button type="submit" class="btn" id="addDriverBtn">Add driver</button>
        </form>
      </section>

      <div class="list" id="list" role="tabpanel" aria-live="polite"></div>

    </section>

  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
  <script src="js/supabase.js"></script>

  <script>
  (function (window, document) {
    "use strict";

    var supabase = window.supabaseClient || null;
    var CONFIG = window.MEI_CONFIG || window.MEIConfig || window.CONFIG || {};
    var TIMEZONE = (CONFIG.settings && CONFIG.settings.timezone) || "Africa/Nairobi";
    var POLL_MS = 30000;

    var CATEGORIES = (CONFIG.rides && CONFIG.rides.categories) || [
      ["standard", "Standard car"], ["comfort", "Comfort"],
      ["large", "Van / large group"], ["bike", "Motorbike"]
    ];
    var RIDE_STATUS = {
      requested: "Requested", accepted: "Accepted", arrived: "Driver arrived",
      completed: "Completed", cancelled: "Cancelled"
    };
    var APP_STATUS = { "new": "Received", reviewing: "In review", approved: "Approved", rejected: "Not approved" };
    var PARTNER_TYPES = {
      driver: "Ride and delivery driver", towing: "Towing operator", roadside: "Roadside responder",
      garage: "Garage or auto service", seller: "Marketplace seller", home: "Home service professional"
    };

    var FILTERS = {
      rides: [["open", "Open"], ["active", "Active"], ["done", "Done"]],
      drivers: [["all", "All"], ["on", "Active"], ["off", "Switched off"]],
      apps: [["new", "Received"], ["reviewing", "In review"], ["approved", "Approved"], ["rejected", "Not approved"], ["all", "All"]]
    };

    var state = {
      user: null, tab: "rides",
      filter: { rides: "open", drivers: "all", apps: "new" },
      rides: [], drivers: [], apps: []
    };
    var pollTimer = null, reloadTimer = null, channel = null, toastTimer = null;

    function $(s, p) { return (p || document).querySelector(s); }
    function $$(s, p) { return Array.prototype.slice.call((p || document).querySelectorAll(s)); }
    function el(tag, className, text) {
      var n = document.createElement(tag);
      if (className) n.className = className;
      if (text !== undefined) n.textContent = text;
      return n;
    }

    var dateFormat = new Intl.DateTimeFormat("en-KE", { dateStyle: "medium", timeStyle: "short", timeZone: TIMEZONE });
    var timeFormat = new Intl.DateTimeFormat("en-KE", { timeStyle: "short", timeZone: TIMEZONE });
    function formatDate(v) { return dateFormat.format(new Date(v)); }
    function categoryLabel(v) {
      for (var i = 0; i < CATEGORIES.length; i++) if (CATEGORIES[i][0] === v) return CATEGORIES[i][1];
      return v;
    }

    /* ---------- UI helpers ---------- */

    function showView(name) {
      ["Loading", "SignIn", "Denied", "App"].forEach(function (v) { $("#view" + v).hidden = v !== name; });
      $("#who").hidden = !(name === "App" || name === "Denied");
    }

    function toast(text, type) {
      var t = $("#toast");
      t.textContent = text;
      t.dataset.type = type || "info";
      t.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { t.hidden = true; }, 4000);
    }

    function formMessage(node, text, type) {
      node.textContent = text;
      node.dataset.type = type || "info";
    }

    function errorText(e, fallback) {
      return (e && e.message) ? e.message : fallback;
    }

    /* ---------- Auth ---------- */

    async function getUser() {
      if (!supabase) return null;
      try {
        var res = await supabase.auth.getSession();
        return (res.data && res.data.session && res.data.session.user) || null;
      } catch (e) {
        console.error("MEI Admin: unable to read session.", e);
        return null;
      }
    }

    async function signIn(event) {
      event.preventDefault();
      var form = event.currentTarget;
      var msg = $("#signInMessage");
      var email = form.email.value.trim();
      var password = form.password.value;
      if (!email || !password) { formMessage(msg, "Enter your email and password.", "error"); return; }

      var btn = $("#signInBtn");
      btn.disabled = true;
      btn.textContent = "Signing in…";
      formMessage(msg, "", "info");
      try {
        var res = await supabase.auth.signInWithPassword({ email: email, password: password });
        if (res.error) throw res.error;
        form.reset();
        await boot();
      } catch (e) {
        console.error("MEI Admin: sign-in failed.", e);
        formMessage(msg, "Email or password is incorrect.", "error");
      } finally {
        btn.disabled = false;
        btn.textContent = "Sign in";
      }
    }

    async function signOut() {
      stopLive();
      try { await supabase.auth.signOut(); } catch (e) { console.error(e); }
      state.user = null;
      showView("SignIn");
    }

    async function boot() {
      showView("Loading");

      if (!supabase) {
        showView("SignIn");
        formMessage($("#signInMessage"), "Admin is temporarily unavailable.", "error");
        return;
      }

      var user = await getUser();
      if (!user) { showView("SignIn"); return; }

      state.user = user;
      $("#whoName").textContent = user.email || "";

      try {
        var res = await supabase.rpc("is_mei_admin");
        if (res.error) throw res.error;
        if (res.data !== true) {
          $("#deniedText").textContent = "This account isn't an MEI One admin.";
          showView("Denied");
          return;
        }
      } catch (e) {
        console.error("MEI Admin: unable to check admin access.", e);
        $("#deniedText").textContent = "We couldn't check your admin access. Refresh and try again.";
        showView("Denied");
        return;
      }

      showView("App");
      renderFilters();
      await loadAll();
      startLive();
    }

    /* ---------- Data ---------- */

    async function loadAll() {
      if (!state.user) return;
      try {
        var results = await Promise.all([
          supabase.from("ride_requests").select("*").order("created_at", { ascending: false }).limit(200),
          supabase.from("drivers").select("id, name, vehicle_description, plate, active, created_at").order("name", { ascending: true }),
          supabase.from("partner_applications").select("*").order("created_at", { ascending: false }).limit(200)
        ]);
        if (results[0].error) throw results[0].error;
        if (results[1].error) throw results[1].error;
        if (results[2].error) throw results[2].error;

        state.rides = results[0].data || [];
        state.drivers = results[1].data || [];
        state.apps = results[2].data || [];
        $("#updated").textContent = "Updated " + timeFormat.format(new Date()) + " ";
        render();
      } catch (e) {
        console.error("MEI Admin: unable to load data.", e);
        $("#updated").textContent = "Couldn't refresh. ";
      }
    }

    function scheduleReload() {
      clearTimeout(reloadTimer);
      reloadTimer = setTimeout(loadAll, 400);
    }

    function startLive() {
      stopLive();
      try {
        channel = supabase.channel("admin-feed")
          .on("postgres_changes", { event: "*", schema: "public", table: "ride_requests" }, scheduleReload)
          .on("postgres_changes", { event: "*", schema: "public", table: "partner_applications" }, scheduleReload)
          .subscribe();
      } catch (e) {
        console.warn("MEI Admin: live updates unavailable.", e);
      }
      pollTimer = setInterval(function () { if (!document.hidden) loadAll(); }, POLL_MS);
    }

    function stopLive() {
      clearInterval(pollTimer);
      clearTimeout(reloadTimer);
      if (channel) { try { supabase.removeChannel(channel); } catch (e) { /* ignore */ } channel = null; }
    }

    async function rpc(name, args, doneText, button) {
      if (button) button.disabled = true;
      try {
        var res = await supabase.rpc(name, args);
        if (res.error) throw res.error;
        if (doneText) toast(doneText);
        return true;
      } catch (e) {
        console.error("MEI Admin: " + name + " failed.", e);
        toast(errorText(e, "That didn't work. Try again."), "error");
        return false;
      } finally {
        if (button) button.disabled = false;
        loadAll();
      }
    }

    /* ---------- Lists by tab ---------- */

    function driverById(id) {
      for (var i = 0; i < state.drivers.length; i++) if (state.drivers[i].id === id) return state.drivers[i];
      return null;
    }

    function driverLabel(d) {
      return d.name + " · " + d.vehicle_description + " (" + d.plate + ")";
    }

    function ridesByFilter(f) {
      return state.rides.filter(function (r) {
        if (f === "open") return r.status === "requested";
        if (f === "active") return r.status === "accepted" || r.status === "arrived";
        return r.status === "completed" || r.status === "cancelled";
      });
    }

    function driversByFilter(f) {
      return state.drivers.filter(function (d) {
        return f === "all" ? true : f === "on" ? d.active : !d.active;
      });
    }

    function appsByFilter(f) {
      return state.apps.filter(function (a) { return f === "all" ? true : a.status === f; });
    }

    /* ---------- Cards ---------- */

    function rideCard(row) {
      var card = el("article", "item");

      var top = el("div", "item-top");
      var title = el("div", "title");
      title.appendChild(document.createTextNode(row.pickup));
      title.appendChild(el("span", "", "to"));
      title.appendChild(document.createTextNode(row.destination));
      top.appendChild(title);
      var chip = el("span", "chip", RIDE_STATUS[row.status] || row.status);
      chip.dataset.status = row.status;
      top.appendChild(chip);
      card.appendChild(top);

      var people = row.passengers + " passenger" + (row.passengers === 1 ? "" : "s");
      card.appendChild(el("div", "meta", categoryLabel(row.vehicle_category) + ", " + people));
      card.appendChild(el("div", "meta", row.pickup_time ? "Pickup " + formatDate(row.pickup_time) : "Pickup as soon as possible"));
      card.appendChild(el("div", "meta", "Requested " + formatDate(row.created_at)));
      if (row.notes) card.appendChild(el("div", "notes", row.notes));

      var links = el("div", "links");
      if (row.phone) {
        var call = el("a", "", "Call " + row.phone);
        call.href = "tel:" + String(row.phone).replace(/[^+\d]/g, "");
        links.appendChild(call);
      }
      if (typeof row.pickup_lat === "number" && typeof row.pickup_lng === "number") {
        var map = el("a", "", "View pickup on map");
        map.href = "https://www.google.com/maps?q=" + row.pickup_lat + "," + row.pickup_lng;
        map.target = "_blank";
        map.rel = "noopener noreferrer";
        links.appendChild(map);
      }
      if (links.children.length) card.appendChild(links);

      if (row.driver_id) {
        var d = driverById(row.driver_id);
        card.appendChild(el("div", "driver-line", "Driver: " + (d ? driverLabel(d) : "unknown driver")));
      }

      var actions = el("div", "actions");

      if (row.status === "requested") {
        var sel = el("select");
        sel.setAttribute("aria-label", "Choose a driver");
        var first = el("option", "", "Choose a driver");
        first.value = "";
        sel.appendChild(first);
        state.drivers.filter(function (d) { return d.active; }).forEach(function (d) {
          var o = el("option", "", driverLabel(d));
          o.value = d.id;
          sel.appendChild(o);
        });
        var assign = el("button", "btn btn-small", "Assign driver");
        assign.type = "button";
        assign.addEventListener("click", function () {
          if (!sel.value) { toast("Choose a driver first.", "error"); return; }
          rpc("admin_assign_ride", { p_ride: row.id, p_driver: sel.value }, "Driver assigned.", assign);
        });
        actions.appendChild(sel);
        actions.appendChild(assign);
      }

      if (row.status === "accepted") {
        var un = el("button", "btn btn-outline btn-small", "Unassign");
        un.type = "button";
        un.addEventListener("click", function () {
          if (!window.confirm("Take this ride off the driver and reopen it?")) return;
          rpc("admin_unassign_ride", { p_ride: row.id }, "Ride reopened.", un);
        });
        actions.appendChild(un);
      }

      if (row.status === "requested" || row.status === "accepted" || row.status === "arrived") {
        var cancel = el("button", "btn btn-danger btn-small", "Cancel ride");
        cancel.type = "button";
        cancel.addEventListener("click", function () {
          if (!window.confirm("Cancel this ride?")) return;
          rpc("admin_cancel_ride", { p_ride: row.id }, "Ride cancelled.", cancel);
        });
        actions.appendChild(cancel);
      }

      if (actions.children.length) card.appendChild(actions);
      return card;
    }

    function driverCard(d) {
      var card = el("article", "item");
      var top = el("div", "item-top");
      top.appendChild(el("div", "title", d.name));
      var chip = el("span", "chip", d.active ? "Active" : "Switched off");
      chip.dataset.status = d.active ? "on" : "off";
      top.appendChild(chip);
      card.appendChild(top);
      card.appendChild(el("div", "meta", d.vehicle_description + " · " + d.plate));

      var actions = el("div", "actions");
      var toggle = el("button", d.active ? "btn btn-danger btn-small" : "btn btn-small", d.active ? "Switch off" : "Switch on");
      toggle.type = "button";
      toggle.addEventListener("click", function () {
        if (d.active && !window.confirm("Switch off " + d.name + "? They will stop seeing rides.")) return;
        rpc("admin_set_driver_active", { p_driver: d.id, p_active: !d.active },
            d.active ? "Driver switched off." : "Driver switched on.", toggle);
      });
      actions.appendChild(toggle);
      card.appendChild(actions);
      return card;
    }

    function appCard(a) {
      var card = el("article", "item");

      var top = el("div", "item-top");
      var title = el("div", "title", a.full_name + (a.business_name ? " (" + a.business_name + ")" : ""));
      top.appendChild(title);
      var chip = el("span", "chip", APP_STATUS[a.status] || a.status);
      chip.dataset.status = a.status;
      top.appendChild(chip);
      card.appendChild(top);

      card.appendChild(el("div", "meta", (PARTNER_TYPES[a.partner_type] || a.partner_type) + " · " + a.location +
        (a.experience_years !== null && a.experience_years !== undefined ? " · " + a.experience_years + " yr experience" : "")));
      card.appendChild(el("div", "meta", "Applied " + formatDate(a.created_at) + (a.user_id ? " · signed in" : " · no account")));
      card.appendChild(el("div", "notes", a.details));

      var links = el("div", "links");
      var call = el("a", "", "Call " + a.phone);
      call.href = "tel:" + String(a.phone).replace(/[^+\d]/g, "");
      links.appendChild(call);
      var mail = el("a", "", a.email);
      mail.href = "mailto:" + a.email;
      links.appendChild(mail);
      card.appendChild(links);

      // Review controls
      var review = el("div", "actions");
      var status = el("select");
      status.setAttribute("aria-label", "Application status");
      Object.keys(APP_STATUS).forEach(function (key) {
        var o = el("option", "", APP_STATUS[key]);
        o.value = key;
        if (key === a.status) o.selected = true;
        status.appendChild(o);
      });
      review.appendChild(status);
      card.appendChild(review);

      var noteField = el("div", "field");
      noteField.style.marginTop = "10px";
      noteField.style.marginBottom = "0";
      var noteLabel = el("label", "", "Internal notes");
      var note = el("textarea");
      note.maxLength = 1000;
      note.value = a.admin_notes || "";
      note.id = "note-" + a.id;
      noteLabel.setAttribute("for", note.id);
      noteField.appendChild(noteLabel);
      noteField.appendChild(note);
      card.appendChild(noteField);

      var actions = el("div", "actions");
      var save = el("button", "btn btn-small", "Save");
      save.type = "button";
      save.addEventListener("click", async function () {
        save.disabled = true;
        try {
          var res = await supabase.from("partner_applications")
            .update({ status: status.value, admin_notes: note.value.trim() || null })
            .eq("id", a.id)
            .select("id");
          if (res.error) throw res.error;
          toast(res.data && res.data.length ? "Application updated." : "Couldn't update this application.",
                res.data && res.data.length ? "info" : "error");
        } catch (e) {
          console.error("MEI Admin: application update failed.", e);
          toast(errorText(e, "Couldn't update the application."), "error");
        } finally {
          save.disabled = false;
          loadAll();
        }
      });
      actions.appendChild(save);

      if (a.partner_type === "driver") {
        var make = el("button", "btn btn-outline btn-small", "Make driver");
        make.type = "button";
        make.addEventListener("click", function () {
          setTab("drivers");
          var f = $("#addDriverForm");
          f.email.value = a.email;
          f.name.value = a.full_name;
          f.vehicle.focus();
          $("#addDriver").scrollIntoView({ behavior: "smooth", block: "start" });
          formMessage($("#addDriverMessage"), "Add the vehicle and plate from their application, then add the driver.", "info");
        });
        actions.appendChild(make);
      }
      card.appendChild(actions);
      return card;
    }

    /* ---------- Render ---------- */

    function renderFilters() {
      var box = $("#filters");
      box.replaceChildren();
      FILTERS[state.tab].forEach(function (f) {
        var b = el("button", "filter", f[1]);
        b.type = "button";
        b.setAttribute("aria-pressed", state.filter[state.tab] === f[0] ? "true" : "false");
        b.addEventListener("click", function () {
          state.filter[state.tab] = f[0];
          renderFilters();
          render();
        });
        box.appendChild(b);
      });
    }

    function render() {
      $("#count-rides").textContent = ridesByFilter("open").length;
      $("#count-drivers").textContent = state.drivers.filter(function (d) { return d.active; }).length;
      $("#count-apps").textContent = state.apps.filter(function (a) { return a.status === "new"; }).length;

      $("#addDriver").hidden = state.tab !== "drivers";

      var rows, build, empty;
      if (state.tab === "rides") {
        rows = ridesByFilter(state.filter.rides); build = rideCard;
        empty = ["No rides here", "Rides in this group show up as riders request them."];
      } else if (state.tab === "drivers") {
        rows = driversByFilter(state.filter.drivers); build = driverCard;
        empty = ["No drivers here", "Add a driver with the form above."];
      } else {
        rows = appsByFilter(state.filter.apps); build = appCard;
        empty = ["No applications here", "Partner applications show up here as people apply."];
      }

      var list = $("#list");
      list.replaceChildren();
      list.setAttribute("aria-labelledby", "tab-" + state.tab);

      if (!rows.length) {
        var e = el("div", "empty");
        e.appendChild(el("h3", "", empty[0]));
        e.appendChild(el("p", "", empty[1]));
        list.appendChild(e);
        return;
      }
      rows.forEach(function (row) { list.appendChild(build(row)); });
    }

    function setTab(name) {
      state.tab = name;
      $$(".tab").forEach(function (t) { t.setAttribute("aria-selected", t.dataset.tab === name ? "true" : "false"); });
      renderFilters();
      render();
    }

    /* ---------- Add driver ---------- */

    async function addDriver(event) {
      event.preventDefault();
      var form = event.currentTarget;
      var msg = $("#addDriverMessage");
      var email = form.email.value.trim();
      var name = form.name.value.trim();
      var vehicle = form.vehicle.value.trim();
      var plate = form.plate.value.trim().toUpperCase();

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { formMessage(msg, "Enter the driver's account email.", "error"); return; }
      if (!name || !vehicle || !plate) { formMessage(msg, "Name, vehicle and plate are all required.", "error"); return; }

      var btn = $("#addDriverBtn");
      btn.disabled = true;
      formMessage(msg, "", "info");
      try {
        var res = await supabase.rpc("admin_add_driver", { p_email: email, p_name: name, p_vehicle: vehicle, p_plate: plate });
        if (res.error) throw res.error;
        form.reset();
        formMessage(msg, name + " is now a driver.", "success");
        toast("Driver added.");
        loadAll();
      } catch (e) {
        console.error("MEI Admin: add driver failed.", e);
        formMessage(msg, errorText(e, "Couldn't add the driver."), "error");
      } finally {
        btn.disabled = false;
      }
    }

    /* ---------- Init ---------- */

    $("#signInForm").addEventListener("submit", signIn);
    $("#signOut").addEventListener("click", signOut);
    $("#deniedSignOut").addEventListener("click", signOut);
    $("#refresh").addEventListener("click", function () { loadAll(); });
    $("#addDriverForm").addEventListener("submit", addDriver);
    $$(".tab").forEach(function (t) { t.addEventListener("click", function () { setTab(t.dataset.tab); }); });
    document.addEventListener("visibilitychange", function () { if (!document.hidden && state.user) loadAll(); });

    if (supabase) {
      supabase.auth.onAuthStateChange(function (event) {
        if (event === "SIGNED_OUT" && state.user) {
          stopLive();
          state.user = null;
          showView("SignIn");
        }
      });
    }

    boot();
  })(window, document);
  </script>

</body>
</html>
