<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071a2f">
  <meta name="robots" content="noindex">
  <title>Driver | MEI One</title>
  <link rel="icon" href="assets/favicon.png" type="image/png">

  <style>
    :root{
      --navy:#071a2f;
      --green:#00b85c;
      --green-dark:#067a43;
      --muted:#5b6b7b;
      --border:#d8e1e8;
      --bg:#f3f6f9;
      --danger:#b91c1c;
      --radius:14px;
    }
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{
      margin:0;background:var(--bg);color:var(--navy);
      font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      line-height:1.5;min-height:100vh;
    }
    [hidden]{display:none !important}
    button,input{font:inherit}
    a{color:var(--green-dark)}
    :focus-visible{outline:3px solid var(--green);outline-offset:2px}

    .topbar{
      background:var(--navy);color:#fff;
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:12px 18px;position:sticky;top:0;z-index:10;
    }
    .brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}
    .brand-mark{
      background:var(--green);color:#04210f;font-weight:800;font-size:.8rem;
      padding:6px 9px;border-radius:8px;letter-spacing:.04em;
    }
    .brand strong{display:block;line-height:1.1}
    .brand small{display:block;opacity:.7;font-size:.75rem}
    .who{display:flex;align-items:center;gap:12px;font-size:.85rem;text-align:right}
    .who-text{line-height:1.2;max-width:170px}
    .who-text strong,.who-text small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .who-text small{opacity:.7}
    .btn-ghost{
      background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35);
      border-radius:999px;padding:6px 14px;font-weight:600;font-size:.85rem;cursor:pointer;
    }
    .btn-ghost:hover{border-color:#fff}

    main{max-width:720px;margin:0 auto;padding:20px 16px 60px}

    .panel{
      background:#fff;border:1px solid var(--border);border-radius:var(--radius);
      padding:22px;
    }
    .panel h1,.panel h2{margin:0 0 6px}
    .panel p{margin:0 0 16px;color:var(--muted)}
    .auth{max-width:420px;margin:40px auto 0}
    .field{display:grid;gap:6px;margin-bottom:14px;font-weight:700;font-size:.9rem}
    .field input{
      width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;
      background:#fff;color:var(--navy);font-weight:400;
    }
    .btn{
      display:inline-flex;align-items:center;justify-content:center;
      border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;
      background:var(--green);color:#04210f;
    }
    .btn:hover:not(:disabled){filter:brightness(.95)}
    .btn:disabled{opacity:.55;cursor:default}
    .btn-block{width:100%}
    .btn-outline{background:#fff;color:var(--navy);border:1px solid var(--border)}
    .btn-outline:hover:not(:disabled){border-color:var(--navy);filter:none}
    .btn-small{padding:6px 14px;font-size:.85rem}
    .form-message{min-height:1.4em;margin:0 0 12px;font-size:.9rem}
    .form-message[data-type="error"]{color:var(--danger)}

    /* Location sharing */
    .share{
      display:flex;align-items:center;justify-content:space-between;gap:14px;
      background:#fff;border:1px solid var(--border);border-radius:var(--radius);
      padding:14px 16px;margin-bottom:16px;
    }
    .share.is-on{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
    .share strong{display:block}
    .share small{display:block;color:var(--muted);font-size:.85rem}
    .share .btn{flex:0 0 auto}
    @media(max-width:480px){.share{flex-direction:column;align-items:stretch}}

    /* Tabs */
    .tabs{display:flex;gap:6px;margin-bottom:12px}
    .tab{
      flex:1;background:#fff;border:1px solid var(--border);color:var(--navy);
      padding:10px 14px;border-radius:999px;font-weight:700;font-size:.9rem;cursor:pointer;
    }
    .tab[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
    .tab .count{
      display:inline-block;min-width:1.5em;margin-left:6px;padding:0 6px;border-radius:999px;
      background:rgba(128,150,170,.2);font-size:.78rem;
    }
    .tab[aria-selected="true"] .count{background:var(--green);color:#04210f}

    .toolbar{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}
    .toolbar small{color:var(--muted)}

    /* Jobs */
    .jobs{display:grid;gap:12px}
    .job{
      background:#fff;border:1px solid var(--border);border-radius:var(--radius);
      padding:16px;
    }
    .job.is-active{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
    .job-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    .route{font-weight:800;overflow-wrap:anywhere}
    .route span{color:var(--muted);font-weight:400;margin:0 4px}
    .chip{
      font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;
      padding:3px 10px;border-radius:999px;white-space:nowrap;
    }
    .chip[data-status="accepted"]{background:#eafff4;color:var(--green-dark)}
    .chip[data-status="arrived"]{background:#fff6e0;color:#92600a}
    .chip[data-status="completed"]{background:#e8f1ff;color:#1d4ed8}
    .chip[data-status="cancelled"]{background:#fff0f0;color:var(--danger)}
    .meta{font-size:.88rem;color:var(--muted);margin-top:6px}
    .notes{
      margin-top:10px;padding:10px 12px;background:var(--bg);border-radius:10px;
      font-size:.9rem;overflow-wrap:anywhere;
    }
    .links{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-weight:700;font-size:.9rem}
    .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
    .actions .btn{flex:1 1 140px}
    .empty{text-align:center;padding:36px 16px;color:var(--muted)}
    .empty h3{margin:0 0 4px;color:var(--navy)}

    .toast{
      position:fixed;left:50%;bottom:20px;transform:translateX(-50%);
      background:var(--navy);color:#fff;padding:12px 18px;border-radius:999px;
      font-size:.9rem;max-width:90vw;z-index:50;box-shadow:0 8px 24px rgba(7,26,47,.3);
    }
    .toast[data-type="error"]{background:var(--danger)}
  </style>
</head>

<body>

  <header class="topbar">
    <a href="index.html" class="brand" aria-label="MEI One home">
      <span class="brand-mark" aria-hidden="true">MEI</span>
      <span><strong>MEI One</strong><small>Driver</small></span>
    </a>
    <div class="who" id="who" hidden>
      <div class="who-text">
        <strong id="whoName"></strong>
        <small id="whoVehicle"></small>
      </div>
      <button type="button" class="btn-ghost" id="signOut">Sign out</button>
    </div>
  </header>

  <main>

    <div class="panel auth" id="viewLoading">
      <p style="margin:0">Loading…</p>
    </div>

    <section class="panel auth" id="viewSignIn" hidden>
      <h1>Driver sign in</h1>
      <p>Sign in to see the rides assigned to you.</p>
      <form id="signInForm" novalidate>
        <label class="field">Email
          <input name="email" type="email" required autocomplete="email" placeholder="you@example.com">
        </label>
        <label class="field">Password
          <input name="password" type="password" required autocomplete="current-password">
        </label>
        <div class="form-message" id="signInMessage" aria-live="polite"></div>
        <button type="submit" class="btn btn-block" id="signInBtn">Sign in</button>
      </form>
    </section>

    <section class="panel auth" id="viewDenied" hidden>
      <h1>No driver access</h1>
      <p id="deniedText">This account isn't registered as a driver. Contact the MEI team to be added.</p>
      <button type="button" class="btn btn-outline btn-block" id="deniedSignOut">Sign out</button>
    </section>

    <section id="viewApp" hidden>

      <div class="share" id="share">
        <div>
          <strong id="shareTitle">Location sharing is off</strong>
          <small id="shareHint">Riders see your vehicle only while a ride is assigned to you.</small>
        </div>
        <button type="button" class="btn" id="shareBtn">Share my location</button>
      </div>

      <div class="tabs" role="tablist" aria-label="Rides">
        <button type="button" class="tab" role="tab" id="tab-active" data-tab="active" aria-selected="true">
          Active<span class="count" id="count-active">0</span>
        </button>
        <button type="button" class="tab" role="tab" id="tab-history" data-tab="history" aria-selected="false">
          History<span class="count" id="count-history">0</span>
        </button>
      </div>

      <div class="toolbar">
        <small id="updated" aria-live="polite"></small>
        <button type="button" class="btn btn-outline btn-small" id="refresh">Refresh</button>
      </div>

      <div class="jobs" id="jobs" role="tabpanel" aria-live="polite"></div>

    </section>

  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
  <script src="js/supabase.js"></script>

  <script>
  (function (window, document) {
    "use strict";

    var supabase = window.supabaseClient || null;
    var CONFIG = window.MEI_CONFIG || window.MEIConfig || window.CONFIG || {};

    var RIDES = "ride_requests";
    var DRIVERS = "drivers";
    var LOCATIONS = "driver_locations";
    var TIMEZONE = (CONFIG.settings && CONFIG.settings.timezone) || "Africa/Nairobi";

    var POLL_MS = 30000;        // refresh rides
    var SEND_MIN_MS = 5000;     // minimum gap between location writes
    var HEARTBEAT_MS = 15000;   // re-send last fix so riders see it is live

    var CATEGORIES = (CONFIG.rides && CONFIG.rides.categories) || [
      ["standard", "Standard car"],
      ["comfort", "Comfort"],
      ["large", "Van / large group"],
      ["bike", "Motorbike"]
    ];
    var STATUS_LABELS = {
      accepted: "Accepted",
      arrived: "Arrived",
      completed: "Completed",
      cancelled: "Cancelled"
    };
    var EMPTY = {
      active: ["No active rides", "Rides the MEI team assigns to you appear here."],
      history: ["No history yet", "Completed and cancelled rides show up here."]
    };

    var state = {
      user: null, driver: null, tab: "active", rides: [], knownIds: null,
      sharing: false, lastFix: null, lastSent: 0, sendFailed: false
    };
    var pollTimer = null, reloadTimer = null, channel = null, toastTimer = null;
    var watchId = null, heartbeatTimer = null, wakeLock = null;

    function $(s, p) { return (p || document).querySelector(s); }
    function $$(s, p) { return Array.prototype.slice.call((p || document).querySelectorAll(s)); }
    function el(tag, className, text) {
      var n = document.createElement(tag);
      if (className) n.className = className;
      if (text !== undefined) n.textContent = text;
      return n;
    }

    var dateFormat = new Intl.DateTimeFormat("en-KE", { dateStyle: "medium", timeStyle: "short", timeZone: TIMEZONE });
    var timeFormat = new Intl.DateTimeFormat("en-KE", { timeStyle: "short", timeZone: TIMEZONE });
    function formatDate(v) { return dateFormat.format(new Date(v)); }

    function categoryLabel(value) {
      for (var i = 0; i < CATEGORIES.length; i++) if (CATEGORIES[i][0] === value) return CATEGORIES[i][1];
      return value;
    }

    /* ---------- Views ---------- */

    function showView(name) {
      ["Loading", "SignIn", "Denied", "App"].forEach(function (v) {
        $("#view" + v).hidden = v !== name;
      });
      $("#who").hidden = !(name === "App" || name === "Denied");
    }

    function toast(text, type) {
      var t = $("#toast");
      t.textContent = text;
      t.dataset.type = type || "info";
      t.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { t.hidden = true; }, 3500);
    }

    function setSignInMessage(text, type) {
      var m = $("#signInMessage");
      m.textContent = text;
      m.dataset.type = type || "info";
    }

    /* ---------- Auth ---------- */

    async function getUser() {
      if (!supabase) return null;
      try {
        var res = await supabase.auth.getSession();
        return (res.data && res.data.session && res.data.session.user) || null;
      } catch (e) {
        console.error("MEI Driver: unable to read session.", e);
        return null;
      }
    }

    async function signIn(event) {
      event.preventDefault();
      var form = event.currentTarget;
      var email = form.email.value.trim();
      var password = form.password.value;
      if (!email || !password) {
        setSignInMessage("Enter your email and password.", "error");
        return;
      }
      var btn = $("#signInBtn");
      btn.disabled = true;
      btn.textContent = "Signing in…";
      setSignInMessage("", "info");
      try {
        var res = await supabase.auth.signInWithPassword({ email: email, password: password });
        if (res.error) throw res.error;
        form.reset();
        await boot();
      } catch (e) {
        console.error("MEI Driver: sign-in failed.", e);
        setSignInMessage("Email or password is incorrect.", "error");
      } finally {
        btn.disabled = false;
        btn.textContent = "Sign in";
      }
    }

    async function signOut() {
      await stopSharing(true);
      stopLive();
      try { await supabase.auth.signOut(); } catch (e) { console.error(e); }
      resetState();
      showView("SignIn");
    }

    function resetState() {
      state.user = null;
      state.driver = null;
      state.rides = [];
      state.knownIds = null;
    }

    async function loadDriver(user) {
      var res = await supabase
        .from(DRIVERS)
        .select("id, name, vehicle_description, plate, active")
        .eq("id", user.id)
        .maybeSingle();
      if (res.error) throw res.error;
      return res.data;
    }

    async function boot() {
      showView("Loading");

      if (!supabase) {
        showView("SignIn");
        setSignInMessage("Driver page is temporarily unavailable.", "error");
        return;
      }

      var user = await getUser();
      if (!user) { showView("SignIn"); return; }

      state.user = user;
      $("#whoName").textContent = user.email || "";
      $("#whoVehicle").textContent = "";

      try {
        var driver = await loadDriver(user);
        if (!driver || driver.active === false) {
          $("#deniedText").textContent = driver
            ? "Your driver account is switched off. Contact the MEI team."
            : "This account isn't registered as a driver. Contact the MEI team to be added.";
          showView("Denied");
          return;
        }
        state.driver = driver;
        $("#whoName").textContent = driver.name || user.email || "";
        $("#whoVehicle").textContent = [driver.vehicle_description, driver.plate].filter(Boolean).join(" · ");
      } catch (e) {
        console.error("MEI Driver: unable to check driver access.", e);
        $("#deniedText").textContent = "We couldn't check your driver access. Refresh and try again.";
        showView("Denied");
        return;
      }

      showView("App");
      updateShareUI();
      await loadRides();
      startLive();
    }

    /* ---------- Rides ---------- */

    async function loadRides() {
      if (!state.user) return;
      try {
        var res = await supabase.from(RIDES).select("*")
          .eq("driver_id", state.user.id)
          .order("created_at", { ascending: false })
          .limit(100);
        if (res.error) throw res.error;

        var rows = res.data || [];

        // Tell the driver when a new ride is assigned (not on the first load).
        var activeIds = rows
          .filter(function (r) { return r.status === "accepted" || r.status === "arrived"; })
          .map(function (r) { return r.id; });
        if (state.knownIds) {
          var fresh = activeIds.filter(function (id) { return state.knownIds.indexOf(id) === -1; });
          if (fresh.length) {
            toast("New ride assigned to you.");
            if (navigator.vibrate) { try { navigator.vibrate([200, 100, 200]); } catch (e) { /* ignore */ } }
          }
        }
        state.knownIds = activeIds;

        state.rides = rows;
        $("#updated").textContent = "Updated " + timeFormat.format(new Date());
        render();
        updateShareUI();
      } catch (e) {
        console.error("MEI Driver: unable to load rides.", e);
        $("#updated").textContent = "Couldn't refresh. Check your connection.";
      }
    }

    function scheduleReload() {
      clearTimeout(reloadTimer);
      reloadTimer = setTimeout(loadRides, 400);
    }

    function startLive() {
      stopLive();
      try {
        channel = supabase
          .channel("driver-rides-" + state.user.id)
          .on("postgres_changes",
            { event: "*", schema: "public", table: RIDES, filter: "driver_id=eq." + state.user.id },
            scheduleReload)
          .subscribe();
      } catch (e) {
        console.warn("MEI Driver: live updates unavailable.", e);
      }
      // Polling also catches rides taken away from this driver.
      pollTimer = setInterval(function () {
        if (!document.hidden) loadRides();
      }, POLL_MS);
    }

    function stopLive() {
      clearInterval(pollTimer);
      clearTimeout(reloadTimer);
      if (channel) {
        try { supabase.removeChannel(channel); } catch (e) { /* ignore */ }
        channel = null;
      }
    }

    // accepted -> arrived -> completed (the database enforces this too)
    async function advance(row, nextStatus, btn, doneText) {
      btn.disabled = true;
      try {
        var res = await supabase.from(RIDES)
          .update({ status: nextStatus })
          .eq("id", row.id)
          .eq("driver_id", state.user.id)
          .eq("status", row.status)
          .select("id");
        if (res.error) throw res.error;

        if (res.data && res.data.length) toast(doneText);
        else toast("This ride has changed. Refreshing.", "error");
      } catch (e) {
        console.error("MEI Driver: status change failed.", e);
        toast("Couldn't update the ride. Try again.", "error");
      }
      loadRides();
    }

    function arrived(row, btn) {
      advance(row, "arrived", btn, "Marked as arrived.");
    }

    function complete(row, btn) {
      if (!window.confirm("Mark this ride as completed?")) return;
      advance(row, "completed", btn, "Ride completed.");
    }

    /* ---------- Render ---------- */

    function isActive(r) { return r.status === "accepted" || r.status === "arrived"; }

    function rideCard(row) {
      var card = el("article", "job" + (isActive(row) ? " is-active" : ""));

      var top = el("div", "job-top");
      var route = el("div", "route");
      route.appendChild(document.createTextNode(row.pickup));
      route.appendChild(el("span", "", "to"));
      route.appendChild(document.createTextNode(row.destination));
      top.appendChild(route);
      var chip = el("span", "chip", STATUS_LABELS[row.status] || row.status);
      chip.dataset.status = row.status;
      top.appendChild(chip);
      card.appendChild(top);

      var people = row.passengers + " passenger" + (row.passengers === 1 ? "" : "s");
      var when = row.pickup_time ? "Pickup " + formatDate(row.pickup_time) : "Pickup as soon as possible";
      card.appendChild(el("div", "meta", categoryLabel(row.vehicle_category) + ", " + people));
      card.appendChild(el("div", "meta", when));
      card.appendChild(el("div", "meta", "Requested " + formatDate(row.created_at)));

      if (row.notes) card.appendChild(el("div", "notes", row.notes));

      var links = el("div", "links");
      var hasPin = typeof row.pickup_lat === "number" && typeof row.pickup_lng === "number";
      if (hasPin) {
        var pin = el("a", "", "Navigate to pickup");
        pin.href = "https://www.google.com/maps/dir/?api=1&destination=" + row.pickup_lat + "," + row.pickup_lng;
        pin.target = "_blank";
        pin.rel = "noopener noreferrer";
        links.appendChild(pin);
      }
      if (isActive(row)) {
        var dest = el("a", "", "Navigate to destination");
        dest.href = "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(row.destination);
        dest.target = "_blank";
        dest.rel = "noopener noreferrer";
        links.appendChild(dest);
      }
      if (isActive(row) && row.phone) {
        var call = el("a", "", "Call " + row.phone);
        call.href = "tel:" + String(row.phone).replace(/[^+\d]/g, "");
        links.appendChild(call);
      }
      if (links.children.length) card.appendChild(links);

      var actions = el("div", "actions");
      if (row.status === "accepted") {
        var a = el("button", "btn", "I've arrived");
        a.type = "button";
        a.addEventListener("click", function () { arrived(row, a); });
        actions.appendChild(a);
      } else if (row.status === "arrived") {
        var c = el("button", "btn", "Complete ride");
        c.type = "button";
        c.addEventListener("click", function () { complete(row, c); });
        actions.appendChild(c);
      }
      if (actions.children.length) card.appendChild(actions);

      return card;
    }

    function render() {
      var lists = {
        active: state.rides.filter(isActive).reverse(),   // oldest first
        history: state.rides.filter(function (r) { return !isActive(r); })
      };

      $("#count-active").textContent = lists.active.length;
      $("#count-history").textContent = lists.history.length;

      var wrap = $("#jobs");
      wrap.replaceChildren();
      wrap.setAttribute("aria-labelledby", "tab-" + state.tab);

      var rows = lists[state.tab];
      if (!rows.length) {
        var empty = el("div", "empty");
        empty.appendChild(el("h3", "", EMPTY[state.tab][0]));
        empty.appendChild(el("p", "", EMPTY[state.tab][1]));
        wrap.appendChild(empty);
        return;
      }
      rows.forEach(function (row) { wrap.appendChild(rideCard(row)); });
    }

    function setTab(name) {
      state.tab = name;
      $$(".tab").forEach(function (t) {
        t.setAttribute("aria-selected", t.dataset.tab === name ? "true" : "false");
      });
      render();
    }

    /* ---------- Live location sharing ---------- */

    function hasActiveRide() { return state.rides.some(isActive); }

    function updateShareUI() {
      var box = $("#share");
      var title = $("#shareTitle");
      var hint = $("#shareHint");
      var btn = $("#shareBtn");

      box.classList.toggle("is-on", state.sharing);

      if (state.sharing) {
        title.textContent = "Sharing your location";
        hint.textContent = state.sendFailed
          ? "We couldn't send your location. Check your connection."
          : (state.lastFix ? "Keep this page open so riders can follow you."
                           : "Waiting for a GPS signal…");
        btn.textContent = "Stop sharing";
        btn.className = "btn btn-outline";
      } else {
        title.textContent = "Location sharing is off";
        hint.textContent = hasActiveRide()
          ? "Share your location so your rider can follow you."
          : "Riders see your vehicle only while a ride is assigned to you.";
        btn.textContent = "Share my location";
        btn.className = "btn";
      }
    }

    async function pushLocation() {
      var fix = state.lastFix;
      if (!fix || !state.user) return;
      state.lastSent = Date.now();
      try {
        var res = await supabase.from(LOCATIONS).upsert({
          driver_id: state.user.id,
          lat: fix.lat,
          lng: fix.lng,
          accuracy_m: fix.accuracy,
          heading: fix.heading,
          speed_kmh: fix.speed,
          updated_at: new Date().toISOString()
        }, { onConflict: "driver_id" });
        if (res.error) throw res.error;
        if (state.sendFailed) { state.sendFailed = false; updateShareUI(); }
      } catch (e) {
        console.error("MEI Driver: location update failed.", e);
        if (!state.sendFailed) { state.sendFailed = true; updateShareUI(); }
      }
    }

    function onFix(position) {
      var c = position.coords;
      var firstFix = !state.lastFix;
      state.lastFix = {
        lat: Number(c.latitude.toFixed(6)),
        lng: Number(c.longitude.toFixed(6)),
        accuracy: c.accuracy == null ? null : Math.round(c.accuracy),
        heading: typeof c.heading === "number" && !isNaN(c.heading) ? c.heading : null,
        speed: typeof c.speed === "number" && !isNaN(c.speed) ? Number((c.speed * 3.6).toFixed(1)) : null
      };
      if (firstFix) updateShareUI();
      if (Date.now() - state.lastSent >= SEND_MIN_MS) pushLocation();
    }

    function onGeoError(error) {
      if (error.code === 1) {
        stopSharing(true);
        toast("Location permission is blocked. Allow it in your browser settings.", "error");
      } else {
        $("#shareHint").textContent = "Waiting for a GPS signal…";
      }
    }

    async function requestWakeLock() {
      try {
        if ("wakeLock" in navigator && !wakeLock) {
          wakeLock = await navigator.wakeLock.request("screen");
          wakeLock.addEventListener("release", function () { wakeLock = null; });
        }
      } catch (e) { /* not available or denied */ }
    }

    function startSharing() {
      if (!("geolocation" in navigator)) {
        toast("This browser doesn't support location.", "error");
        return;
      }
      if (window.isSecureContext === false) {
        toast("Location needs a secure (HTTPS) connection.", "error");
        return;
      }
      state.sharing = true;
      state.lastFix = null;
      state.sendFailed = false;
      updateShareUI();

      watchId = navigator.geolocation.watchPosition(onFix, onGeoError, {
        enableHighAccuracy: true, maximumAge: 5000, timeout: 20000
      });
      heartbeatTimer = setInterval(function () {
        if (state.lastFix) pushLocation();
      }, HEARTBEAT_MS);
      requestWakeLock();
    }

    async function stopSharing(removeRow) {
      var wasSharing = state.sharing;
      state.sharing = false;

      if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
      clearInterval(heartbeatTimer);
      heartbeatTimer = null;
      if (wakeLock) { try { await wakeLock.release(); } catch (e) { /* ignore */ } wakeLock = null; }

      state.lastFix = null;
      state.sendFailed = false;

      // Remove the vehicle from the map when sharing stops.
      if (removeRow && (wasSharing || state.user) && supabase && state.user) {
        try {
          await supabase.from(LOCATIONS).delete().eq("driver_id", state.user.id);
        } catch (e) {
          console.warn("MEI Driver: couldn't clear location.", e);
        }
      }
      if (state.driver) updateShareUI();
    }

    /* ---------- Init ---------- */

    $("#signInForm").addEventListener("submit", signIn);
    $("#signOut").addEventListener("click", signOut);
    $("#deniedSignOut").addEventListener("click", signOut);
    $("#refresh").addEventListener("click", function () { loadRides(); });
    $("#shareBtn").addEventListener("click", function () {
      if (state.sharing) stopSharing(true);
      else startSharing();
    });
    $$(".tab").forEach(function (t) {
      t.addEventListener("click", function () { setTab(t.dataset.tab); });
    });
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) return;
      if (state.driver) loadRides();
      if (state.sharing) requestWakeLock();
    });

    if (supabase) {
      supabase.auth.onAuthStateChange(function (event) {
        if (event === "SIGNED_OUT" && state.user) {
          stopSharing(false);
          stopLive();
          resetState();
          showView("SignIn");
        }
      });
    }

    boot();
  })(window, document);
  </script>

</body>
</html>
