<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071a2f">
  <meta name="description" content="Sign in to your MEI One customer account.">
  <title>Sign In | MEI One</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>

  <style>
    :root {
      --navy: #071a2f;
      --navy-light: #102b49;
      --green: #00d68f;
      --green-dark: #00a970;
      --green-deep: #007a52;
      --lime: #c7f36b;
      --white: #ffffff;
      --muted: #64748b;
      --border: #e2e8f0;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --success: #047857;
      --success-bg: #ecfdf5;
      --info: #1d4ed8;
      --info-bg: #eff6ff;
      --transition: .2s cubic-bezier(.4, 0, .2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: var(--navy);
      background-image: 
        radial-gradient(circle at 15% 10%, rgba(0, 214, 143, .15), transparent 40%),
        radial-gradient(circle at 85% 90%, rgba(0, 169, 112, .1), transparent 40%);
      background-attachment: fixed;
      color: var(--white);
      display: flex;
      flex-direction: column;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- HEADER ---------- */
    header {
      padding: 24px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -.8px;
      color: var(--white);
      text-decoration: none;
    }

    .brand span {
      color: var(--green);
    }

    .home-link {
      color: rgba(255, 255, 255, .7);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color var(--transition);
    }

    .home-link:hover {
      color: var(--white);
    }

    /* ---------- MAIN ---------- */
    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 20px 20px 60px;
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--navy-light);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .4);
      animation: slideUp .5s cubic-bezier(.16, 1, .3, 1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .heading {
      text-align: center;
      margin-bottom: 32px;
    }

    .heading h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -.5px;
      margin-bottom: 8px;
    }

    .heading p {
      color: #aebdce;
      font-size: 14.5px;
    }

    /* ---------- FORM ---------- */
    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #aebdce;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 15px 16px;
      background: rgba(7, 26, 47, .6);
      border: 1.5px solid #38516c;
      border-radius: 10px;
      color: var(--white);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: all var(--transition);
    }

    input::placeholder {
      color: #5a738e;
    }

    input:focus {
      border-color: var(--green);
      background: rgba(7, 26, 47, .9);
      box-shadow: 0 0 0 4px rgba(0, 214, 143, .15);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 70px;
    }

    .toggle-password {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: 0;
      color: var(--green);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      padding: 8px 10px;
      border-radius: 6px;
      transition: background var(--transition);
    }

    .toggle-password:hover {
      background: rgba(0, 214, 143, .1);
    }

    .forgot-row {
      text-align: right;
      margin-top: -8px;
      margin-bottom: 24px;
    }

    .text-link {
      background: transparent;
      border: 0;
      color: var(--green);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: color var(--transition);
    }

    .text-link:hover {
      color: var(--lime);
      text-decoration: underline;
    }

    .primary-btn {
      width: 100%;
      padding: 16px;
      background: var(--green);
      border: 0;
      border-radius: 10px;
      color: var(--navy);
      font-size: 16px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      transition: all var(--transition);
      box-shadow: 0 4px 15px rgba(0, 214, 143, .3);
    }

    .primary-btn:hover:not(:disabled) {
      background: var(--lime);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 214, 143, .4);
    }

    .primary-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .primary-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* ---------- MESSAGES ---------- */
    #message {
      display: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 13.5px;
      line-height: 1.5;
      margin-bottom: 24px;
      font-weight: 500;
      overflow-wrap: anywhere;
      animation: fadeIn .3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    #message.error {
      display: block;
      background: rgba(220, 38, 38, .15);
      color: #fca5a5;
      border: 1px solid rgba(220, 38, 38, .3);
    }

    #message.success {
      display: block;
      background: rgba(4, 120, 87, .15);
      color: #6ee7b7;
      border: 1px solid rgba(4, 120, 87, .3);
    }

    #message.info {
      display: block;
      background: rgba(29, 78, 216, .15);
      color: #93c5fd;
      border: 1px solid rgba(29, 78, 216, .3);
    }

    /* ---------- FOOTER LINKS ---------- */
    .footer-links {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, .08);
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: center;
      font-size: 14px;
      color: #aebdce;
    }

    .footer-links a {
      color: var(--green);
      text-decoration: none;
      font-weight: 600;
      transition: color var(--transition);
    }

    .footer-links a:hover {
      color: var(--lime);
      text-decoration: underline;
    }

    /* Make the whole signup line clickable */
    .signup-cta {
      display: block;
      color: #aebdce;
      text-decoration: none;
      font-weight: 500;
      transition: color var(--transition);
      cursor: pointer;
    }

    .signup-cta span {
      color: var(--green);
      font-weight: 700;
      transition: color var(--transition);
    }

    .signup-cta:hover span {
      color: var(--lime);
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .auth-card {
        padding: 30px 24px;
      }
      .heading h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <header>
    <a class="brand" href="/">MEI <span>One</span></a>
    <a class="home-link" href="/">← Back to Home</a>
  </header>

  <main>
    <div class="auth-card">
      <div class="heading">
        <h1>Welcome back</h1>
        <p>Sign in to manage your bookings and services.</p>
      </div>

      <div id="message" role="alert" aria-live="polite"></div>

      <form id="authForm" novalidate>
        
        <div class="field">
          <label for="email">Email address</label>
          <input
            id="email"
            type="email"
            placeholder="you@example.com"
            autocomplete="username"
            spellcheck="false"
            required
          >
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input
              id="password"
              type="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >
            <button type="button" class="toggle-password" id="togglePassword">Show</button>
          </div>
        </div>

        <div class="forgot-row">
          <button type="button" class="text-link" id="forgotPassword">
            Forgot password?
          </button>
        </div>

        <button type="submit" class="primary-btn" id="submitBtn">
          Sign In
        </button>

      </form>

      <div class="footer-links">
        <!-- Full line is now a clickable link to /signup.html -->
        <a class="signup-cta" href="/signup.html" id="createAccountLink">
          Don't have an account? <span>Create one</span>
        </a>
      </div>
    </div>
  </main>

  <script>
    "use strict";

    const sb = window.MEI_SUPABASE;
    const $ = (id) => document.getElementById(id);

    const form = $("authForm");
    const message = $("message");
    const button = $("submitBtn");
    
    const emailInput = $("email");
    const passwordInput = $("password");
    const toggleBtn = $("togglePassword");

    // --- Show / Hide Password ---
    toggleBtn.addEventListener("click", () => {
      const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
      passwordInput.setAttribute("type", type);
      toggleBtn.textContent = type === "password" ? "Show" : "Hide";
    });

    // --- UI Helpers ---
    function showMessage(text, type = "info") {
      message.textContent = text;
      message.className = type;
    }

    function setLoading(loading) {
      button.disabled = loading;
      button.textContent = loading ? "Signing in..." : "Sign In";
    }

    // Preserve ?service= query parameter if it exists
    function getDashboardUrl() {
      const service = new URLSearchParams(window.location.search).get("service");
      return service
        ? "/customer-dashboard.html?service=" + encodeURIComponent(service)
        : "/customer-dashboard.html";
    }

    // --- Error Translation ---
    function translateError(error) {
      const msg = String(error?.message || "").toLowerCase();
      if (msg.includes("invalid login credentials")) {
        return "Incorrect email or password. Please try again.";
      }
      if (msg.includes("email not confirmed")) {
        return "Please confirm your email address before signing in.";
      }
      if (msg.includes("rate limit") || msg.includes("too many")) {
        return "Too many attempts. Please wait a moment and try again.";
      }
      return error?.message || "Something went wrong. Please try again.";
    }

    // --- Supabase Availability Check ---
    if (!sb) {
      showMessage("System configuration error. Could not connect to Supabase.", "error");
      button.disabled = true;
    }

    // --- Submit Handler ---
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!sb) return;

      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value;

      if (!email || !password) {
        return showMessage("Please enter your email and password.", "error");
      }

      setLoading(true);
      showMessage("Authenticating...", "info");

      try {
        // 1. Authenticate with Supabase
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        
        if (error) throw error;
        if (!data.user) throw new Error("Authentication failed. Please try again.");

        // 2. Verify the customer profile exists and is active
        const { data: profile, error: profileError } = await sb
          .from("profiles")
          .select("id, account_status")
          .eq("id", data.user.id)
          .maybeSingle();

        if (profileError) {
          throw new Error("Unable to verify profile: " + profileError.message);
        }

        if (!profile) {
          await sb.auth.signOut();
          throw new Error("No customer profile found. Please contact MEI One support.");
        }

        if (profile.account_status !== "active") {
          await sb.auth.signOut();
          throw new Error("Your account is not active. Please contact MEI One support.");
        }

        // 3. Success! Redirect to dashboard
        showMessage("Success! Redirecting...", "success");
        window.location.replace(getDashboardUrl());

      } catch (error) {
        console.error("Sign-in error:", error);
        showMessage(translateError(error), "error");
        setLoading(false);
      }
    });

    // --- Password Recovery ---
    $("forgotPassword").addEventListener("click", async (event) => {
      event.preventDefault();
      if (!sb) return;

      const email = emailInput.value.trim().toLowerCase();

      if (!email) {
        showMessage("Please enter your email address first.", "error");
        emailInput.focus();
        return;
      }

      try {
        showMessage("Sending reset link...", "info");

        const { error } = await sb.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + "/customer-signin.html"
        });

        if (error) throw error;

        showMessage("If this email is registered, password reset instructions have been sent.", "success");

      } catch (error) {
        console.error("Password reset error:", error);
        showMessage(translateError(error), "error");
      }
    });

    // --- Create Account Redirect (ensures /signup.html navigation) ---
    document.getElementById("createAccountLink").addEventListener("click", (event) => {
      event.preventDefault();
      window.location.href = "/signup.html";
    });

  </script>

</body>
</html>
