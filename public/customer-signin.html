<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071a2f">
  <meta name="description" content="Sign in or create your MEI One customer account.">
  <title>Customer Sign In | MEI One</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: grid;
      place-items: center;
      background: #071a2f;
      color: #fff;
      font-family: Inter, Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 35px;
      background: #102640;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
    }

    .logo {
      font-size: 27px;
      font-weight: 800;
      color: #00ff88;
      letter-spacing: -1px;
    }

    h1 { font-size: 25px; margin: 25px 0 8px; }

    p {
      color: #aebdce;
      line-height: 1.6;
      font-size: 14px;
    }

    input {
      display: block;
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border: 1px solid #38516c;
      border-radius: 9px;
      outline: none;
      background: #071a2f;
      color: #fff;
      font-size: 15px;
      font-family: inherit;
    }

    input:focus {
      border-color: #00ff88;
      box-shadow: 0 0 0 3px rgba(0,255,136,.1);
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 9px;
      background: #00ff88;
      color: #071a2f;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      font-family: inherit;
    }

    button:disabled { opacity: .6; cursor: not-allowed; }

    .switch {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #aebdce;
    }

    a { color: #00ff88; text-decoration: none; }
    a:hover { text-decoration: underline; }

    .forgot { text-align: right; margin-top: 8px; font-size: 13px; }

    #message {
      display: none;
      padding: 12px;
      margin-top: 16px;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }

    #message.error   { display: block; background: rgba(255,75,75,.12);  color: #ffaaaa; }
    #message.success { display: block; background: rgba(0,255,136,.1);  color: #00ff88; }
    #message.info    { display: block; background: rgba(255,255,255,.07); color: #d5e2ef; }

    @media (max-width: 480px) { .card { padding: 25px; } }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo">MEI ONE</div>

    <p>Everything, connected.</p>

    <h1 id="heading">Welcome back</h1>

    <p id="description">Sign in to manage your bookings and services.</p>

    <form id="authForm">

      <input
        id="email"
        type="email"
        placeholder="Email address"
        autocomplete="username"
        required
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
        required
        minlength="6"
      >

      <div class="forgot" id="forgotWrapper">
        <a href="#" id="forgotPassword">Forgot password?</a>
      </div>

      <button type="submit" id="submitBtn">Sign In</button>

    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <div class="switch">
      <span id="switchText">Not registered?</span>
      <a href="#" id="toggle">Create an account</a>
    </div>

    <div class="switch">
      <a href="/provider-signin.html">Are you a service provider?</a>
    </div>

    <div class="switch">
      <a href="/index.html">← Back to MEI One</a>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>

  <script>
    "use strict";

    const sb = window.MEI_SUPABASE;
    const $ = (id) => document.getElementById(id);

    const form        = $("authForm");
    const message     = $("message");
    const button      = $("submitBtn");
    const emailInput  = $("email");
    const passwordInput = $("password");

    const heading     = $("heading");
    const description = $("description");
    const switchText  = $("switchText");
    const toggle      = $("toggle");
    const forgotWrapper = $("forgotWrapper");

    let signup = false;

    function showMessage(text, type = "info") {
      message.textContent = text;
      message.className = type;
    }

    function setLoading(loading) {
      button.disabled = loading;
      button.textContent = loading
        ? (signup ? "Creating account..." : "Signing in...")
        : (signup ? "Create Account" : "Sign In");
    }

    function dashboardUrl() {
      const service = new URLSearchParams(location.search).get("service");
      return service
        ? "/customer-dashboard.html?service=" + encodeURIComponent(service)
        : "/customer-dashboard.html";
    }

    // ---- Toggle: Sign In <-> Create Account ----
    toggle.addEventListener("click", (e) => {
      e.preventDefault();
      signup = !signup;

      passwordInput.autocomplete = signup ? "new-password" : "current-password";
      forgotWrapper.hidden = signup;

      heading.textContent     = signup ? "Create your account" : "Welcome back";
      description.textContent = signup
        ? "Join MEI One and access our services."
        : "Sign in to manage your bookings and services.";
      switchText.textContent  = signup ? "Already registered?" : "Not registered?";
      toggle.textContent      = signup ? "Sign in" : "Create an account";
      button.textContent      = signup ? "Create Account" : "Sign In";

      showMessage("");
      message.className = "";
    });

    if (!sb) {
      showMessage("MEI One could not connect to Supabase. Check js/config.js and script order.", "error");
      button.disabled = true;
    }

    // ---- Submit: Sign In or Create Account ----
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!sb) return;

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        return showMessage("Please enter your email and password.", "error");
      }

      setLoading(true);
      showMessage("Please wait...", "info");

      try {
        if (signup) {
          // ---- CREATE ACCOUNT ----
          const { data, error } = await sb.auth.signUp({
            email,
            password,
            options: {
              emailRedirectTo: location.origin + "/customer-dashboard.html"
            }
          });
          if (error) throw error;

          // If email confirmation is disabled, session exists immediately.
          if (data.session && data.user) {
            const { data: profile, error: pe } = await sb
              .from("profiles")
              .select("id, account_status")
              .eq("id", data.user.id)
              .maybeSingle();

            if (pe) throw new Error("Account created, but profile verification failed: " + pe.message);

            if (!profile) {
              await sb.auth.signOut();
              throw new Error("Your login was created, but your customer profile was not created. Please contact MEI One support.");
            }

            if (profile.account_status !== "active") {
              await sb.auth.signOut();
              throw new Error("Your account is awaiting activation. Please contact MEI One support.");
            }

            showMessage("Your account is ready. Redirecting...", "success");
            location.replace(dashboardUrl());
          } else {
            showMessage("Registration received. Please check your email to confirm your account before signing in.", "success");
          }

        } else {
          // ---- SIGN IN ----
          const { data, error } = await sb.auth.signInWithPassword({ email, password });
          if (error) throw error;
          if (!data.user) throw new Error("Unable to authenticate your account.");

          const { data: profile, error: pe } = await sb
            .from("profiles")
            .select("id, account_status")
            .eq("id", data.user.id)
            .maybeSingle();

          if (pe) throw new Error("Unable to verify your customer profile: " + pe.message);

          if (!profile) {
            await sb.auth.signOut();
            throw new Error("No customer profile was found. Please contact MEI One support.");
          }

          if (profile.account_status !== "active") {
            await sb.auth.signOut();
            throw new Error("Your account is not active. Please contact MEI One support.");
          }

          showMessage("Sign in successful. Opening your dashboard...", "success");
          location.replace(dashboardUrl());
        }

      } catch (err) {
        console.error("MEI One customer auth error:", err);
        showMessage(err.message || "Something went wrong. Please try again.", "error");
      } finally {
        setLoading(false);
      }
    });

    // ---- Password recovery ----
    $("forgotPassword").addEventListener("click", async (e) => {
      e.preventDefault();
      if (!sb) return showMessage("Supabase is unavailable.", "error");

      const email = emailInput.value.trim();
      if (!email) return showMessage("Enter your email address first.", "error");

      try {
        showMessage("Sending password reset instructions...", "info");
        const { error } = await sb.auth.resetPasswordForEmail(email, {
          redirectTo: location.origin + "/customer-signin.html"
        });
        if (error) throw error;
        showMessage("If this email is registered, password reset instructions will be sent.", "success");
      } catch (err) {
        console.error("Password recovery error:", err);
        showMessage(err.message, "error");
      }
    });
  </script>

</body>
</html>
