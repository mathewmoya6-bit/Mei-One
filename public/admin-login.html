```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MEI One | Admin Login</title>

  <link rel="stylesheet" href="css/styles.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #06111f;
      color: #fff;
    }

    .login-page {
      width: 100%;
      max-width: 430px;
    }

    .brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 15px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 20px;

      background: #39ff88;
      color: #06111f;

      font-size: 25px;
      font-weight: 1000;

      box-shadow:
        0 0 35px rgba(57,255,136,.18);
    }

    .brand h1 {
      margin: 0;
      font-size: 29px;
      font-weight: 950;
    }

    .brand p {
      margin: 7px 0 0;
      color: #91a4b8;
      font-size: 13px;
    }

    .badge {
      display: inline-block;
      margin-top: 13px;
      padding: 7px 12px;

      border-radius: 999px;

      background: rgba(57,255,136,.08);
      border: 1px solid rgba(57,255,136,.20);

      color: #39ff88;

      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .7px;
    }

    .card {
      padding: 28px;

      border-radius: 22px;
      border: 1px solid rgba(255,255,255,.09);

      background: #0b1c30;

      box-shadow:
        0 25px 70px rgba(0,0,0,.4);
    }

    .card h2 {
      margin: 0 0 7px;
      font-size: 22px;
      font-weight: 900;
    }

    .description {
      margin: 0 0 22px;

      color: #91a4b8;

      font-size: 13px;
      line-height: 1.5;
    }

    .message {
      display: none;

      margin-bottom: 17px;
      padding: 12px 13px;

      border-radius: 11px;

      font-size: 13px;
      line-height: 1.5;
    }

    .message.error {
      display: block;

      color: #ffd7dc;

      background: rgba(255,92,112,.08);

      border: 1px solid rgba(255,92,112,.20);
    }

    .message.success {
      display: block;

      color: #d1ffdf;

      background: rgba(57,255,136,.08);

      border: 1px solid rgba(57,255,136,.20);
    }

    label {
      display: block;

      margin-bottom: 7px;

      color: #dbe7f2;

      font-size: 12px;
      font-weight: 800;

    .field {
      margin-bottom: 17px;

    input {

      outline: none;

      background: #071523;

      font-family: inherit;

      border-color: #39ff88;

        0 0 0 3px rgba(57,255,136,.07);

      position: relative;

    .password-box input {
      padding-right: 50px;
    }

    .show-password {
      position: absolute;

      top: 50%;

      transform: translateY(-50%);

      margin-top: 18px;

  </style>
</head>

<body>

  <main class="login-page">

    <div class="brand">

      <div class="logo">
        MEI
      </div>

      <h1>MEI One</h1>

      <p>Administration Portal</p>

      <div class="badge">
        🔐 Administrator Access
      </div>

    </div>


    <section class="card">

      <h2>Admin Login</h2>

      <p class="description">
        Sign in using your authorized MEI One administrator account.
      </p>


      <div
        id="message"
        class="message"
        role="alert"
      ></div>


      <form id="loginForm">

        <div class="field">

          <label for="email">
            Administrator Email
          </label>

          <input
            id="email"
            type="email"
            autocomplete="username"
            value="admin@mei-one.meipressgroup.com"
            required
          >

        </div>


        <div class="field">

          <label for="password">
            Password
          </label>

          <div class="password-box">

            <input
              id="password"
              type="password"
              autocomplete="current-password"
              placeholder="Enter password"
              required
            >

            <button
              type="button"
              id="showPassword"
              class="show-password"
            >
              👁
            </button>

          </div>

        </div>


        <button
          id="loginButton"
          class="login-button"
          type="submit"
        >
          Sign In
        </button>

      </form>


      <a
        class="back"
        href="login.html"
      >
        ← Customer Login
      </a>


      <div
        id="status"
        class="status"
      >
        MEI One secure administrator authentication
      </div>

    </section>

  </main>


  <!-- SUPABASE -->

  <script src="js/config.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

  <script src="js/supabase.js"></script>


  <script>

    (() => {

      'use strict';


      const client =
        window.supabaseClient;


      const form =
        document.getElementById(
          'loginForm'
        );

      const email =
        document.getElementById(
          'email'
        );

      const password =
        document.getElementById(
          'password'
        );

      const button =
        document.getElementById(
          'loginButton'
        );

      const message =
        document.getElementById(
          'message'
        );

      const status =
        document.getElementById(
          'status'
        );

      const showPassword =
        document.getElementById(
          'showPassword'
        );


      const ADMIN_ROLES = [
        'SUPER_ADMIN',
        'ADMIN',
        'OPERATIONS',
        'FINANCE',
        'SUPPORT',
        'AUDITOR'
      ];


      /* -----------------------------------------------------
         MESSAGE
         ----------------------------------------------------- */

      function showMessage(
        text,
        type = 'error'
      ) {

        message.textContent =
          text;

        message.className =
          'message ' + type;
      }


      /* -----------------------------------------------------
         PASSWORD
         ----------------------------------------------------- */

      showPassword.addEventListener(
        'click',
        () => {

          const visible =
            password.type === 'text';

          password.type =
            visible
              ? 'password'
              : 'text';

          showPassword.textContent =
            visible
              ? '👁'
              : '🙈';

        }
      );


      /* -----------------------------------------------------
         ADMIN CHECK
         -----------------------------------------------------

         IMPORTANT:
         This uses the already authenticated user's
         UUID. It does NOT search by email.
         ----------------------------------------------------- */

      async function verifyAdmin(userId) {

        console.log(
          'Checking MEI One administrator:',
          userId
        );


        const result =
          await client
            .from('admin_users')
            .select(
              'id,user_id,role,is_active'
            )
            .eq(
              'user_id',
              userId
            )
            .maybeSingle();


        console.log(
          'Admin lookup result:',
          result
        );


        if (result.error) {

          throw new Error(
            'Admin database check failed: ' +
            result.error.message
          );
        }


        if (!result.data) {

          throw new Error(
            'No administrator record was found for this Auth account.'
          );
        }


        if (
          result.data.is_active !== true
        ) {

          throw new Error(
            'This administrator account is inactive.'
          );
        }


        if (
          !ADMIN_ROLES.includes(
            result.data.role
          )
        ) {

          throw new Error(
            'This account does not have an authorized administrator role.'
          );
        }


        return result.data;
      }


      /* -----------------------------------------------------
         LOGIN
         ----------------------------------------------------- */

      form.addEventListener(
        'submit',
        async event => {

          event.preventDefault();


          if (!client) {

            showMessage(
              'Supabase is not initialized. Check config.js and supabase.js.'
            );

            return;
          }


          button.disabled = true;

          button.textContent =
            'Signing in...';

          status.textContent =
            'Authenticating with MEI One...';


          try {

            /* ---------------------------------------------
               AUTHENTICATE
               --------------------------------------------- */

            const auth =
              await client.auth.signInWithPassword({

                email:
                  email.value
                    .trim()
                    .toLowerCase(),

                password:
                  password.value

              });


            if (auth.error) {
              throw auth.error;
            }


            const user =
              auth.data?.user;


            if (!user) {

              throw new Error(
                'Authentication completed without a user session.'
              );
            }


            console.log(
              'Authenticated:',
              user.email,
              user.id
            );


            status.textContent =
              'Checking administrator access...';


            /* ---------------------------------------------
               ADMIN RECORD
               --------------------------------------------- */

            const admin =
              await verifyAdmin(
                user.id
              );


            console.log(
              'Administrator verified:',
              admin
            );


            showMessage(
              'Administrator verified. Opening dashboard...',
              'success'
            );


            status.textContent =
              'Access granted';


            /* ---------------------------------------------
               REDIRECT
               --------------------------------------------- */

            window.location.href =
              'admin.html';


          } catch (error) {

            console.error(
              'ADMIN LOGIN ERROR:',
              error
            );


            /*
             * Always stop the loading state.
             */

            button.disabled =
              false;

            button.textContent =
              'Sign In';


            status.textContent =
              'Authentication failed';


            showMessage(
              error?.message ||
              'Administrator login failed.'
            );

          }

        }
      );


      /* -----------------------------------------------------
         STARTUP
         ----------------------------------------------------- */

      if (!client) {

        showMessage(
          'Supabase could not be initialized.'
        );

        button.disabled =
          true;

        status.textContent =
          'Configuration error';

      }

    })();

  </script>

</body>
</html>
