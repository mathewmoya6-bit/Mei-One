<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#06111f">
  <meta name="robots" content="noindex">
  <title>Admin Login | MEI One</title>

  <style>
    :root {
      --bg: #06111f;
      --card: #0b1c30;
      --input: #071523;
      --green: #39ff88;
      --green-hover: #61ffa1;
      --text: #fff;
      --label: #dbe7f2;
      --muted: #91a4b8;
      --faint: #667b91;
      --border: rgba(255, 255, 255, .1);
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    .login-page { width: 100%; max-width: 430px; }

    /* Brand */
    .login-brand { margin-bottom: 24px; text-align: center; }

    .logo {
      display: grid;
      place-items: center;
      width: 72px;
      height: 72px;
      margin: 0 auto 15px;
      border-radius: 20px;
      color: var(--bg);
      background: var(--green);
      font-size: 25px;
      font-weight: 900;
      box-shadow: 0 0 35px rgba(57, 255, 136, .18);
    }

    .login-brand h1 { margin: 0; font-size: 29px; font-weight: 900; letter-spacing: -.02em; }
    .login-brand p { margin: 7px 0 0; color: var(--muted); font-size: 13px; }

    .badge {
      display: inline-block;
      margin-top: 13px;
      padding: 7px 12px;
      border: 1px solid rgba(57, 255, 136, .2);
      border-radius: 999px;
      color: var(--green);
      background: rgba(57, 255, 136, .08);
      font-size: 11px;
      font-weight: 800;
    }

    /* Card */
    .card {
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--card);
      box-shadow: 0 25px 70px rgba(0, 0, 0, .4);
    }

    .card h2 { margin: 0 0 7px; font-size: 22px; font-weight: 800; }
    .description { margin: 0 0 22px; color: var(--muted); font-size: 13px; line-height: 1.5; }

    /* Message */
    .message { display: none; margin-bottom: 17px; padding: 12px 13px; border-radius: 11px; font-size: 13px; line-height: 1.5; }
    .message.error   { display: block; color: #ffd7dc; background: rgba(255, 92, 112, .08); border: 1px solid rgba(255, 92, 112, .2); }
    .message.success { display: block; color: #d1ffdf; background: rgba(57, 255, 136, .08); border: 1px solid rgba(57, 255, 136, .2); }

    /* Form */
    .field { margin-bottom: 17px; }
    label { display: block; margin-bottom: 7px; color: var(--label); font-size: 12px; font-weight: 700; }

    input {
      width: 100%;
      height: 52px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      color: var(--text);
      background: var(--input);
      font: inherit;
      font-size: 14px;
    }
    input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(57, 255, 136, .1); }

    .password-box { position: relative; }
    .password-box input { padding-right: 52px; }

    .show-password {
      position: absolute;
      top: 50%;
      right: 7px;
      width: 38px;
      height: 38px;
      transform: translateY(-50%);
      border: 0;
      border-radius: 9px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
    }
    .show-password:hover { color: var(--green); background: rgba(255, 255, 255, .05); }

    .login-button {
      width: 100%;
      height: 53px;
      margin-top: 2px;
      border: 0;
      border-radius: 13px;
      color: var(--bg);
      background: var(--green);
      font: inherit;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      transition: background 180ms ease;
    }
    .login-button:hover { background: var(--green-hover); }
    .login-button:disabled { opacity: .7; cursor: wait; }

    :focus-visible { outline: 3px solid rgba(57, 255, 136, .45); outline-offset: 2px; }

    .back { display: block; margin-top: 19px; color: var(--muted); font-size: 12px; text-align: center; text-decoration: none; }
    .back:hover { color: var(--green); }

    .status { margin-top: 18px; color: var(--faint); font-size: 11px; text-align: center; }
  </style>
</head>

<body>
  <main class="login-page">

    <div class="login-brand">
      <div class="logo">MEI</div>
      <h1>MEI One</h1>
      <p>Administration Portal</p>
      <div class="badge">🔐 Administrator access</div>
    </div>

    <section class="card">
      <h2>Admin login</h2>
      <p class="description">Sign in with your authorised MEI One administrator account.</p>

      <div id="message" class="message" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Administrator email</label>
          <input id="email" type="email" autocomplete="username"
                 value="admin@mei-one.meipressgroup.com" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="password-box">
            <input id="password" type="password" autocomplete="current-password"
                   placeholder="Enter password" required>
            <button type="button" id="showPassword" class="show-password" aria-label="Show password">👁</button>
          </div>
        </div>

        <button id="loginButton" class="login-button" type="submit">Sign in</button>
      </form>

      <a class="back" href="login.html">← Customer login</a>
      <div id="status" class="status" aria-live="polite">MEI One secure administrator authentication</div>
    </section>

  </main>

  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js"></script>

  <script>
    (() => {
      'use strict';

      const client = window.supabaseClient;

      const $ = (id) => document.getElementById(id);
      const form = $('loginForm');
      const emailInput = $('email');
      const passwordInput = $('password');
      const button = $('loginButton');
      const message = $('message');
      const status = $('status');
      const toggle = $('showPassword');

      const ADMIN_ROLES = ['SUPER_ADMIN', 'ADMIN', 'OPERATIONS', 'FINANCE', 'SUPPORT', 'AUDITOR'];

      function showMessage(text, type = 'error') {
        message.textContent = text;
        message.className = 'message ' + type;
      }

      function setBusy(busy, label, statusText) {
        button.disabled = busy;
        button.textContent = label;
        if (statusText) status.textContent = statusText;
      }

      toggle.addEventListener('click', () => {
        const visible = passwordInput.type === 'text';
        passwordInput.type = visible ? 'password' : 'text';
        toggle.textContent = visible ? '👁' : '🙈';
        toggle.setAttribute('aria-label', visible ? 'Show password' : 'Hide password');
      });

      // Looks up the admin record by Auth user id (never by email).
      async function verifyAdmin(userId) {
        const { data, error } = await client
          .from('admin_users')
          .select('id,user_id,role,is_active')
          .eq('user_id', userId)
          .maybeSingle();

        if (error) throw new Error('Admin check failed: ' + error.message);
        if (!data) throw new Error('No administrator record exists for this account.');
        if (data.is_active !== true) throw new Error('This administrator account is inactive.');
        if (!ADMIN_ROLES.includes(data.role)) throw new Error('This account does not have an authorised administrator role.');

        return data;
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        showMessage('', '');
        message.className = 'message';

        if (!client) {
          showMessage('Supabase is not initialised. Check js/config.js and js/supabase.js.');
          return;
        }

        const email = emailInput.value.trim().toLowerCase();
        const password = passwordInput.value;

        if (!email || !password) {
          showMessage('Enter your email and password.');
          return;
        }

        setBusy(true, 'Signing in…', 'Authenticating…');

        try {
          const { data, error } = await client.auth.signInWithPassword({ email, password });
          if (error) throw error;
          if (!data?.user) throw new Error('Sign-in finished without a user session.');

          setBusy(true, 'Signing in…', 'Checking administrator access…');

          try {
            await verifyAdmin(data.user.id);
          } catch (adminError) {
            await client.auth.signOut(); // do not leave a non-admin session behind
            throw adminError;
          }

          showMessage('Administrator verified. Opening dashboard…', 'success');
          status.textContent = 'Access granted';
          window.location.href = 'admin.html';

        } catch (error) {
          console.error('Admin login error:', error);
          setBusy(false, 'Sign in', 'Sign-in failed');
          showMessage(error?.message || 'Administrator sign-in failed.');
        }
      });

      if (!client) {
        showMessage('Supabase could not be initialised.');
        setBusy(true, 'Unavailable', 'Configuration error');
      }
    })();
  </script>
</body>
</html>
