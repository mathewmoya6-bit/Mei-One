<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login | MEI One</title>

  <meta
    name="description"
    content="Sign in to MEI One and access your connected services."
  >

  <link rel="stylesheet" href="css/styles.css">

  <style>
    :root {
      --mei-navy: #07111f;
      --mei-navy-2: #0c1c31;
      --mei-green: #b7ff00;
      --mei-green-2: #8fd600;
      --mei-white: #ffffff;
      --mei-muted: #91a0b5;
      --mei-border: rgba(255,255,255,.10);
      --mei-danger: #ff5c5c;
      --mei-card: rgba(12,28,49,.88);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, Arial, Helvetica, sans-serif;
      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(183,255,0,.09),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 85%,
          rgba(0,174,255,.08),
          transparent 30%
        ),
        var(--mei-navy);
      color: var(--mei-white);
    }

    .login-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 30px 20px;
    }

    .login-shell {
      width: min(100%, 440px);
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 15px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: var(--mei-green);
      color: var(--mei-navy);
      font-size: 24px;
      font-weight: 950;
      box-shadow: 0 12px 40px rgba(183,255,0,.18);
    }

    .brand h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 950;
      letter-spacing: -1px;
    }

    .brand p {
      margin: 8px 0 0;
      color: var(--mei-muted);
      font-size: 14px;
    }

    .login-card {
      padding: 30px;
      background: var(--mei-card);
      border: 1px solid var(--mei-border);
      border-radius: 24px;
      box-shadow: 0 30px 80px rgba(0,0,0,.30);
      backdrop-filter: blur(18px);
    }

    .login-card h2 {
      margin: 0 0 8px;
      font-size: 24px;
      font-weight: 900;
    }

    .login-card .intro {
      margin: 0 0 24px;
      color: var(--mei-muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .field {
      margin-bottom: 17px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 800;
    }

    .field input {
      width: 100%;
      height: 50px;
      padding: 0 15px;
      border: 1px solid var(--mei-border);
      border-radius: 12px;
      outline: none;
      background: rgba(255,255,255,.055);
      color: var(--mei-white);
      font-size: 15px;
    }

    .field input:focus {
      border-color: var(--mei-green);
      box-shadow: 0 0 0 3px rgba(183,255,0,.10);
    }

    .password-row {
      position: relative;
    }

    .password-row input {
      padding-right: 82px;
    }

    .password-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: var(--mei-green);
      cursor: pointer;
      font-size: 12px;
      font-weight: 800;
    }

    .login-options {
      display: flex;
      justify-content: flex-end;
      margin: 2px 0 20px;
    }

    .login-options button {
      border: 0;
      background: transparent;
      color: var(--mei-green);
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
    }

    .submit-button {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 13px;
      background: var(--mei-green);
      color: var(--mei-navy);
      font-size: 15px;
      font-weight: 950;
      cursor: pointer;
      transition: .2s ease;
    }

    .submit-button:hover {
      background: var(--mei-green-2);
      transform: translateY(-1px);
    }

    .submit-button:disabled {
      opacity: .55;
      cursor: wait;
      transform: none;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
    }

    .message.show {
      display: block;
    }

    .message.error {
      color: #ffdede;
      background: rgba(255,92,92,.12);
      border: 1px solid rgba(255,92,92,.25);
    }

    .message.success {
      color: #eaffb8;
      background: rgba(183,255,0,.09);
      border: 1px solid rgba(183,255,0,.20);
    }

    .signup-link {
      margin-top: 22px;
      text-align: center;
      color: var(--mei-muted);
      font-size: 13px;
    }

    .signup-link a {
      color: var(--mei-green);
      text-decoration: none;
      font-weight: 800;
    }

    .back-home {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: var(--mei-muted);
      text-decoration: none;
      font-size: 13px;
    }

    .back-home:hover {
      color: var(--mei-white);
    }

    .security-note {
      margin-top: 22px;
      text-align: center;
      color: #68778d;
      font-size: 11px;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 23px;
        border-radius: 20px;
      }

      .brand h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <main class="login-page">
    <div class="login-shell">

      <div class="brand">
        <div class="brand-logo">MEI</div>
        <h1>MEI One</h1>
        <p>One platform. Connected services.</p>
      </div>

      <section class="login-card">

        <h2>Welcome back</h2>

        <p class="intro">
          Sign in to access your MEI One account and services.
        </p>

        <div
          id="loginMessage"
          class="message"
          role="alert"
          aria-live="polite"
        ></div>

        <form id="loginForm" novalidate>

          <div class="field">
            <label for="email">Email address</label>

            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="you@example.com"
              required
            >
          </div>

          <div class="field">
            <label for="password">Password</label>

            <div class="password-row">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="Enter your password"
                required
              >

              <button
                type="button"
                id="togglePassword"
                class="password-toggle"
              >
                SHOW
              </button>
            </div>
          </div>

          <div class="login-options">
            <button
              type="button"
              id="forgotPassword"
            >
              Forgot password?
            </button>
          </div>

          <button
            type="submit"
            id="loginButton"
            class="submit-button"
          >
            Sign In
          </button>

        </form>

        <div class="signup-link">
          Don't have an account?
          <a href="signup.html">Create account</a>
        </div>

        <a
          href="index.html"
          class="back-home"
        >
          ← Back to MEI One
        </a>

        <div class="security-note">
          Your authentication is handled securely through Supabase Auth.
        </div>

      </section>

    </div>
  </main>

  <script src="js/config.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

  <script src="js/supabase.js"></script>
  <script src="js/site.js"></script>
  <script src="js/auth.js"></script>

</body>
</html>
