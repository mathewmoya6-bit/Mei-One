<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071a2f">
  <meta name="robots" content="noindex,nofollow">
  <title>Provider Dashboard | MEI One</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <style>
    :root { --navy:#071a2f; --navy2:#102b49; --green:#00d68f; --green-dark:#00ad73; --bg:#f4f7fa; --text:#172b40; --muted:#64748b; --border:#e2e8f0; --shadow:0 8px 24px rgba(7,26,47,.08); --radius:15px; font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    body { margin:0; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; }
    button { font:inherit; cursor:pointer; }
    .topbar { background:var(--navy); color:#fff; padding:15px 5%; display:flex; align-items:center; justify-content:space-between; gap:15px; box-shadow:0 4px 12px #0002; }
    .brand { font-size:22px; font-weight:800; letter-spacing:-.7px; }
    .brand span { color:var(--green); }
    .logout { background:transparent; border:1px solid #ffffff45; color:#fff; padding:9px 15px; border-radius:9px; font-weight:600; }
    .container { width:min(900px,92%); margin:28px auto 55px; }
    .status-card { background:linear-gradient(135deg,var(--navy),var(--navy2)); color:#fff; border-radius:var(--radius); padding:24px; display:flex; justify-content:space-between; align-items:center; gap:15px; flex-wrap:wrap; box-shadow:var(--shadow); margin-bottom:24px; }
    .status-card h1 { margin:0 0 6px; font-size:22px; }
    .status-card p { margin:0; font-size:13px; color:#c5d4e2; }
    .toggle { background:#334155; color:#fff; border:0; padding:13px 22px; border-radius:30px; font-weight:800; font-size:14px; }
    .toggle.on { background:var(--green); color:var(--navy); }
    h2 { font-size:18px; margin:26px 0 12px; font-weight:800; }
    .list { display:grid; gap:14px; }
    .card { background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:18px; box-shadow:0 2px 8px #071a2f08; }
    .card h3 { margin:0 0 4px; font-size:15px; color:var(--navy); }
    .card p { margin:6px 0; font-size:13px; line-height:1.5; overflow-wrap:anywhere; white-space:pre-line; }
    .card p strong { color:var(--muted); }
    .top { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
    .badge { background:#eafaf4; color:#047857; border-radius:20px; padding:5px 10px; font-size:11px; font-weight:800; white-space:nowrap; }
    .badge.warn { background:#fef9c3; color:#a16207; }
    .actions { display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; }
    .btn { border:0; border-radius:10px; padding:11px 16px; font-size:13.5px; font-weight:750; }
    .btn.go { background:var(--green); color:var(--navy); }
    .btn.no { background:#fff; border:1px solid var(--border); color:var(--text); }
    .btn:disabled { opacity:.55; cursor:not-allowed; }
    a.btn { text-decoration:none; display:inline-block; background:#eff6ff; color:#1d4ed8; }
    .msg { padding:12px 14px; border-radius:10px; font-size:13px; margin:12px 0; display:none; }
    .msg.show { display:block; }
    .msg.error { background:#fef2f2; color:#b91c1c; border:1px solid #fecaca; }
    .msg.info { background:#eff6ff; color:#1d4ed8; border:1px solid #bfdbfe; }
    .empty { text-align:center; color:var(--muted); padding:28px 18px; background:#fff; border:1px dashed #cbd5e1; border-radius:var(--radius); font-size:13px; line-height:1.6; }
  </style>
</head>
<body>
<header class="topbar">
  <div class="brand">MEI <span>One</span> · Provider</div>
  <button class="logout" id="logoutBtn" type="button">Sign out</button>
</header>

<main class="container">
  <div class="status-card">
    <div>
      <h1>Hi, <span id="pname">Provider</span></h1>
      <p id="pstate">You are offline. Go online to receive nearby requests.</p>
    </div>
    <button class="toggle" id="toggleBtn" type="button">Go online</button>
  </div>

  <div id="msg" class="msg" role="status"></div>

  <h2>New requests near you</h2>
  <div id="offers" class="list"><div class="empty">Go online to receive requests.</div></div>

  <h2>My active jobs</h2>
  <div id="jobs" class="list"><div class="empty">No active jobs.</div></div>
</main>

<script>
(() => {
  "use strict";
  const SIGNIN_PATH = "/customer-signin.html";
  const PING_MS = 20000;
  const $ = id => document.getElementById(id);

  let sb, me, provider;
  let online = false;
  let pos = null;
  let watchId = null;
  let pingTimer = null;
  let clockTimer = null;
  let pollTimer = null;
  let channel = null;
  let offers = [];

  const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" })[c]);

  function say(text, type = "info") {
    const el = $("msg");
    el.textContent = text;
    el.className = "msg show " + type;
  }
  function clearSay() { $("msg").className = "msg"; $("msg").textContent = ""; }

  // ---------- Location + online state ----------
  function startWatch() {
    if (!navigator.geolocation) throw new Error("This device does not support location.");
    return new Promise((resolve, reject) => {
      watchId = navigator.geolocation.watchPosition(p => {
        const first = !pos;
        pos = { lat: p.coords.latitude, lng: p.coords.longitude };
        if (first) resolve();
      }, err => {
        reject(new Error(err.code === 1
          ? "Location permission denied. Allow location to receive nearby requests."
          : "Could not get your location."));
      }, { enableHighAccuracy: true, maximumAge: 10000, timeout: 15000 });
    });
  }

  async function ping(flag) {
    if (!pos) return;
    const { error } = await sb.rpc("provider_ping", { p_lat: pos.lat, p_lng: pos.lng, p_online: flag });
    if (error) { console.error("Ping failed:", error); say("Could not update your location: " + error.message, "error"); }
  }

  async function goOnline() {
    $("toggleBtn").disabled = true;
    clearSay();
    try {
      await startWatch();
      await ping(true);
      online = true;
      pingTimer = setInterval(() => ping(true), PING_MS);
      await loadOffers();
    } catch (e) {
      stopWatch();
      say(e.message, "error");
    }
    $("toggleBtn").disabled = false;
    renderState();
  }

  async function goOffline() {
    $("toggleBtn").disabled = true;
    await ping(false);
    online = false;
    clearInterval(pingTimer);
    stopWatch();
    offers = [];
    renderOffers();
    $("toggleBtn").disabled = false;
    renderState();
  }

  function stopWatch() {
    if (watchId != null) navigator.geolocation.clearWatch(watchId);
    watchId = null;
    pos = null;
  }

  function renderState() {
    $("toggleBtn").textContent = online ? "Go offline" : "Go online";
    $("toggleBtn").classList.toggle("on", online);
    $("pstate").textContent = online
      ? "You are online. Keep this page open to receive requests."
      : "You are offline. Go online to receive nearby requests.";
  }

  // ---------- Offers ----------
  async function loadOffers() {
    if (!online) return;
    const { data, error } = await sb
      .from("request_offers")
      .select("id,request_id,distance_km,expires_at,service_requests(id,title,details,pickup,dropoff,notes,service,customer_name,latitude,longitude)")
      .eq("provider_id", me.id)
      .eq("status", "pending")
      .gt("expires_at", new Date().toISOString())
      .order("distance_km", { ascending: true });

    if (error) { console.error(error); say("Could not load offers: " + error.message, "error"); return; }
    offers = data || [];
    renderOffers();
  }

  function secondsLeft(o) { return Math.max(0, Math.round((new Date(o.expires_at) - Date.now()) / 1000)); }

  function renderOffers() {
    const live = offers.filter(o => secondsLeft(o) > 0);
    if (!online) { $("offers").innerHTML = '<div class="empty">Go online to receive requests.</div>'; return; }
    if (!live.length) { $("offers").innerHTML = '<div class="empty">No requests right now. New ones appear here instantly.</div>'; return; }

    $("offers").innerHTML = live.map(o => {
      const r = o.service_requests || {};
      return `
        <article class="card" data-offer="${esc(o.id)}">
          <div class="top">
            <div><h3>${esc(r.title || r.service || "Service request")}</h3>
              <p style="margin:0;color:var(--muted)">${esc(o.distance_km)} km away</p></div>
            <span class="badge warn" data-timer="${esc(o.id)}">${secondsLeft(o)}s</span>
          </div>
          ${r.pickup ? `<p><strong>Location / pickup:</strong> ${esc(r.pickup)}</p>` : ""}
          ${r.dropoff ? `<p><strong>Destination:</strong> ${esc(r.dropoff)}</p>` : ""}
          ${r.details ? `<p><strong>Details:</strong> ${esc(r.details)}</p>` : ""}
          <div class="actions">
            <button class="btn go" data-accept="${esc(o.request_id)}" type="button">Accept</button>
            <button class="btn no" data-decline="${esc(o.id)}" type="button">Decline</button>
          </div>
        </article>`;
    }).join("");
  }

  function tick() {
    let expired = false;
    offers.forEach(o => {
      const el = document.querySelector(`[data-timer="${o.id}"]`);
      const s = secondsLeft(o);
      if (el) el.textContent = s + "s";
      if (s <= 0) expired = true;
    });
    if (expired) { offers = offers.filter(o => secondsLeft(o) > 0); renderOffers(); }
  }

  async function accept(requestId, btn) {
    btn.disabled = true;
    const { error } = await sb.rpc("accept_request", { p_request_id: requestId });
    if (error) { say(error.message, "error"); btn.disabled = false; }
    else { clearSay(); }
    await Promise.all([loadOffers(), loadJobs()]);
  }

  async function decline(offerId, btn) {
    btn.disabled = true;
    const { error } = await sb.rpc("decline_offer", { p_offer_id: offerId });
    if (error) say(error.message, "error");
    await loadOffers();
  }

  // ---------- Active jobs ----------
  async function loadJobs() {
    const { data, error } = await sb
      .from("service_requests")
      .select("id,title,details,pickup,dropoff,notes,status,customer_name,latitude,longitude")
      .eq("provider_id", me.id)
      .in("status", ["accepted", "in_progress"])
      .order("accepted_at", { ascending: false });

    if (error) { console.error(error); say("Could not load jobs: " + error.message, "error"); return; }
    if (!data?.length) { $("jobs").innerHTML = '<div class="empty">No active jobs.</div>'; return; }

    $("jobs").innerHTML = data.map(r => {
      const nav = r.latitude != null && r.longitude != null
        ? `<a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(r.latitude + "," + r.longitude)}">Navigate</a>` : "";
      const next = r.status === "accepted"
        ? `<button class="btn go" data-status="in_progress" data-id="${esc(r.id)}" type="button">Start job</button>`
        : `<button class="btn go" data-status="completed" data-id="${esc(r.id)}" type="button">Mark completed</button>`;
      return `
        <article class="card">
          <div class="top">
            <div><h3>${esc(r.title || "Service request")}</h3>
              <p style="margin:0;color:var(--muted)">Customer: ${esc(r.customer_name || "—")}</p></div>
            <span class="badge">${esc(r.status.replace(/_/g, " "))}</span>
          </div>
          ${r.pickup ? `<p><strong>Location / pickup:</strong> ${esc(r.pickup)}</p>` : ""}
          ${r.dropoff ? `<p><strong>Destination:</strong> ${esc(r.dropoff)}</p>` : ""}
          ${r.details ? `<p><strong>Details:</strong> ${esc(r.details)}</p>` : ""}
          ${r.notes ? `<p><strong>Notes:</strong> ${esc(r.notes)}</p>` : ""}
          <div class="actions">${nav}${next}</div>
        </article>`;
    }).join("");
  }

  async function setStatus(id, status, btn) {
    btn.disabled = true;
    const { error } = await sb.rpc("set_request_status", { p_request_id: id, p_status: status });
    if (error) say(error.message, "error");
    await loadJobs();
  }

  // ---------- Init ----------
  async function init() {
    if (!window.supabase || !window.MEI_SUPABASE || typeof window.MEI_SUPABASE.from !== "function") {
      document.body.innerHTML = '<main style="max-width:700px;margin:60px auto;padding:25px;font-family:Arial"><h2>Configuration error</h2><p>Supabase did not initialize. Check /js/config.js.</p></main>';
      return;
    }
    sb = window.MEI_SUPABASE;

    const { data: s } = await sb.auth.getSession();
    if (!s?.session) { location.replace(SIGNIN_PATH); return; }
    const { data: u, error: ue } = await sb.auth.getUser();
    if (ue || !u?.user) { location.replace(SIGNIN_PATH); return; }
    me = u.user;

    const { data: p, error: pe } = await sb.from("provider_profiles").select("*").eq("user_id", me.id).maybeSingle();
    if (pe) { say("Could not load your provider profile: " + pe.message, "error"); return; }
    if (!p || !p.is_active) {
      document.querySelector(".container").innerHTML =
        '<div class="empty"><strong>This account is not registered as a service provider.</strong><br>Contact MEI One support to be approved.</div>';
      return;
    }
    provider = p;
    $("pname").textContent = p.display_name || (me.email || "Provider").split("@")[0];

    await loadJobs();
    renderState();

    channel = sb.channel("provider-" + me.id)
      .on("postgres_changes", { event: "*", schema: "public", table: "request_offers", filter: "provider_id=eq." + me.id }, loadOffers)
      .on("postgres_changes", { event: "*", schema: "public", table: "service_requests", filter: "provider_id=eq." + me.id }, loadJobs)
      .subscribe();

    clockTimer = setInterval(tick, 1000);
    pollTimer = setInterval(() => { if (online && !document.hidden) loadOffers(); }, 10000);
  }

  $("toggleBtn").addEventListener("click", () => online ? goOffline() : goOnline());
  $("offers").addEventListener("click", e => {
    const a = e.target.closest("[data-accept]"); if (a) return accept(a.dataset.accept, a);
    const d = e.target.closest("[data-decline]"); if (d) return decline(d.dataset.decline, d);
  });
  $("jobs").addEventListener("click", e => {
    const b = e.target.closest("[data-status]"); if (b) setStatus(b.dataset.id, b.dataset.status, b);
  });
  $("logoutBtn").addEventListener("click", async () => {
    if (online) await ping(false);
    await sb.auth.signOut();
    location.replace(SIGNIN_PATH);
  });
  window.addEventListener("pagehide", () => {
    clearInterval(pingTimer); clearInterval(clockTimer); clearInterval(pollTimer);
    if (channel && sb) sb.removeChannel(channel);
  });

  init().catch(e => { console.error(e); say("Could not start: " + (e?.message || e), "error"); });
})();
</script>
</body>
</html>
